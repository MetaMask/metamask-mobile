# GitHub Secrets a GitHub environment may leave unset, keyed by environment.
#
# scripts/validate-step-secrets.js fails a bundling step when a secret it maps is
# not set in the job's GitHub environment, unless the secret is listed here for
# that environment. A secret that is set is always checked for malformed values
# (trailing whitespace, CR, invisible characters), listed here or not.
#
# Add an entry only when the builds that use the environment do not need the
# secret. Leaving a needed secret unset ships the app with an empty value.

# Never saved in the Flask environments; Flask builds have always shipped without them.
build-flask-prod: &flask
  - MM_KLIPY_API_KEY
  - MM_BRAZE_API_KEY_IOS
  - MM_BRAZE_API_KEY_ANDROID
  - MM_BRAZE_SDK_ENDPOINT
build-flask-uat: *flask
build-flask-e2e: *flask

# The TestMu repack step bakes this into its without-SRP pack; these environments
# reach that step and have never had it.
build-dev:
  - E2E_BYOA_AUTH_SECRET
build-exp:
  - E2E_BYOA_AUTH_SECRET
build-rc:
  - E2E_BYOA_AUTH_SECRET
