# Builds a main-e2e RELEASE APK that includes arm64-v8a native libs, so the
# CI-equivalent binary can be installed on Apple Silicon (arm64) emulators to
# reproduce CI E2E failures locally. Runs on weekdays; skips when main has not moved.
name: Build Android arm64 E2E (scheduled)

on:
  schedule:
    - cron: '0 8 * * 1-5' # 08:00 UTC, Monday-Friday
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  check-changes:
    name: Decide whether to build
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.decide.outputs.should-build }}
    steps:
      - name: Decide whether a new build is needed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Manual runs always build.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual trigger; building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compare current HEAD to the head SHA of the last SUCCESSFUL run of this workflow.
          last_sha=$(gh api \
            "/repos/$REPO/actions/workflows/build-android-arm64-scheduled.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          echo "current_sha=$CURRENT_SHA"
          echo "last_successful_sha=$last_sha"
          if [[ -n "$last_sha" && "$last_sha" == "$CURRENT_SHA" ]]; then
            echo "main has not advanced since the last successful build; skipping."
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits (or no prior successful run); building."
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build arm64 E2E APK
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should-build == 'true' }}
    permissions:
      contents: read
      id-token: write # required for AWS OIDC role assumption when fetching signing keystores
      actions: read
    uses: ./.github/workflows/build-android-e2e.yml
    with:
      build_type: main
      metamask_environment: e2e
      include_arm64: true
      # Follows standard resolution (NAMESPACE_RUNNER_ANDROID -> NAMESPACE_RUNNER_PROVIDER).
      # When resolved to namespace, build-android-e2e.yml dual-uploads the arm64 release APK
      # to Namespace and GitHub stores so gh run download keeps working. On current rollback,
      # only the GitHub store receives the APK (sufficient for local repro).
      runner_provider: inherit
    secrets:
      FEATURES_ANNOUNCEMENTS_ACCESS_TOKEN: ${{ secrets.FEATURES_ANNOUNCEMENTS_ACCESS_TOKEN }}
      FEATURES_ANNOUNCEMENTS_SPACE_ID: ${{ secrets.FEATURES_ANNOUNCEMENTS_SPACE_ID }}
      GOOGLE_SERVICES_B64_ANDROID: ${{ secrets.GOOGLE_SERVICES_B64_ANDROID }}
      GOOGLE_SERVICES_B64_IOS: ${{ secrets.GOOGLE_SERVICES_B64_IOS }}
      MM_INFURA_PROJECT_ID: ${{ secrets.MM_INFURA_PROJECT_ID }}
      MM_SENTRY_AUTH_TOKEN: ${{ secrets.MM_SENTRY_AUTH_TOKEN }}
      MM_SENTRY_DSN_TEST: ${{ secrets.MM_SENTRY_DSN_TEST }}
      SEGMENT_DELETE_API_SOURCE_ID_FLASK: ${{ secrets.SEGMENT_DELETE_API_SOURCE_ID_FLASK }}
      SEGMENT_DELETE_API_SOURCE_ID_QA: ${{ secrets.SEGMENT_DELETE_API_SOURCE_ID_QA }}
      SEGMENT_PROXY_URL_FLASK: ${{ secrets.SEGMENT_PROXY_URL_FLASK }}
      SEGMENT_PROXY_URL_QA: ${{ secrets.SEGMENT_PROXY_URL_QA }}
      SEGMENT_REGULATIONS_ENDPOINT_FLASK: ${{ secrets.SEGMENT_REGULATIONS_ENDPOINT_FLASK }}
      SEGMENT_REGULATIONS_ENDPOINT_QA: ${{ secrets.SEGMENT_REGULATIONS_ENDPOINT_QA }}
      SEGMENT_WRITE_KEY_FLASK: ${{ secrets.SEGMENT_WRITE_KEY_FLASK }}
      SEGMENT_WRITE_KEY_QA: ${{ secrets.SEGMENT_WRITE_KEY_QA }}
