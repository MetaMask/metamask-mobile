name: Block stable-main to main PRs

on:
  # zizmor: ignore[dangerous-triggers] calls trusted workflow code and reads PR metadata only; never checks out or executes PR code
  pull_request_target:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        ready_for_review,
        converted_to_draft,
      ]
    branches:
      - main
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

permissions: {}

concurrency:
  group: >-
    pr-policy-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  cursor-approval-policy:
    name: Cursor approval policy
    if: >-
      github.event_name != 'merge_group' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'cursor[bot]'
    permissions:
      pull-requests: read
    uses: ./.github/workflows/require-two-approvals-for-cursor-prs.yml # zizmor: ignore[self-repository] actionlint 1.7.1 rejects $/

  check-branch:
    name: Block stable-main-X.Y.Z to main
    needs: cursor-approval-policy
    # Keep this job name stable: the default-branch ruleset requires this status.
    if: >-
      always() &&
      (
        github.event_name == 'merge_group' ||
        (
          github.event.pull_request.base.ref == 'main' &&
          (
            startsWith(github.event.pull_request.head.ref, 'stable-main-') ||
            github.event.pull_request.user.login == 'cursor[bot]'
          )
        )
      )
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Enforce Cursor approval policy
        if: >-
          github.event_name != 'merge_group' &&
          github.event.pull_request.user.login == 'cursor[bot]'
        env:
          APPROVAL_POLICY_RESULT: ${{ needs.cursor-approval-policy.result }}
        run: |
          if [[ "$APPROVAL_POLICY_RESULT" != "success" ]]; then
            echo "::error::Cursor approval policy finished with result: $APPROVAL_POLICY_RESULT"
            exit 1
          fi

      - name: Check exact branch pattern
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          # Check if source branch matches exact pattern: stable-main-X.Y.Z
          if [[ "$TARGET_BRANCH" == "main" && "$SOURCE_BRANCH" =~ ^stable-main-[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ ERROR: Manual merge from stable-main-X.Y.Z branches to main are not allowed!"
            echo "Source branch '$SOURCE_BRANCH' matches the blocked pattern."
            echo "These branches should only be merged via automated workflows, comment 'Merge my PR' to merge."
            exit 1
          fi

          echo "✅ Branch check passed"
