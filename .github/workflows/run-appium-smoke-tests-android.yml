# Appium Smoke Tests — Android
#
# One reusable job per Appium smoke tag (fixed total_splits by default).
# With appium-dynamic-shards, run-appium-e2e-workflow plans shard count from timings.
# Invoked from ci.yml when build-android-apks succeeds (PR + main).

name: Appium Smoke Tests (Android)

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector (e.g. ["SmokeAccounts"] or ["ALL"])'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for PR flakiness detection'
        required: false
        type: string
        default: ''
      dynamic_shards:
        description: 'When true (appium-dynamic-shards label), choose shard count from timings'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for PR flakiness detection'
        required: false
        type: string
        default: ''
      dynamic_shards:
        description: 'When true (appium-dynamic-shards label), choose shard count from timings'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: read

jobs:
  appium-accounts-android-smoke:
    if: >-
      ${{
        !cancelled() &&
        (contains(fromJson(inputs.selected_tags), 'ALL') ||
         contains(fromJson(inputs.selected_tags), 'SmokeAccounts'))
      }}
    uses: ./.github/workflows/run-appium-e2e-workflow.yml
    with:
      test-suite-name: appium-accounts-android-smoke
      platform: android
      test_suite_tag: SmokeAccounts
      total_splits: 2
      test-timeout-minutes: 25
      build_type: ${{ inputs.build_type }}
      metamask_environment: ${{ inputs.metamask_environment }}
      runner_provider: ${{ inputs.runner_provider }}
      changed_spec_files: ${{ inputs.changed_spec_files }}
      dynamic_shards: ${{ inputs.dynamic_shards }}
    secrets: inherit

  appium-perps-android-smoke:
