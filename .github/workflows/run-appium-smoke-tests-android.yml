# Appium Smoke Tests — Android
#
# Fans out one reusable job per Appium smoke tag. Add a matching job below.
# Invoked from ci.yml when build-android-apks succeeds (PR + main).

name: Appium Smoke Tests (Android)

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector (e.g. ["SmokeAccounts"] or ["ALL"])'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for PR flakiness detection'
        required: false
        type: string
        default: ''
      android-emulator-boot-mode:
        description: 'Android emulator boot mode: auto (snapshot when cached, else cold), snapshot (require), cold (kill switch)'
        required: false
        type: string
        default: 'auto'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for PR flakiness detection'
        required: false
        type: string
        default: ''
      android-emulator-boot-mode:
        description: 'Android emulator boot mode: auto (snapshot when cached, else cold), snapshot (require), cold (kill switch)'
        required: false
        type: string
        default: 'auto'

permissions:
  contents: read
  checks: write
  # write: nested prime workflow saves golden AVD via actions/cache.
  actions: write
  pull-requests: read

jobs:
  # Boots/stabilizes/saves the golden emulator snapshot once per system image
  # onto the shared cache volume, so shards quick-boot instead of paying a
  # wiped cold boot per shard. Shards tolerate this job failing: their
  # emulator boot mode `auto` then falls back to the historical cold boot.
  prime-android-emulator-snapshot:
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/prime-appium-e2e-android-emulator.yml
    with:
      runner_provider: ${{ inputs.runner_provider }}

  appium-accounts-android-smoke:
    needs: prime-android-emulator-snapshot
    # always(): run even when priming failed — boot mode auto falls back to cold.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (contains(fromJson(inputs.selected_tags), 'ALL') ||
         contains(fromJson(inputs.selected_tags), 'SmokeAccounts'))
      }}
    strategy:
      matrix:
        split: [1, 2]
      fail-fast: false
    uses: ./.github/workflows/run-appium-e2e-workflow.yml
    with:
      test-suite-name: appium-accounts-android-smoke-${{ matrix.split }}
      platform: android
      test_suite_tag: SmokeAccounts
      split_number: ${{ matrix.split }}
      total_splits: 2
      test-timeout-minutes: 25
      build_type: ${{ inputs.build_type }}
      metamask_environment: ${{ inputs.metamask_environment }}
      runner_provider: ${{ inputs.runner_provider }}
      changed_spec_files: ${{ inputs.changed_spec_files }}
      android-emulator-boot-mode: ${{ inputs.android-emulator-boot-mode }}
    secrets: inherit

  appium-perps-android-smoke:
    needs: prime-android-emulator-snapshot
    # always(): run even when priming failed — boot mode auto falls back to cold.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        (contains(fromJson(inputs.selected_tags), 'ALL') ||
         contains(fromJson(inputs.selected_tags), 'SmokePerps'))
      }}
    strategy:
      # Lite + Pro nearly doubled SmokePerps; 2 shards exceeded the 25m test step.
      matrix:
        split: [1, 2, 3, 4]
      fail-fast: false
    uses: ./.github/workflows/run-appium-e2e-workflow.yml
    with:
      test-suite-name: appium-perps-android-smoke-${{ matrix.split }}
