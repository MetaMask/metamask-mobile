# Runs Appium smoke tests for one smoke tag on Android or iOS.
# Called from run-appium-smoke-tests-{android,ios}.yml (one job per tag/split).
# Specs for each fixed split are selected via e2e-split-tags-shards.mjs
# (timing bin-pack when e2e-timings are available; else equal-count).

name: Run Appium E2E

on:
  workflow_call:
    inputs:
      test-suite-name:
        description: 'Name of the test suite (used for artifacts and report paths)'
        required: true
        type: string
      platform:
        description: 'Platform to test (ios or android)'
        required: true
        type: string
      test_suite_tag:
        description: 'Smoke tag id to filter tests (e.g. SmokeAccounts matches describe titles)'
        required: true
        type: string
      split_number:
        description: 'Which shard to run (1-based index)'
        required: false
        type: number
        default: 1
      total_splits:
        description: 'Total number of shards for this tag'
        required: false
        type: number
        default: 1
      changed_spec_files:
        description: 'Space-separated changed E2E specs for PR flakiness detection (run twice)'
        required: false
        type: string
        default: ''
      test-timeout-minutes:
        description: 'Timeout in minutes for the Playwright test step'
        required: false
        type: number
        default: 25
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      android-tag:
        description: >-
          Android system image tag. Stays on `default` (AOSP): `google_apis` is
          baked into the runner image and would skip a ~9s dl.google.com pull,
          but it ships Play Services and a different browser engine, which
          breaks the browser-navigation suite (ENS resolution, cross-origin
          redirect display, history isolation, safe-browsing interstitial).
          Switching needs those assertions audited first.
        required: false
        type: string
        default: 'default'

permissions:
  contents: read
  checks: write
  # Download frozen e2e-timings + previous playwright JSON on re-runs.
  actions: read
  # PR label check for skip-e2e-flakiness-detection.
  pull-requests: read

jobs:
  test-appium-mobile:
    name: ${{ inputs.test-suite-name }}
    # iOS Appium smoke is not put on low-priority: those runners are often
    # preempted around ~15m wall-clock, which kills the Playwright step before
    # reports/logs upload (and before shards that no longer fail-fast can finish).
    #
    # Android moves to `android-e2e`, off the `android-build` profile it used to
    # share with Gradle. Both are ubuntu-24.04 / 16x32 with the same 90 GB cache
    # volume, so this is a no-op on shape — the point is to be able to size the
    # two workloads apart. They are not the same workload: Gradle sits at 100%
    # CPU-saturated and wants more, while Appium peaks at 57% of 16 vCPU and 37%
    # of 32 GB and wants less. Right-sizing this profile is a follow-up.
    runs-on: >-
      ${{
        inputs.runner_provider == 'namespace' &&
        (inputs.platform == 'ios' && 'namespace-profile-metamask-ios-e2e' ||
         'namespace-profile-metamask-android-e2e') ||
        (inputs.platform == 'ios' &&
          fromJSON('["ghcr.io/cirruslabs/macos-runner:tahoe"]')) ||
        (startsWith(github.base_ref, 'release/') &&
          fromJSON('["ghcr.io/cirruslabs/ubuntu-runner-amd64:24.04-lg"]') ||
          fromJSON('["ghcr.io/cirruslabs/ubuntu-runner-amd64:24.04-lg", "low-priority"]'))
      }}

    steps:
      - name: Checkout (Namespace)
        uses: namespacelabs/nscloud-checkout-action@938f5d2d403d6224d9a0c0dc559b1dae09c2ede4 # v8.1.1
        if: ${{ inputs.runner_provider == 'namespace' }}

      - name: Checkout
        uses: actions/checkout@v4
        if: ${{ inputs.runner_provider != 'namespace' }}

      - name: Setup Node for shard selection
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Download frozen qa-stats timings
        id: download-timings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-timings-${{ github.run_id }}
          path: ./

      - name: Fetch qa-stats timings fallback
        if: steps.download-timings.outcome != 'success'
        run: node .github/scripts/qa-automation/stats/e2e-freeze-timings.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          OUTPUT_PATH: ./e2e-timings.json
      # On re-run, reuse prior Playwright JSON / shard-status to skip passed specs.
      - name: Download previous Playwright results (on re-run)
        if: ${{ github.run_attempt > 1 }}
        id: download-previous-results
        continue-on-error: true
        uses: ./.github/actions/download-e2e-artifact
        with:
          name: playwright-json-report-${{ inputs.test-suite-name }}
          path: ./previous-playwright-json/
          runner-provider: ${{ inputs.runner_provider }}

      - name: Select specs for this shard (timing bin-pack)
        id: select-specs
        run: node .github/scripts/qa-automation/e2e-sharding/e2e-split-tags-shards.mjs
        env:
          PLATFORM: ${{ inputs.platform }}
          TEST_SUITE_TAG: ${{ inputs.test_suite_tag }}
          SPLIT_NUMBER: ${{ inputs.split_number }}
          TOTAL_SPLITS: ${{ inputs.total_splits }}
          BASE_DIR: tests/smoke-appium
          E2E_TIMINGS_PATH: ./e2e-timings.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          CHANGED_SPEC_FILES: ${{ inputs.changed_spec_files }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PREVIOUS_RESULTS_PATH: ${{ steps.download-previous-results.outcome == 'success' && './previous-playwright-json' || '' }}

      # This workflow mounted no cache volume, so every shard ran a cold
      # `yarn install` (~51s vs 4.2s warm). `.metamask` is the foundryup
      # download cache and lives in the workspace, so only a mount can serve it.
      #
      # node_modules is Android-only on purpose: nscloud-cache-action mounts
      # paths as symlinks into the cache volume, which breaks Xcode projects
      # that resolve $(SRCROOT) to a physical path (#34931). iOS Appium builds
      # WebDriverAgent from node_modules, so it is exposed to that; Android
      # runs no Xcode or Gradle and does not republish node_modules.
      - name: Configure Namespace cache (Android)
        if: ${{ inputs.runner_provider == 'namespace' && inputs.platform == 'android' && steps.select-specs.outputs.spec_count != '0' }}
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1
        with:
          path: |
            ~/.cache/yarn
            .metamask
            node_modules
            .yarn/cache

      # No `cache: cocoapods`: this job passes skip-pod-install=true, so it
      # never runs pod install.
      - name: Configure Namespace cache (iOS)
        if: ${{ inputs.runner_provider == 'namespace' && inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1
        with:
          path: |
            ~/.cache/yarn
            .metamask
            .yarn/cache

      - name: Setup E2E environment (Android)
        if: ${{ inputs.platform == 'android' && steps.select-specs.outputs.spec_count != '0' }}
        uses: ./.github/actions/setup-e2e-env
        with:
          platform: android
          setup-simulator: 'true'
          android-avd-name: appium_smoke_avd
          android-tag: ${{ inputs.android-tag }}
          android-api-level: '36'
          android-abi: x86_64
          android-device: pixel_5
          configure-keystores: 'false'
          install-foundry: 'true'
          runner_provider: ${{ inputs.runner_provider }}

      - name: Setup E2E environment (iOS)
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        uses: ./.github/actions/setup-e2e-env
        with:
          platform: ios
          setup-simulator: 'false'
          configure-keystores: 'false'
          install-foundry: 'true'
          skip-pod-install: 'true'
          install-applesimutils: 'false'
          runner_provider: ${{ inputs.runner_provider }}

      - name: Cache ffmpeg (Homebrew)
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/mms-ffmpeg
          key: brew-ffmpeg-${{ runner.os }}-v1
          restore-keys: |
            brew-ffmpeg-${{ runner.os }}-

      - name: Install ffmpeg for XCUITest screen recording
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        run: bash scripts/e2e/ensure-ffmpeg-ci.sh
        shell: bash

      - name: Determine Android artifact paths
        if: ${{ inputs.platform == 'android' && steps.select-specs.outputs.spec_count != '0' }}
        id: android-artifacts
        run: |
          if [[ "${{ inputs.build_type }}" == "flask" ]]; then
            {
              echo "apk-target-path=android/app/build/outputs/apk/flask/release"
              echo "apk-file-name=app-flask-release.apk"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "apk-target-path=android/app/build/outputs/apk/prod/release"
              echo "apk-file-name=app-prod-release.apk"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android build artifacts (Namespace)
        if: ${{ inputs.platform == 'android' && inputs.runner_provider == 'namespace' && steps.select-specs.outputs.spec_count != '0' }}
        id: download-android-apk-namespace
        continue-on-error: true
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2.0.1
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}
      - name: Download Android build artifacts (GitHub — build may be on Cirrus)
        if: >-
          ${{
            inputs.platform == 'android' &&
            inputs.runner_provider == 'namespace' &&
            steps.select-specs.outputs.spec_count != '0' &&
            steps.download-android-apk-namespace.outcome != 'success'
          }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}
      - name: Download Android build artifacts (current)
        if: ${{ inputs.platform == 'android' && inputs.runner_provider != 'namespace' && steps.select-specs.outputs.spec_count != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}

      - name: Download iOS build artifacts (Namespace)
        if: ${{ inputs.platform == 'ios' && inputs.runner_provider == 'namespace' && steps.select-specs.outputs.spec_count != '0' }}
        id: download-ios-app-namespace
        continue-on-error: true
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2.0.1
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
          path: artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
      # actions/download-artifact merges into its target directory rather than
      # replacing it (same caveat as in build-ios-e2e.yml) — clear any residue from
      # the failed Namespace attempt so the fallback starts from an empty bundle dir.
      - name: Clear any partial iOS app before the fallback download
        if: >-
          ${{
            inputs.platform == 'ios' &&
            inputs.runner_provider == 'namespace' &&
            steps.select-specs.outputs.spec_count != '0' &&
            steps.download-ios-app-namespace.outcome != 'success'
          }}
        shell: bash
        run: rm -rf "artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app"
      - name: Download iOS build artifacts (GitHub — build may be on Cirrus)
        if: >-
          ${{
            inputs.platform == 'ios' &&
            inputs.runner_provider == 'namespace' &&
            steps.select-specs.outputs.spec_count != '0' &&
            steps.download-ios-app-namespace.outcome != 'success'
          }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
          path: artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
      - name: Download iOS build artifacts (current)
        if: ${{ inputs.platform == 'ios' && inputs.runner_provider != 'namespace' && steps.select-specs.outputs.spec_count != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
          path: artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app

      - name: Restore iOS bundle executable permissions
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        env:
          APP_PATH: artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
        run: |
          BUNDLE_EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null)
          if [ -z "$BUNDLE_EXEC" ]; then
            echo "Could not read CFBundleExecutable from Info.plist"
            exit 1
          fi

          ACTUAL_PATH=$(find "$APP_PATH" -maxdepth 1 -iname "$BUNDLE_EXEC" -type f | head -1)
          if [ -z "$ACTUAL_PATH" ]; then
            echo "Bundle executable not found: $BUNDLE_EXEC"
            exit 1
          fi

          if [ "$(basename "$ACTUAL_PATH")" != "$BUNDLE_EXEC" ]; then
            mv "$ACTUAL_PATH" "$APP_PATH/${BUNDLE_EXEC}_fix"
            mv "$APP_PATH/${BUNDLE_EXEC}_fix" "$APP_PATH/$BUNDLE_EXEC"
          fi

          chmod +x "$APP_PATH/$BUNDLE_EXEC"

          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type d -name "*.framework" | while IFS= read -r fw; do
              binary="$fw/$(basename "$fw" .framework)"
              if [ -f "$binary" ]; then
                chmod +x "$binary"
              fi
            done
            find "$APP_PATH/Frameworks" -type f -name "*.dylib" -exec chmod +x {} \;
          fi
          echo "Restored execute permissions on main binary and all framework binaries"
        shell: bash

      - name: Resolve XCUITest driver version for WDA cache key
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        id: xcuitest-version
        run: echo "version=$(node scripts/e2e/resolve-xcuitest-driver-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Get Xcode version for WDA cache key
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        id: xcode-version
        run: echo "version=$(xcodebuild -version 2>/dev/null | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore WDA DerivedData cache
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        uses: actions/cache@v4
        with:
          path: ~/appium-wda
          key: wda-derived-data-xcuitest-${{ steps.xcuitest-version.outputs.version }}-${{ steps.xcode-version.outputs.version }}-${{ runner.os }}
          restore-keys: |
            wda-derived-data-xcuitest-${{ steps.xcuitest-version.outputs.version }}-${{ steps.xcode-version.outputs.version }}-

      - name: Check if WDA is prebuilt
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        id: wda-prebuilt
        run: |
          WDA_APP=$(find ~/appium-wda/Build/Products -name 'WebDriverAgentRunner-Runner.app' -type d 2>/dev/null | head -1 || true)
          XCTESTRUN=$(find ~/appium-wda/Build/Products -name '*.xctestrun' 2>/dev/null | head -1 || true)
          if [ -n "$WDA_APP" ] && [ -n "$XCTESTRUN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "WDA prebuilt artifacts found"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "WDA cache miss — prepare-ios-appium-runner will prebuild after sim boot"
          fi
        shell: bash

      - name: Prepare iOS Appium runner
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        id: prepare-ios-appium
        timeout-minutes: 30
        run: node scripts/e2e/prepare-ios-appium-runner.mjs
        env:
          IOS_SIMULATOR_NAME: iPhone 16 Pro
          IOS_APP_PATH: artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
          IOS_BUNDLE_ID: io.metamask.MetaMask
          SKIP_WDA_PREBUILD: ${{ steps.wda-prebuilt.outputs.ready == 'true' && 'true' || 'false' }}
          IOS_SIMULATOR_POST_BOOT_SETTLE_MS: '30000'
          IOS_APP_WARM_LAUNCH_SETTLE_MS: '15000'

      - name: Verify Appium runner connectivity (iOS)
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        run: yarn tsx scripts/e2e/verify-appium-runner-connectivity.mjs ios
        env:
          IOS_SIMULATOR_UDID: ${{ steps.prepare-ios-appium.outputs.ios-simulator-udid }}

      - name: Run Appium smoke tests (Android)
        id: run-tests-android
        if: ${{ inputs.platform == 'android' && steps.select-specs.outputs.spec_count != '0' }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        env:
          SPEC_FILES: ${{ steps.select-specs.outputs.spec_files }}
          APPIUM_SMOKE_SUITE_NAME: ${{ inputs.test-suite-name }}
          APPIUM_SMOKE_JOB_TITLE: Appium ${{ inputs.test-suite-name }} (android)
          APPIUM_SMOKE_ARTIFACT_NAME: appium-smoke-report-${{ inputs.test-suite-name }}
          APPIUM_SMOKE_VIDEOS_ARTIFACT_NAME: appium-smoke-videos-${{ inputs.test-suite-name }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: tests/test-reports/playwright-json/playwright-report.json
          APPIUM_RECORD_VIDEO_ON_FAILURE: 'true'
          SKIP_APPIUM_STOP: 'true'
          ANDROID_APK_PATH: ${{ steps.android-artifacts.outputs.apk-target-path }}/${{ steps.android-artifacts.outputs.apk-file-name }}
          ANDROID_AVD_NAME: appium_smoke_avd
          ANDROID_APPIUM_USE_PACKAGE_ONLY: 'true'
          ANDROID_BOOT_TIMEOUT_MS: '300000'
          ANDROID_EMULATOR_CI_CORES: '8'
          ANDROID_EMULATOR_POST_BOOT_SETTLE_MS: '30000'
          ANDROID_EMULATOR_NETWORK_READY_TIMEOUT_MS: '90000'
          ANDROID_EMULATOR_NETWORK_READY_CONSECUTIVE_PINGS: '3'
          # Required for Anvil mainnet forks (SmokeStake and other fork-based suites).
          MM_INFURA_PROJECT_ID: ${{ secrets.MM_INFURA_PROJECT_ID }}
          # Disable retries for fixture validation — failures must surface immediately. - Otherwise it will fall back to playwright config default
          APPIUM_RETRIES_OVERRIDE: ${{ inputs.test_suite_tag == 'FixtureValidation' && '0' || '' }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "${SPEC_FILES}"
          yarn playwright test "${specs[@]}" \
            --config tests/playwright.smoke-appium.config.ts \
            --project android-smoke \
            --grep "${{ inputs.test_suite_tag }}" \
            --pass-with-no-tests

      - name: Run Appium smoke tests (iOS)
        id: run-tests-ios
        if: ${{ inputs.platform == 'ios' && steps.select-specs.outputs.spec_count != '0' }}
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        env:
          SPEC_FILES: ${{ steps.select-specs.outputs.spec_files }}
          APPIUM_SMOKE_SUITE_NAME: ${{ inputs.test-suite-name }}
          APPIUM_SMOKE_JOB_TITLE: Appium ${{ inputs.test-suite-name }} (ios)
          APPIUM_SMOKE_ARTIFACT_NAME: appium-smoke-report-${{ inputs.test-suite-name }}
          APPIUM_SMOKE_VIDEOS_ARTIFACT_NAME: appium-smoke-videos-${{ inputs.test-suite-name }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: tests/test-reports/playwright-json/playwright-report.json
          APPIUM_RECORD_VIDEO_ON_FAILURE: 'true'
          SKIP_APPIUM_STOP: 'true'
          IOS_APP_PATH: artifacts/${{ inputs.build_type }}-${{ inputs.metamask_environment }}-MetaMask.app
          IOS_SIMULATOR_NAME: iPhone 16 Pro
          IOS_SIMULATOR_UDID: ${{ steps.prepare-ios-appium.outputs.ios-simulator-udid }}
          IOS_WDA_PREINSTALLED: ${{ steps.prepare-ios-appium.outputs.ios-wda-preinstalled }}
          IOS_WDA_BUNDLE_ID: ${{ steps.prepare-ios-appium.outputs.ios-wda-bundle-id }}
          SKIP_DEVICE_BOOT: 'true'
          SKIP_APP_REINSTALL: 'true'
          USE_PREBUILT_WDA: 'true'
          IOS_SIMULATOR_POST_BOOT_SETTLE_MS: '30000'
          IOS_PRE_LAUNCH_SETTLE_MS: '1500'
          # Required for Anvil mainnet forks (SmokeStake and other fork-based suites).
          MM_INFURA_PROJECT_ID: ${{ secrets.MM_INFURA_PROJECT_ID }}
          # Disable retries for fixture validation — failures must surface immediately. - Otherwise it will fall back to playwright config default
          APPIUM_RETRIES_OVERRIDE: ${{ inputs.test_suite_tag == 'FixtureValidation' && '0' || '' }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "${SPEC_FILES}"
          yarn playwright test "${specs[@]}" \
            --config tests/playwright.smoke-appium.config.ts \
            --project ios-smoke \
            --grep "${{ inputs.test_suite_tag }}" \
            --pass-with-no-tests

      - name: Write / merge Appium shard status (for re-runs)
        if: ${{ always() && (steps.run-tests-android.outcome == 'success' || steps.run-tests-android.outcome == 'failure' || steps.run-tests-ios.outcome == 'success' || steps.run-tests-ios.outcome == 'failure') }}
        run: |
          set -euo pipefail
          report='tests/test-reports/playwright-json/playwright-report.json'
          if [[ ! -f "$report" ]]; then
            echo "No Playwright JSON report — skipping shard-status"
            exit 0
          fi
          previous=''
          if [[ -d ./previous-playwright-json ]]; then
            previous=./previous-playwright-json
          fi
          node .github/scripts/qa-automation/e2e-sharding/e2e-split-tags-shards.mjs --write-shard-status \
            "${previous}" \
            "$report" \
            tests/test-reports/playwright-json/shard-status.json

      - name: Upload Playwright HTML report (artifact stores)
        if: ${{ always() && steps.select-specs.outputs.spec_count != '0' }}
        uses: ./.github/actions/dual-upload-e2e-artifact
        with:
          name: appium-smoke-report-${{ inputs.test-suite-name }}
          path: tests/test-reports/appium-smoke-report/${{ inputs.test-suite-name }}/
          if-no-files-found: ignore
          retention-days: 7
          runner-provider: ${{ inputs.runner_provider }}

      - name: Upload Playwright JSON report (artifact stores)
        # Fixed inner filename (playwright-report.json) for github-tools playwright-test-health-report;
        # suite/shard identity is in the artifact name prefix playwright-json-report-*.
        # Also includes shard-status.json for re-run filtering across attempts.
        # Dual-uploads non-empty shard reports to GitHub so collect-qa-stats.mjs / e2e-freeze-timings can see it.
        if: ${{ always() && steps.select-specs.outputs.spec_count != '0' }}
        uses: ./.github/actions/dual-upload-e2e-artifact
        with:
          name: playwright-json-report-${{ inputs.test-suite-name }}
          path: tests/test-reports/playwright-json/
          if-no-files-found: ignore
          retention-days: 7
          runner-provider: ${{ inputs.runner_provider }}

      - name: Upload Appium phase timings (artifact stores)
        if: ${{ always() && steps.select-specs.outputs.spec_count != '0' }}
        uses: ./.github/actions/dual-upload-e2e-artifact
        with:
          name: appium-timings-${{ inputs.test-suite-name }}
          path: tests/test-reports/appium-timings/
          if-no-files-found: ignore
          retention-days: 7
          runner-provider: ${{ inputs.runner_provider }}

      - name: Upload failure screen recordings (artifact stores)
        if: ${{ always() && (steps.run-tests-android.outcome == 'failure' || steps.run-tests-ios.outcome == 'failure') }}
        uses: ./.github/actions/dual-upload-e2e-artifact
        with:
          name: appium-smoke-videos-${{ inputs.test-suite-name }}
          path: tests/test-reports/appium-smoke-videos/${{ inputs.test-suite-name }}/
          if-no-files-found: ignore
          retention-days: 7
          runner-provider: ${{ inputs.runner_provider }}

      - name: Publish test results to GitHub Checks
        if: ${{ always() && steps.select-specs.outputs.spec_count != '0' }}
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3
        with:
          name: Appium ${{ inputs.test-suite-name }} (${{ inputs.platform }})
          path: tests/test-reports/appium-smoke-junit/${{ inputs.test-suite-name }}.xml
          reporter: java-junit
          fail-on-error: false
          list-suites: all
          list-tests: failed
          fail-on-empty: false

      - name: Upload fixture validation reports
        if: ${{ always() && inputs.test_suite_tag == 'FixtureValidation' && steps.select-specs.outputs.spec_count != '0' }}
        uses: actions/upload-artifact@v6
        with:
          name: fixture-validation-results-${{ inputs.test-suite-name }}
          path: |
            tests/reports/fixture-validation-result.json
            tests/reports/fixture-validation-diff.txt
          if-no-files-found: ignore
          retention-days: 7
