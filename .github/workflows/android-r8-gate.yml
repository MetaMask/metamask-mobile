# R8 regression gate.
#
# R8 cannot see reflective, JNI or JS-driven access, so removing a keep rule (or a dependency bump
# renaming a class) can silently strip code that is still reached at runtime. The failure shows up
# in production as ClassNotFoundException / NoSuchMethodError, not at build time.
#
# This job builds R8 for the PR and diffs `usage.txt` — the list of everything R8 removed —
# against the same file built from the PR's base commit, failing if a class in a protected
# namespace is newly stripped.
#
# It is manual-only; see the note above the `on:` block for why.

name: Android R8 Gate

# MANUAL ONLY, deliberately.
#
# An automatic pull_request trigger was measured against 90 days of history before being rejected:
#
#   package.json / yarn.lock                287 commits
#   all Android build config + proguard      ~24 commits
#   distinct commits touching any of them    292   (~3.2/day)
#
# Each run builds R8 twice (PR + merge base) at ~10-15 min each, so an automatic trigger would add
# roughly 100 blocking double-builds per month — 98% of them dependency bumps — to guard against a
# regression class we have not yet observed in practice. That is the kind of gate teams disable
# within a month.
#
# Run it manually when the risk is real:
#   - changing proguard-rules.pro (especially REMOVING a keep rule)
#   - changing the ProGuard default file or R8 properties
#   - a dependency bump that touches a reflection-heavy SDK
#
#   gh workflow run android-r8-gate.yml -f pr_number=<N>
#
# If it proves its worth, the cheap next step is a pull_request trigger scoped to the Android
# config paths ONLY (~24 commits/90d, about one every four days) — NOT package.json/yarn.lock.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check (compares head against its merge base)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read   # `gh pr view` in the Resolve PR refs step

concurrency:
  group: android-r8-gate-${{ inputs.pr_number }}
  cancel-in-progress: true

env:
  MAPPING_DIR: android/app/build/outputs/mapping/prodRelease

jobs:
  r8-diff:
    name: R8 usage diff vs merge base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history to resolve the merge base.
          fetch-depth: 0

      - name: Resolve PR refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh pr view "${{ inputs.pr_number }}" --json headRefOid -q .headRefOid)
          BASE_SHA=$(gh pr view "${{ inputs.pr_number }}" --json baseRefOid -q .baseRefOid)
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "$HEAD_SHA" "$BASE_SHA"
          git checkout --detach "$HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: yarn install --immutable

      # R8 runs before packaging, so `minifyProdReleaseWithR8` produces the DEX and all four
      # diagnostic files without needing signing keys.
      - name: Build R8 (PR)
        run: cd android && ./gradlew :app:minifyProdReleaseWithR8 --console=plain

      - name: Archive PR results
        run: |
          mkdir -p /tmp/r8/current
          cp "$MAPPING_DIR"/{usage,seeds,configuration}.txt /tmp/r8/current/

      - name: Build R8 (merge base)
        run: |
          set -euo pipefail
          git checkout --detach "${{ steps.refs.outputs.base }}"
          # Dependencies may differ at the base commit.
          yarn install --immutable
          cd android && ./gradlew :app:minifyProdReleaseWithR8 --console=plain

      - name: Archive baseline results
        run: |
          mkdir -p /tmp/r8/baseline
          cp "$MAPPING_DIR"/usage.txt /tmp/r8/baseline/

      - name: Restore PR checkout
        run: git checkout "${{ steps.refs.outputs.head }}"

      - name: Fail if a dependency disabled the optimizer
        run: |
          set -euo pipefail
          # A single library shipping -dontoptimize in its consumer rules silently cancels the
          # optimizer for the entire app. configuration.txt is the merged ruleset.
          if grep -nE '^-(dontoptimize|dontshrink|dontobfuscate)' /tmp/r8/current/configuration.txt; then
            echo "::error::A dependency is disabling R8 optimization for the whole app."
            echo "::error::Find the offending library and filter or replace it."
            exit 1
          fi
          echo "No optimizer-disabling directives in the merged configuration."

      - name: Usage regression gate
        run: |
          node scripts/android/r8-usage-gate.mjs \
            --baseline /tmp/r8/baseline/usage.txt \
            --current  /tmp/r8/current/usage.txt \
            --json     /tmp/r8/report.json

      - name: Upload R8 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-diagnostics
          path: /tmp/r8/
          retention-days: 14
