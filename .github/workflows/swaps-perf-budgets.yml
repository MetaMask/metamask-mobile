# Daily Swaps performance budgets check. Posts to Slack every day: an all-clear,
# a breach list, or a failure notice.
# Rules: .github/scripts/swaps/perf-budgets/swaps-perf-budgets.config.mjs.
# Secrets: SWAPS_SENTRY_TOKEN (Sentry, org:read) and SLACK_BOT_TOKEN, which must
# be invited to the channel set in the config.

name: Swaps Performance Budgets

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Log the Slack message instead of posting it'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: swaps-perf-budgets
  cancel-in-progress: false

jobs:
  check-budgets:
    name: Check Swaps performance budgets
    if: ${{ github.repository == 'MetaMask/metamask-mobile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      HAS_SLACK_TOKEN: ${{ secrets.SLACK_BOT_TOKEN != '' }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Check budgets
        env:
          SWAPS_SENTRY_TOKEN: ${{ secrets.SWAPS_SENTRY_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node .github/scripts/swaps/perf-budgets/run-swaps-perf-budgets.mjs

      - name: Post failure notice
        if: ${{ failure() && env.DRY_RUN != 'true' && env.HAS_SLACK_TOKEN == 'true' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: node .github/scripts/swaps/perf-budgets/run-swaps-perf-budgets.mjs --failure-notice
