name: Run Performance E2E Tests Manually

# Scheduled runs use the e2e build from main:
# - 00:00, 06:00, 12:00, 18:00 UTC
on:
  schedule:
    - cron: '0 */6 * * 1-6'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'BrowserStack build profile'
        required: false
        type: choice
        options:
          - e2e
          - exp
          - rc
        default: e2e
      sentry_target:
        description: 'Sentry target for performance events (test or real)'
        required: false
        type: choice
        options:
          - test
          - real
        default: test
      reuse_main_builds:
        description: 'For e2e only, reuse and upload the latest Android APKs from main CI'
        required: false
        type: boolean
        default: false
      enable_browserstack:
        description: 'Also run BrowserStack performance lanes (off by default; TestMu HyperExecute is primary)'
        required: false
        type: boolean
        default: false
      enable_saucelabs:
        description: 'Also run Sauce Labs performance lanes (off by default)'
        required: false
        type: boolean
        default: false
      enable_saucelabs_cloud:
        description: 'Run Sauce Labs using four dynamically allocated cloud devices'
        required: false
        type: boolean
        default: false
      enable_testmu_standard_cloud:
        description: 'Run TestMu Standard using four dynamically allocated cloud devices'
        required: false
        type: boolean
        default: false
      enable_testmu_standard:
        description: 'Also run TestMu Standard using the TestMu device matrix'
        required: false
        type: boolean
        default: false
      enable_testmu_benchmark:
        description: 'Run TestMu HyperExecute performance lanes'
        required: false
        type: boolean
        default: true
      he_region:
        description: 'HyperExecute region (us or eu)'
        required: false
        type: choice
        options:
          - us
          - eu
        default: us

permissions:
  contents: write
  id-token: write
  actions: write
  pull-requests: write
  statuses: write

concurrency:
  # Each manual dispatch gets its own group so multiple manual runs can execute
  # concurrently. Scheduled runs remain grouped by schedule/ref.
  group: >-
    ${{
      github.event_name == 'workflow_dispatch' &&
      format('performance-e2e-manual-{0}', github.run_id) ||
      format(
        'performance-e2e-trigger-{0}-{1}',
        github.ref,
        github.event.schedule || 'scheduled'
      )
    }}
  cancel-in-progress: false

jobs:
  scheduled-e2e:
    name: Scheduled Performance E2E (e2e)
    if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * 1-6'
    uses: ./.github/workflows/run-performance-e2e.yml
    with:
      branch_name: main
      build_variant: e2e
      enable_testmu_benchmark: true
      enable_browserstack: false
      sentry_target: test
    secrets: inherit

  manual:
    name: Manual Performance E2E (${{ inputs.build_variant }})
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/run-performance-e2e.yml
    with:
      branch_name: ${{ github.ref_name }}
      build_variant: ${{ inputs.build_variant }}
      enable_testmu_benchmark: ${{ inputs.enable_testmu_benchmark }}
      enable_browserstack: ${{ inputs.enable_browserstack }}
      enable_saucelabs: ${{ inputs.enable_saucelabs }}
      enable_saucelabs_cloud: ${{ inputs.enable_saucelabs_cloud }}
      enable_testmu_standard_cloud: ${{ inputs.enable_testmu_standard_cloud }}
      enable_testmu_standard: ${{ inputs.enable_testmu_standard }}
      sentry_target: ${{ inputs.sentry_target }}
      reuse_main_builds: ${{ inputs.build_variant == 'e2e' && inputs.reuse_main_builds }}
      he_region: ${{ inputs.he_region || 'us' }}
    secrets: inherit
