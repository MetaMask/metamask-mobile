name: Run Performance E2E Tests Manually

# Scheduled runs use the e2e build from main:
# - 00:00, 06:00, 12:00, 18:00 UTC
on:
  schedule:
    - cron: '0 */6 * * 1-6'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'BrowserStack build profile'
        required: false
        type: choice
        options:
          - e2e
          - exp
          - rc
        default: e2e
      sentry_target:
        description: 'Sentry target for performance events (test or real)'
        required: false
        type: choice
        options:
          - test
          - real
        default: test
      browserstack_app_url_android_onboarding:
        description: 'BrowserStack Android Onboarding App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_ios_onboarding:
        description: 'BrowserStack iOS Onboarding App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_android_imported_wallet:
        description: 'BrowserStack Android Imported Wallet App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_ios_imported_wallet:
        description: 'BrowserStack iOS Imported Wallet App URL (bs://...)'
        required: false
        type: string
      performance_tags:
        description: 'JSON array of performance tags. Blank runs all; [] skips all.'
        required: false
        type: string
        default: ''
      reuse_main_builds:
        description: >-
          Force reuse of the latest main-branch Android APKs (test-only override).
          Leave unchecked to auto-detect: branches with app/ changes repack JS
          from this branch; branches with only test/CI changes reuse main APKs.
        required: false
        type: boolean
        default: false
      source_fingerprint:
        description: 'Optional @expo/fingerprint hash for Android app reuse'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write
  actions: write
  pull-requests: write
  statuses: write

concurrency:
  # Manual runs are isolated by ref and variant so they do not block the
  # scheduled cadence.
  group: performance-e2e-trigger-${{ github.event_name == 'schedule' && github.event.schedule || github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || inputs.build_variant }}
  cancel-in-progress: false

jobs:
  scheduled-e2e:
    name: Scheduled Performance E2E (e2e)
    if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * 1-6'
    uses: ./.github/workflows/run-performance-e2e.yml
    with:
      branch_name: main
      source_ref: main
      build_variant: e2e
      sentry_target: test
    secrets: inherit

  # Detect whether the current branch has app/ changes vs main.
  # If yes → fingerprint-reuse the APK and repack JS from this branch (correct UX).
  # If no  → reuse the latest main APK as-is (test-only: same JS, no repack needed).
  # The reuse_main_builds checkbox overrides detection and always forces the main APK path.
  detect-changes:
    name: Detect app vs test-only changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      reuse_main_builds: ${{ steps.decide.outputs.reuse_main_builds }}
    steps:
      - name: Checkout
        if: ${{ !inputs.reuse_main_builds }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Count app/ changes vs main
        id: detect
        if: ${{ !inputs.reuse_main_builds }}
        run: |
          git fetch origin main --depth=100 2>/dev/null || git fetch origin main
          APP_CHANGED=$(git diff origin/main --name-only | grep -c '^app/' || true)
          echo "app_changed=$APP_CHANGED" >> "$GITHUB_OUTPUT"
          if [ "$APP_CHANGED" -gt 0 ]; then
            echo "ℹ️  $APP_CHANGED app/ file(s) changed — will fingerprint-reuse APK and repack JS from this branch"
          else
            echo "ℹ️  No app/ changes — will reuse latest main APK as-is"
          fi

      - name: Resolve reuse_main_builds
        id: decide
        env:
          USER_OVERRIDE: ${{ inputs.reuse_main_builds }}
          APP_CHANGED: ${{ steps.detect.outputs.app_changed }}
        run: |
          if [ "$USER_OVERRIDE" = "true" ]; then
            echo "reuse_main_builds=true" >> "$GITHUB_OUTPUT"
            echo "User override: force main builds"
          elif [ "${APP_CHANGED:-0}" -gt 0 ]; then
            echo "reuse_main_builds=false" >> "$GITHUB_OUTPUT"
          else
            echo "reuse_main_builds=true" >> "$GITHUB_OUTPUT"
          fi

  manual:
    name: Manual Performance E2E (${{ inputs.build_variant }})
    if: github.event_name == 'workflow_dispatch'
    needs: [detect-changes]
    uses: ./.github/workflows/run-performance-e2e.yml
    with:
      branch_name: ${{ github.ref_name }}
      source_ref: ${{ github.ref_name }}
      build_variant: ${{ inputs.build_variant }}
      sentry_target: ${{ inputs.sentry_target }}
      browserstack_app_url_android_onboarding: ${{ inputs.browserstack_app_url_android_onboarding }}
      browserstack_app_url_ios_onboarding: ${{ inputs.browserstack_app_url_ios_onboarding }}
      browserstack_app_url_android_imported_wallet: ${{ inputs.browserstack_app_url_android_imported_wallet }}
      browserstack_app_url_ios_imported_wallet: ${{ inputs.browserstack_app_url_ios_imported_wallet }}
      performance_tags: ${{ inputs.performance_tags }}
      # Latest-main APK reuse is e2e-only; exp/rc still need a fingerprint so
      # fingerprint-based reuse (and fresh-build fallback) can run.
      reuse_main_builds: ${{ needs.detect-changes.outputs.reuse_main_builds == 'true' && inputs.build_variant == 'e2e' }}
      source_fingerprint: ${{ inputs.source_fingerprint }}
    secrets: inherit
