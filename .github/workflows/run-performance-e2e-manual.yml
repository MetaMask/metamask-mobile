name: Run Performance E2E Tests Manually

# Scheduled and manual runs use the selected build and run on TestMu
# HyperExecute:
# - 00:00, 06:00, 12:00, 18:00 UTC
on:
  schedule:
    - cron: '0 */6 * * 1-6'
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'App build profile'
        required: false
        type: choice
        options:
          - e2e
          - exp
          - rc
        default: e2e
      sentry_target:
        description: 'Sentry target for performance events (test or real)'
        required: false
        type: choice
        options:
          - test
          - real
        default: test
      testmu_app_url_android_onboarding:
        description: 'TestMu AI Android onboarding app URL (lt://...). Leave empty to build and upload.'
        required: false
        type: string
      testmu_app_url_android_imported_wallet:
        description: 'TestMu AI Android imported-wallet app URL (lt://...). Leave empty to build and upload.'
        required: false
        type: string
      performance_tags:
        description: 'JSON array of performance tags. Blank or ["ALL"] runs all; [] skips all.'
        required: false
        type: string
        default: ''
      reuse_main_builds:
        description: >-
          Force reuse of the latest main-branch Android APKs (test-only override).
          Leave unchecked to auto-detect: branches with app-affecting changes
          (app/, native, deps, bundler, scripts, …) repack JS from this branch;
          branches with only tests/docs/CI markdown changes reuse main APKs.
        required: false
        type: boolean
        default: false
      source_fingerprint:
        description: 'Optional @expo/fingerprint hash for Android app reuse'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # Manual runs are isolated by ref and variant so they do not block the
  # scheduled cadence.
  group: performance-e2e-trigger-${{ github.event_name == 'schedule' && github.event.schedule || github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || inputs.build_variant }}
  cancel-in-progress: false

jobs:
  scheduled-e2e:
    name: Scheduled Performance E2E (e2e)
    if: github.event_name == 'schedule' && github.event.schedule == '0 */6 * * 1-6'
    permissions:
      contents: write
      id-token: write # AWS OIDC for signing and keystores in run-performance-e2e.yml
      actions: write
      pull-requests: write
      statuses: write # build-source-hash commit status posted by run-performance-e2e.yml
    uses: ./.github/workflows/run-performance-e2e.yml
    with:
      branch_name: main
      source_ref: main
      build_variant: e2e
      sentry_target: test
      collect_hermes_cpuprofiles: true
      # Ordinary PRs do not run performance tests. This stable project and
      # build collect the six-hour runs. Manual dispatches and PRs with
      # run-performance-tests keep their branch build name.
      testmu_project_name: MetaMask Mobile Scheduled Performance
      testmu_build_name: TestMu-Android-Performance-main-Scheduled
    secrets: inherit

  # Detect whether the current branch has app-affecting changes vs main.
  # Latest-main APK reuse is only safe when every changed file is known to be
  # test / documentation / CI-workflow only. Changes to package.json, yarn.lock,
  # patches/, android/, ios/, bundler config, scripts/, etc. must keep
  # fingerprint / build validation.
  # The reuse_main_builds checkbox overrides detection and always forces the main APK path.
  detect-changes:
    name: Detect app vs test-only changes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      reuse_main_builds: ${{ steps.decide.outputs.reuse_main_builds }}
    steps:
      - name: Checkout
        if: ${{ !inputs.reuse_main_builds }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Count app-affecting changes vs main
        id: detect
        if: ${{ !inputs.reuse_main_builds }}
        run: |
          git fetch origin main --depth=100 2>/dev/null || git fetch origin main
          # Allowlist: only these paths are safe for latest-main APK reuse.
          # Anything else (app/, android/, ios/, package.json, yarn.lock,
          # patches/, metro/babel config, scripts/, …) is app-affecting.
          TEST_ONLY_REGEX='^(tests/|docs/|\.github/|.+\.(md|mdx)$)'
          APP_AFFECTING=$(git diff origin/main --name-only | grep -vE "$TEST_ONLY_REGEX" | grep -c . || true)
          echo "app_changed=$APP_AFFECTING" >> "$GITHUB_OUTPUT"
          if [ "$APP_AFFECTING" -gt 0 ]; then
            echo "ℹ️  $APP_AFFECTING app-affecting file(s) changed — will fingerprint-reuse APK and repack JS from this branch"
            git diff origin/main --name-only | grep -vE "$TEST_ONLY_REGEX" | head -20
          else
            echo "ℹ️  Only test/docs/CI changes — will reuse latest main APK as-is"
          fi

      - name: Resolve reuse_main_builds
        id: decide
        env:
          USER_OVERRIDE: ${{ inputs.reuse_main_builds }}
          APP_CHANGED: ${{ steps.detect.outputs.app_changed }}
        run: |
          if [ "$USER_OVERRIDE" = "true" ]; then
            echo "reuse_main_builds=true" >> "$GITHUB_OUTPUT"
            echo "User override: force main builds"
          elif [ "${APP_CHANGED:-0}" -gt 0 ]; then
            echo "reuse_main_builds=false" >> "$GITHUB_OUTPUT"
          else
            echo "reuse_main_builds=true" >> "$GITHUB_OUTPUT"
          fi

  manual:
    name: Manual Performance E2E (${{ inputs.build_variant }})
    if: github.event_name == 'workflow_dispatch'
    needs: [detect-changes]
    permissions:
      contents: write
      id-token: write # AWS OIDC for signing and keystores in run-performance-e2e.yml
      actions: write
      pull-requests: write
      statuses: write # build-source-hash commit status posted by run-performance-e2e.yml
    uses: ./.github/workflows/run-performance-e2e.yml
    with:
      branch_name: ${{ github.ref_name }}
      source_ref: ${{ github.ref_name }}
      build_variant: ${{ inputs.build_variant }}
      sentry_target: ${{ inputs.sentry_target }}
      testmu_app_url_android_onboarding: ${{ inputs.testmu_app_url_android_onboarding }}
      testmu_app_url_android_imported_wallet: ${{ inputs.testmu_app_url_android_imported_wallet }}
      performance_tags: ${{ inputs.performance_tags }}
      # Latest-main APK reuse is e2e-only; exp/rc still need a fingerprint so
      # fingerprint-based reuse (and fresh-build fallback) can run.
      reuse_main_builds: ${{ needs.detect-changes.outputs.reuse_main_builds == 'true' && inputs.build_variant == 'e2e' }}
      source_fingerprint: ${{ inputs.source_fingerprint }}
      collect_hermes_cpuprofiles: true
    secrets: inherit

  # Runs after a failed suite too, so a manual run can report that there is
  # nothing to analyze.
  analyze-app-profiling:
    name: Analyze Hermes CPU profiles
    needs: [scheduled-e2e, manual]
    if: >-
      always() &&
      (needs.scheduled-e2e.result != 'skipped' || needs.manual.result != 'skipped')
    permissions:
      contents: read
      actions: read # download this run's profile artifacts
      pull-requests: read
      issues: read # issue filing is paused; Monday report only lists existing issues
    uses: ./.github/workflows/analyze-app-profiling.yml
    with:
      performance_run_id: ${{ github.run_id }}
      performance_event: ${{ github.event_name }}
      performance_result: ${{ github.event_name == 'schedule' && needs.scheduled-e2e.result || needs.manual.result }}
    secrets:
      E2E_CLAUDE_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
