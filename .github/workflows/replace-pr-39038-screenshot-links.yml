name: Replace PR 39038 screenshot links

# Temporary. Deletes the in-repo screenshot URLs from the PR description.
# Removed in the follow-up commit on this branch.

on:
  push:
    branches:
      - cursor/money-bank-transfer-no-fees-tag

permissions:
  contents: read
  pull-requests: write

jobs:
  replace-body:
    runs-on: ubuntu-latest
    steps:
      - name: Replace pull request description
        uses: actions/github-script@v7
        env:
          PR_BODY_B64: 
        with:
          script: |
            const body = Buffer.from(process.env.PR_BODY_B64, 'base64').toString('utf8');
            if (body.includes('raw.githubusercontent.com') || body.includes('pr-screenshots')) {
              core.setFailed('Refusing to write a description that still points at in-repo screenshots');
              return;
            }
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 39038,
              body,
            });
            core.info('Updated PR 39038 description');
