              exit "$rc"
            fi
          }
          time_half syntax
          time_half cross
          revert
          trap - EXIT
      - name: Require clean working directory
        shell: bash
        run: |
          if ! git diff --exit-code; then
            echo "Working tree dirty at end of job"
            exit 1
          else
            echo "No changes detected"
          fi
