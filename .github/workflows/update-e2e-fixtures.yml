# Weekly E2E fixture refresh.
#
# Builds the main-e2e Android app from the default branch, runs the
# FixtureValidation spec (completes onboarding, exports live app state and
# compares it with the committed tests/framework/fixtures/json/default-fixture.json),
# and, when the committed fixture is out of date, opens (or refreshes) a PR with
# the updated fixture.
#
# Only structural changes (new/missing keys, type mismatches) and auto-updatable
# keys are merged. Other value mismatches are intentionally NOT merged since the
# fixture represents an existing user, not fresh post-onboarding state.
#
# This replaces the per-PR "Validate E2E Fixtures" check in ci.yml and the
# `@metamaskbot update-mobile-fixture` PR comment command.
#
# Trigger: weekly schedule (runs from the default branch) or manually via the
# Actions tab with workflow_dispatch.
#
# Dry run: set `dry_run` on a manual run to build, validate and export the
# fixture without pushing a branch or opening a PR. The result is written to the
# run summary and the updated fixture is uploaded as an artifact. A PR is only
# ever opened from a run on the default branch, so a manual run from any other
# branch is always a dry run.

name: Update E2E Fixtures

on:
  schedule:
    - cron: '0 6 * * 1' # 06:00 UTC every Monday
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: validate and export the fixture, but do not push a branch or open a PR'
        required: false
        type: boolean
        default: false
      apk_run_id:
        description: 'Optional: reuse the main-e2e Android APK from this CI run ID instead of building one. Skips the build; cannot open a PR.'
        required: false
        type: string
        default: ''
      runner_provider:
        description: 'Runner provider: inherit uses the repo NAMESPACE_RUNNER_* variables'
        required: false
        type: choice
        options:
          - inherit
          - current
          - namespace
        default: inherit

permissions: {}

concurrency:
  group: update-e2e-fixtures
  cancel-in-progress: false

env:
  FIXTURE_PATH: tests/framework/fixtures/json/default-fixture.json
  FIXTURE_BRANCH: chore/update-e2e-default-fixture
  # Effective provider for artifact stores. Mirrors build-android-e2e.yml's resolution chain.
  RESOLVED_RUNNER_PROVIDER: >-
    ${{
      inputs.runner_provider != '' && inputs.runner_provider != 'inherit' && inputs.runner_provider ||
      vars.NAMESPACE_RUNNER_ANDROID || vars.NAMESPACE_RUNNER_PROVIDER || 'current'
    }}

jobs:
  build-android:
    name: Build Android E2E APK
    if: ${{ github.repository == 'MetaMask/metamask-mobile' && !inputs.apk_run_id }}
    permissions:
      contents: read
      id-token: write # required for AWS OIDC role assumption when fetching signing keystores
      actions: read
    uses: ./.github/workflows/build-android-e2e.yml
    with:
      build_type: main
      metamask_environment: e2e
      runner_provider: ${{ inputs.runner_provider || 'inherit' }}
    secrets: inherit

  update-fixtures:
    name: Export & validate fixtures
    needs: build-android
    # The build is skipped when an existing APK run is supplied.
    if: >-
      ${{
        !cancelled() &&
        github.repository == 'MetaMask/metamask-mobile' &&
        (needs.build-android.result == 'success' || needs.build-android.result == 'skipped')
      }}
    runs-on: >-
      ${{
        (inputs.runner_provider != '' && inputs.runner_provider != 'inherit' && inputs.runner_provider ||
         vars.NAMESPACE_RUNNER_ANDROID || vars.NAMESPACE_RUNNER_PROVIDER || 'current') == 'namespace' &&
        'namespace-profile-metamask-android-e2e' ||
        fromJSON('["ghcr.io/cirruslabs/ubuntu-runner-amd64:24.04-lg", "low-priority"]')
      }}
    timeout-minutes: 45
    permissions:
      contents: read
      # Namespace checkout/OIDC (mirrors the Validate E2E Fixtures job it replaces).
      id-token: write
      actions: read
    outputs:
      SHOULD_COMMIT: ${{ steps.evaluate.outputs.SHOULD_COMMIT }}
    steps:
      - name: Checkout (Namespace)
        if: ${{ env.RESOLVED_RUNNER_PROVIDER == 'namespace' }}
        uses: namespacelabs/nscloud-checkout-action@938f5d2d403d6224d9a0c0dc559b1dae09c2ede4 # v8.1.1

      - name: Checkout
        if: ${{ env.RESOLVED_RUNNER_PROVIDER != 'namespace' }}
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup Android AVD & Appium
        uses: ./.github/actions/setup-e2e-env
        with:
          platform: android
          setup-simulator: 'true'
          android-avd-name: appium_smoke_avd
          android-tag: default
          android-api-level: '36'
          android-abi: x86_64
          android-device: pixel_5
          configure-keystores: 'false'
          install-foundry: 'true'
          runner_provider: ${{ env.RESOLVED_RUNNER_PROVIDER }}

      - name: Determine Android artifact paths
        id: android-artifacts
        run: |
          {
            echo "apk-target-path=android/app/build/outputs/apk/prod/release"
            echo "apk-file-name=app-prod-release.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Download Android build artifacts
        uses: ./.github/actions/download-e2e-artifact
        with:
          name: main-e2e-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}
          runner-provider: ${{ env.RESOLVED_RUNNER_PROVIDER }}
          # Empty run-id downloads from this run's build job.
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The spec throws when it had to update the fixture, so a failing step is
      # expected here. The "Evaluate" step below tells that apart from a real
      # infrastructure/test failure by checking for the result JSON.
      - name: Run fixture validation tests
        id: run-tests-android
        timeout-minutes: 25
        continue-on-error: true
        env:
          SPEC_FILES: tests/smoke-appium/fixtures/fixture-validation.spec.ts
          APPIUM_SMOKE_SUITE_NAME: update-e2e-fixtures
          APPIUM_SMOKE_JOB_TITLE: Appium update-e2e-fixtures (android)
          APPIUM_SMOKE_ARTIFACT_NAME: appium-smoke-report-update-e2e-fixtures
          APPIUM_SMOKE_VIDEOS_ARTIFACT_NAME: appium-smoke-videos-update-e2e-fixtures
          PLAYWRIGHT_JSON_OUTPUT_FILE: tests/test-reports/playwright-json/playwright-report.json
          APPIUM_RECORD_VIDEO_ON_FAILURE: 'true'
          SKIP_APPIUM_STOP: 'true'
          APPIUM_RETRIES_OVERRIDE: 0
          ANDROID_APK_PATH: ${{ steps.android-artifacts.outputs.apk-target-path }}/${{ steps.android-artifacts.outputs.apk-file-name }}
          ANDROID_AVD_NAME: appium_smoke_avd
          ANDROID_APPIUM_USE_PACKAGE_ONLY: 'true'
          ANDROID_BOOT_TIMEOUT_MS: '300000'
          ANDROID_EMULATOR_CI_CORES: '8'
          ANDROID_EMULATOR_POST_BOOT_SETTLE_MS: '30000'
          ANDROID_EMULATOR_NETWORK_READY_TIMEOUT_MS: '90000'
          ANDROID_EMULATOR_NETWORK_READY_CONSECUTIVE_PINGS: '3'
          MM_INFURA_PROJECT_ID: ${{ secrets.MM_INFURA_PROJECT_ID }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "${SPEC_FILES}"
          yarn playwright test "${specs[@]}" \
            --config tests/playwright.smoke-appium.config.ts \
            --project android-smoke \
            --grep FixtureValidation

      - name: Evaluate fixture validation result
        id: evaluate
        env:
          APK_RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          RESULT_FILE="tests/reports/fixture-validation-result.json"

          # The spec writes the result JSON before it throws on an out-of-date
          # fixture. If it is missing, the test never got that far (emulator,
          # build or onboarding failure) and the run must not be reported as
          # "no changes".
          if [ ! -f "$RESULT_FILE" ]; then
            echo "::error title=Fixture validation did not run::${RESULT_FILE} was not produced. Check the test logs."
            exit 1
          fi

          cat "$RESULT_FILE"

          if git diff --quiet -- "$FIXTURE_PATH"; then
            SHOULD_COMMIT=false
            echo "Committed fixture is up to date."
          else
            SHOULD_COMMIT=true
            echo "Committed fixture is out of date; updated fixture exported."
          fi
          echo "SHOULD_COMMIT=${SHOULD_COMMIT}" >> "$GITHUB_OUTPUT"

          if [ -n "$APK_RUN_ID" ]; then
            APK_SOURCE="reused from CI run \`${APK_RUN_ID}\`"
          else
            APK_SOURCE="built in this run"
          fi

          # Surface the outcome on the run page so a dry run (or a quiet week)
          # is readable without opening the logs or downloading artifacts.
          {
            echo "### E2E fixture validation"
            echo ""
            echo "- Fixture update needed: \`${SHOULD_COMMIT}\`"
            echo "- Run ref: \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::12}\`)"
            echo "- APK source: ${APK_SOURCE}"
            echo ""
            echo "<details><summary>Validation result</summary>"
            echo ""
            echo '```json'
            cat "$RESULT_FILE"
            echo '```'
            echo "</details>"
            if [ -f tests/reports/fixture-validation-diff.txt ]; then
              echo ""
              echo "<details><summary>Diff report (first 300 lines)</summary>"
              echo ""
              echo '```text'
              head -n 300 tests/reports/fixture-validation-diff.txt
              echo '```'
              echo "</details>"
            fi
            if [ "$SHOULD_COMMIT" = "true" ]; then
              echo ""
              echo "<details><summary>Fixture diff stat</summary>"
              echo ""
              echo '```text'
              git diff --stat -- "$FIXTURE_PATH"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload updated fixture
        if: ${{ steps.evaluate.outputs.SHOULD_COMMIT == 'true' }}
        uses: ./.github/actions/dual-upload-e2e-artifact
        with:
          name: updated-e2e-default-fixture
          path: ${{ env.FIXTURE_PATH }}
          if-no-files-found: error
          retention-days: 7
          runner-provider: ${{ env.RESOLVED_RUNNER_PROVIDER }}

      - name: Upload fixture validation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: fixture-validation-results
          path: |
            tests/reports/fixture-validation-result.json
            tests/reports/fixture-validation-diff.txt
          if-no-files-found: ignore
          retention-days: 14

  open-fixture-pr:
    name: Open fixture update PR
    needs: update-fixtures
    # The PR branch is cut from the default branch, so only a run on the default
    # branch (and not a dry run) may open one. Otherwise a run from another ref
    # would commit that ref's exported app state onto the default branch.
    if: >-
      ${{
        needs.update-fixtures.outputs.SHOULD_COMMIT == 'true' &&
        inputs.dry_run != true &&
        !inputs.apk_run_id &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      }}
    runs-on: >-
      ${{
        (inputs.runner_provider != '' && inputs.runner_provider != 'inherit' && inputs.runner_provider ||
         vars.NAMESPACE_RUNNER_ANDROID || vars.NAMESPACE_RUNNER_PROVIDER || 'current') == 'namespace' &&
        'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest'
      }}
    timeout-minutes: 15
    permissions:
      id-token: write # OIDC for the token exchange below
      contents: read
    steps:
      # Mint a short-lived token via the token-exchange service. Using it (rather
      # than GITHUB_TOKEN) lets the pushed branch trigger the PR's CI workflows.
      #   workflows: write — workaround for a GitHub push-protection timeout bug
      #   on new branch pushes (actions/checkout#2287); no workflow files are touched.
      - name: Get token
        id: get-token
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            metadata: read
            contents: write
            pull_requests: write
            workflows: write

      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.get-token.outputs.token }}

      - name: Download updated fixture
        uses: ./.github/actions/download-e2e-artifact
        with:
          name: updated-e2e-default-fixture
          path: tests/framework/fixtures/json
          runner-provider: ${{ env.RESOLVED_RUNNER_PROVIDER }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Format updated fixture with prettier
        run: yarn prettier --write "$FIXTURE_PATH"

      # The exporter output can differ from the committed file only by
      # formatting; check again after prettier so we never open an empty PR.
      - name: Check for fixture changes
        id: fixture-changes
        run: |
          if git diff --quiet -- "$FIXTURE_PATH"; then
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
            echo "No changes to the fixture after formatting."
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push fixture update branch
        if: ${{ steps.fixture-changes.outputs.HAS_CHANGES == 'true' }}
        run: |
          git config user.name 'MetaMask Bot'
          git config user.email 'metamaskbot@users.noreply.github.com'
          git checkout -B "$FIXTURE_BRANCH"
          git add "$FIXTURE_PATH"
          git commit -m "chore: update E2E default fixture"
          # The branch is rebuilt from the default branch on every run, so a
          # stale branch from a previous week is safely replaced.
          git push --force origin "$FIXTURE_BRANCH"

      - name: Open or refresh pull request
        if: ${{ steps.fixture-changes.outputs.HAS_CHANGES == 'true' }}
        env:
          GITHUB_TOKEN: ${{ steps.get-token.outputs.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING_PR=$(gh pr list --head "$FIXTURE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING_PR" ]; then
            gh pr comment "$EXISTING_PR" --body "🔄 Fixture branch refreshed by the weekly run: ${RUN_URL}"
            echo "Updated existing PR #${EXISTING_PR}"
            exit 0
          fi

          cat > pr-body.md <<EOF
          ## **Description**

          Weekly automated refresh of the committed E2E default fixture
          (\`${FIXTURE_PATH}\`).

          The FixtureValidation spec exported the live post-onboarding app state from
          \`${BASE_BRANCH}\` and found structural differences (new/missing keys or type
          mismatches) or auto-updatable keys that changed. Other value mismatches are
          intentionally not merged because the fixture represents an existing user.

          Workflow run: ${RUN_URL}

          ## **Changelog**

          CHANGELOG entry: null

          ## **Related issues**

          Fixes:

          ## **Manual testing steps**

          N/A — review the fixture diff and confirm the E2E CI checks pass.

          ## **Screenshots/Recordings**

          N/A

          ## **Pre-merge author checklist**

          - [x] I've followed [MetaMask Contributor Docs](https://github.com/MetaMask/contributor-docs) and [MetaMask Mobile Coding Standards](https://github.com/MetaMask/metamask-mobile/blob/main/.github/guidelines/CODING_GUIDELINES.md).
          - [x] I've completed the PR template to the best of my ability
          - [x] I've included tests if applicable
          - [x] I've documented my code using [JSDoc](https://jsdoc.app/) format if applicable
          - [x] I've applied the right labels on the PR (see [labeling guidelines](https://github.com/MetaMask/metamask-mobile/blob/main/.github/guidelines/LABELING_GUIDELINES.md)). Not required for external contributors.

          ## **Pre-merge reviewer checklist**

          - [ ] I've manually tested the PR (e.g. pull and build branch, run the app, test code being changed).
          - [ ] I confirm that this PR addresses all acceptance criteria described in the ticket it closes and includes the necessary testing evidence such as recordings and or screenshots.
          EOF

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$FIXTURE_BRANCH" \
            --title "chore: update E2E default fixture" \
            --body-file pr-body.md
