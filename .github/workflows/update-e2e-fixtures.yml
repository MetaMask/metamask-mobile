# Updates committed E2E fixture files by running the app and exporting live state.
# Only merges structural changes (new/missing keys, type mismatches).
# Value mismatches are reported but not auto-merged since the fixture represents
# an existing user, not fresh post-onboarding state.
#
# Trigger via bot command on a PR: @metamaskbot update-mobile-fixture
# Or manually via Actions tab with workflow_dispatch.
#
# NOTE: issue_comment always runs from the default branch (main).
# To use the workflow version from the PR branch, the issue_comment handler
# dispatches a workflow_dispatch event on the PR branch, then exits.

name: Update E2E Fixtures

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to update fixtures for'
        required: true
        type: string
      runner_provider:
        description: Runner provider for this manual trial run
        required: false
        type: choice
        options:
          - current
          - namespace
        default: namespace

jobs:
  # ── issue_comment dispatcher ──────────────────────────────────────────
  # Validates the comment, then re-dispatches this workflow on the PR branch.
  dispatch:
    name: Dispatch to PR branch
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '@metamaskbot update-mobile-fixture')
      }}
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Get PR details
        id: pr
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          IS_FORK=$(gh pr view "${PR_NUMBER}" --json isCrossRepository --jq '.isCrossRepository')
          BRANCH=$(gh pr view "${PR_NUMBER}" --json headRefName --jq '.headRefName')
          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "IS_FORK=${IS_FORK}"
            echo "BRANCH=${BRANCH}"
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch workflow on PR branch
        if: steps.pr.outputs.IS_FORK == 'false'
        run: |
          gh workflow run "Update E2E Fixtures" \
            --ref "${{ steps.pr.outputs.BRANCH }}" \
            -f pr_number="${{ steps.pr.outputs.PR_NUMBER }}"

          gh pr comment "${PR_NUMBER}" --body "🔄 **Fixture update started.** Running workflow from branch \`${{ steps.pr.outputs.BRANCH }}\`. [View workflow runs](${ACTIONS_URL})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.PR_NUMBER }}
          ACTIONS_URL: '${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-e2e-fixtures.yml'

  # ── workflow_dispatch: actual fixture update ──────────────────────────
  # Everything below only runs on workflow_dispatch (from PR branch).

  is-fork-pull-request:
    name: Validate PR
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      IS_FORK: ${{ steps.is-fork.outputs.IS_FORK }}
      PR_NUMBER: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine whether this PR is from a fork
        id: is-fork
        run: echo "IS_FORK=$(gh pr view --json isCrossRepository --jq '.isCrossRepository' "${PR_NUMBER}" )" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}

  prepare:
    name: Prepare build artifacts
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest' }}
    timeout-minutes: 10
    needs: is-fork-pull-request
    if: ${{ needs.is-fork-pull-request.outputs.IS_FORK == 'false' }}
    outputs:
      COMMIT_SHA: ${{ steps.commit-sha.outputs.COMMIT_SHA }}
      BRANCH: ${{ steps.branch.outputs.BRANCH }}
      PR_NUMBER: ${{ needs.is-fork-pull-request.outputs.PR_NUMBER }}
      RUN_ID: ${{ steps.validate-ci.outputs.RUN_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pull request
        run: gh pr checkout "${PR_NUMBER}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.is-fork-pull-request.outputs.PR_NUMBER }}

      - name: Get commit SHA
        id: commit-sha
        run: echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get branch name
        id: branch
        run: echo "BRANCH=$(gh pr view "${PR_NUMBER}" --json headRefName --jq '.headRefName')" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.is-fork-pull-request.outputs.PR_NUMBER }}

      - name: Validate CI run and resolve RUN_ID
        id: validate-ci
        run: |
          COMMIT_SHA_FULL=$(git rev-parse HEAD)
          BRANCH="${{ steps.branch.outputs.BRANCH }}"
          echo "::group::Checking CI workflow status"

          # Get the most recent ci workflow run for this branch
          RUN_INFO=$(gh run list --workflow "ci" --branch "${BRANCH}" --json databaseId,status,conclusion,headSha --limit 1 --jq 'first')

          if [ -z "$RUN_INFO" ] || [ "$RUN_INFO" = "null" ]; then
            echo "::error title=No CI workflow found::No 'ci' workflow run found for branch ${BRANCH}. Push a commit to trigger CI first."
            exit 1
          fi

          RUN_ID=$(echo "$RUN_INFO" | jq -r '.databaseId')
          RUN_STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          RUN_CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          RUN_HEAD_SHA=$(echo "$RUN_INFO" | jq -r '.headSha')
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${RUN_ID}"
          echo "RUN_ID=${RUN_ID}" >> "$GITHUB_OUTPUT"

          echo "CI workflow run: ${RUN_URL}"
          echo "Status: ${RUN_STATUS}, Conclusion: ${RUN_CONCLUSION}"
          echo "CI commit: ${RUN_HEAD_SHA}"
          echo "PR HEAD commit: ${COMMIT_SHA_FULL}"
          echo "::endgroup::"

          if [ "${RUN_HEAD_SHA}" != "${COMMIT_SHA_FULL}" ]; then
            echo "::error title=CI not up to date::The latest CI workflow (commit ${RUN_HEAD_SHA:0:7}) does not match the PR HEAD (commit ${COMMIT_SHA_FULL:0:7}). Wait for CI to run on the latest commit, then try again."
            exit 1
          fi

          if [ "${RUN_STATUS}" != "completed" ]; then
            echo "::error title=CI still running::The CI workflow is still in progress (status: ${RUN_STATUS}). Wait for the 'Build Android APKs' job to complete, then run @metamaskbot update-mobile-fixture again. View CI: ${RUN_URL}"
            exit 1
          fi

          if [ "${RUN_CONCLUSION}" != "success" ]; then
            echo "::warning title=CI did not succeed::The CI workflow concluded with '${RUN_CONCLUSION}'. The Android build artifact may not be available. View CI: ${RUN_URL}"
          fi

          echo "✅ CI run validated. RUN_ID=${RUN_ID}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-fixtures:
    name: Export & update fixtures
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-android-e2e' || (startsWith(github.base_ref, 'release/') && fromJSON('["ghcr.io/cirruslabs/macos-runner:tahoe"]') || fromJSON('["ghcr.io/cirruslabs/macos-runner:tahoe", "low-priority"]')) }}
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
      pull-requests: write
    needs:
      - prepare
      - is-fork-pull-request
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.is-fork-pull-request.outputs.IS_FORK == 'false' }}

    steps:
      - name: Setup Node for shard selection
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Download frozen qa-stats timings
        id: download-timings
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-timings-${{ github.run_id }}
          path: ./

      - name: Fetch qa-stats timings fallback
        if: steps.download-timings.outcome != 'success'
        run: node .github/scripts/e2e-freeze-timings.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.is-fork-pull-request.outputs.PR_NUMBER }}
          OUTPUT_PATH: ./e2e-timings.json

      - name: Select specs for fixture validation
        id: select-specs
        run: |
          # Single fixture validation spec — no sharding/selection needed.
          SPEC_FILES="tests/smoke-appium/fixtures/fixture-validation.spec.ts"
          {
            echo "spec_count=1"
            echo "spec_files=${SPEC_FILES}"
            echo "changed_spec_files=${SPEC_FILES}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Android AVD & Appium
        uses: ./.github/actions/setup-e2e-env
        with:
          platform: android
          setup-simulator: 'true'
          android-avd-name: appium_smoke_avd
          android-tag: ${{ inputs.android-tag }}
          android-api-level: '36'
          android-abi: x86_64
          android-device: pixel_5
          configure-keystores: 'false'
          install-foundry: 'true'
          runner_provider: ${{ inputs.runner_provider }}

      - name: Determine Android artifact paths
        id: android-artifacts
        run: |
          if [[ "${{ inputs.build_type }}" == "flask" ]]; then
            {
              echo "apk-target-path=android/app/build/outputs/apk/flask/release"
              echo "apk-file-name=app-flask-release.apk"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "apk-target-path=android/app/build/outputs/apk/prod/release"
              echo "apk-file-name=app-prod-release.apk"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android build artifacts (Namespace)
        if: ${{ inputs.runner_provider == 'namespace' && steps.select-specs.outputs.spec_count != '0' }}
        id: download-android-apk-namespace
        continue-on-error: true
        uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2.0.1
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}

      - name: Download Android build artifacts (fallback)
        if: ${{ 
          inputs.runner_provider == 'namespace' && 
          steps.select-specs.outputs.spec_count != '0' &&
          steps.download-android-apk-namespace.outcome != 'success' 
        }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}

      - name: Download Android build artifacts (current)
        if: ${{ inputs.runner_provider != 'namespace' && steps.select-specs.outputs.spec_count != '0' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.build_type }}-${{ inputs.metamask_environment }}-release.apk
          path: ${{ steps.android-artifacts.outputs.apk-target-path }}

      - name: Run fixture validation tests
        id: run-tests-android
        timeout-minutes: ${{ inputs.test-timeout-minutes }}
        continue-on-error: true
        env:
          SPEC_FILES: ${{ steps.select-specs.outputs.spec_files }}
          APPIUM_SMOKE_SUITE_NAME: update-e2e-fixtures
          APPIUM_SMOKE_JOB_TITLE: Appium update-e2e-fixtures (android)
          APPIUM_SMOKE_ARTIFACT_NAME: appium-smoke-report-update-e2e-fixtures
          APPIUM_SMOKE_VIDEOS_ARTIFACT_NAME: appium-smoke-videos-update-e2e-fixtures
          PLAYWRIGHT_JSON_OUTPUT_FILE: tests/test-reports/playwright-json/playwright-report.json
          APPIUM_RECORD_VIDEO_ON_FAILURE: 'true'
          SKIP_APPIUM_STOP: 'true'
          APPIUM_RETRIES_OVERRIDE: 0
          ANDROID_APK_PATH: ${{ steps.android-artifacts.outputs.apk-target-path }}/${{ steps.android-artifacts.outputs.apk-file-name }}
          ANDROID_AVD_NAME: appium_smoke_avd
          ANDROID_APPIUM_USE_PACKAGE_ONLY: 'true'
          ANDROID_BOOT_TIMEOUT_MS: '300000'
          ANDROID_EMULATOR_CI_CORES: '8'
          ANDROID_EMULATOR_POST_BOOT_SETTLE_MS: '30000'
          ANDROID_EMULATOR_NETWORK_READY_TIMEOUT_MS: '90000'
          ANDROID_EMULATOR_NETWORK_READY_CONSECUTIVE_PINGS: '3'
          MM_INFURA_PROJECT_ID: ${{ secrets.MM_INFURA_PROJECT_ID }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "${SPEC_FILES}"
          yarn playwright test "${specs[@]}" \
            --config tests/playwright.smoke-appium.config.ts \
            --project android-smoke \
            --grep "${{ inputs.test_suite_tag }}" \
            --pass-with-no-tests

      - name: Cache updated fixture
        uses: actions/cache/save@v4
        with:
          path: tests/framework/fixtures/json/default-fixture.json
          key: fixture-${{ needs.prepare.outputs.COMMIT_SHA }}

  commit-updated-fixtures:
    name: Commit the updated fixtures
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    needs:
      - prepare
      - is-fork-pull-request
      - update-fixtures
    if: ${{ !cancelled() && needs.update-fixtures.result == 'success' && needs.is-fork-pull-request.outputs.IS_FORK == 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout pull request
        run: gh pr checkout "${PR_NUMBER}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.PR_NUMBER }}

      - name: Restore updated fixture
        uses: actions/cache/restore@v4
        with:
          path: tests/framework/fixtures/json/default-fixture.json
          key: fixture-${{ needs.prepare.outputs.COMMIT_SHA }}
          fail-on-cache-miss: true

      - name: Check for fixture changes
        id: fixture-changes
        run: |
          if git diff --exit-code tests/framework/fixtures/json/default-fixture.json; then
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.fixture-changes.outputs.HAS_CHANGES == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        if: steps.fixture-changes.outputs.HAS_CHANGES == 'true'
        run: yarn install --immutable

      - name: Format updated fixture with prettier
        if: steps.fixture-changes.outputs.HAS_CHANGES == 'true'
        run: yarn prettier --write tests/framework/fixtures/json/default-fixture.json

      # Note: Commits pushed with the default GITHUB_TOKEN do not trigger
      # downstream CI workflows (GitHub anti-loop protection). This is
      # intentional — a follow-up push or manual CI re-run will validate
      # the updated fixture. Use a PAT or GitHub App token if auto-triggered
      # CI is needed in the future.
      - name: Commit the updated fixture
        if: steps.fixture-changes.outputs.HAS_CHANGES == 'true'
        run: |
          git config --global user.name 'MetaMask Bot'
          git config --global user.email 'metamaskbot@users.noreply.github.com'
          git commit -am "chore: update E2E default fixture"
          git push

      - name: Post comment
        run: |
          if [[ $HAS_CHANGES == 'true' ]]; then
            gh pr comment "${PR_NUMBER}" --body 'E2E fixtures updated.'
          else
            gh pr comment "${PR_NUMBER}" --body 'No E2E fixture changes detected.'
          fi
        env:
          HAS_CHANGES: ${{ steps.fixture-changes.outputs.HAS_CHANGES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare.outputs.PR_NUMBER }}

  check-status:
    name: Check whether the fixture update succeeded
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest' }}
    timeout-minutes: 5
    if: ${{ !cancelled() && needs.is-fork-pull-request.outputs.IS_FORK == 'false' }}
    needs:
      - is-fork-pull-request
      - commit-updated-fixtures
    outputs:
      PASSED: ${{ steps.set-output.outputs.PASSED }}
    steps:
      - name: Set PASSED output
        id: set-output
        run: |
          if [[ "${{ needs.commit-updated-fixtures.result }}" == "success" ]]; then
            echo "PASSED=true" >> "$GITHUB_OUTPUT"
          else
            echo "PASSED=false" >> "$GITHUB_OUTPUT"
          fi

  failure-comment:
    name: Comment about the fixture update failure
    if: ${{ !cancelled() && needs.is-fork-pull-request.outputs.IS_FORK == 'false' }}
    runs-on: ${{ inputs.runner_provider == 'namespace' && 'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    needs:
      - is-fork-pull-request
      - check-status
    steps:
      - uses: actions/checkout@v4

      - name: Post comment if the update failed
        run: |
          passed="${{ needs.check-status.outputs.PASSED }}"
          if [[ $passed != "true" ]]; then
            body="❌ **E2E fixture update failed.**\n\n**Common causes:**\n- CI workflow is still running — wait for 'Build Android APKs' to complete and re-run CI; ignorable-only PRs need Android-impacting app changes\n- Android build failed — check the CI workflow for errors\n\n[View logs and retry](${ACTION_RUN_URL})"
            gh pr comment "${PR_NUMBER}" --body "$body"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.is-fork-pull-request.outputs.PR_NUMBER }}
          ACTION_RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
