# Ad-hoc per-scenario app profiling analysis
#
# Downloads BrowserStack app-profiling JSON (and Hermes CPU profiles when
# present) from a scheduled performance E2E run, flags heuristic issues, then
# asks Claude to review each scenario.
#
# Ad-hoc only for now. Does not replace the 6-hour performance suite or the
# weekly rollup automation.
#
# NOTE: GitHub only offers `workflow_dispatch` for workflows that already exist
# on the default branch, so this cannot be launched from a PR branch. The
# `pull_request: [labeled]` trigger exists to exercise it before it lands:
# add the `run-app-profiling-analysis` label to the PR and the PR branch's own
# version of this workflow runs with the latest scheduled performance run.

name: Analyze App Profiling

on:
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Performance workflow run id (blank = latest successful scheduled run on main)'
        required: false
        type: string
        default: ''
      scenario:
        description: 'Optional exact scenario title filter (blank = all scenarios in the run)'
        required: false
        type: string
        default: ''
      baseline_run_id:
        description: 'Optional prior run id to compare metrics against'
        required: false
        type: string
        default: ''
      skip_ai:
        description: 'Skip Claude analysis (heuristics only)'
        required: false
        type: boolean
        default: false
      post_to_slack:
        description: 'Post the analysis summary to the personal debug Slack DM (DEZ9UAP8T)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze per-scenario profiling
    # Label runs are a pre-merge smoke test of this workflow, so they are
    # restricted to same-repo PRs where the secrets are available.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'run-app-profiling-analysis' &&
       !github.event.pull_request.head.repo.fork)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Analyze app profiling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          E2E_CLAUDE_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
          RUN_ID: ${{ inputs.run_id }}
          SCENARIO: ${{ inputs.scenario }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          SKIP_AI: ${{ inputs.skip_ai }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/analyze-app-profiling
          ARGS=(
            node tests/scripts/analyze-app-profiling.mjs
            --out-dir /tmp/analyze-app-profiling
            --repo "${GITHUB_REPOSITORY}"
          )
          if [ -n "${RUN_ID}" ]; then
            ARGS+=(--run "${RUN_ID}")
          fi
          if [ -n "${SCENARIO}" ]; then
            ARGS+=(--scenario "${SCENARIO}")
          fi
          if [ -n "${BASELINE_RUN_ID}" ]; then
            ARGS+=(--baseline-run "${BASELINE_RUN_ID}")
          fi
          if [ "${SKIP_AI}" = "true" ]; then
            ARGS+=(--skip-ai)
          fi
          "${ARGS[@]}"

      - name: Write job summary
        if: always()
        run: |
          if [ -f /tmp/analyze-app-profiling/github-summary.md ]; then
            cat /tmp/analyze-app-profiling/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No analysis summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-profiling-analysis
          path: /tmp/analyze-app-profiling/
          if-no-files-found: ignore
          retention-days: 30

      - name: Post Slack summary
        # Label runs always post: seeing the message arrive is the point of the
        # pre-merge test. Dispatch runs honour the checkbox.
        if: >-
          ${{ success() &&
          (github.event_name != 'workflow_dispatch' || inputs.post_to_slack) }}
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Personal debug DM while this workflow is ad-hoc.
          SLACK_CHANNEL_ID: DEZ9UAP8T
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f /tmp/analyze-app-profiling/slack.md ]; then
            echo "No slack.md to post"
            exit 0
          fi
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("SLACK_BOT_TOKEN", "")
          channel = os.environ["SLACK_CHANNEL_ID"]
          run_url = os.environ.get("GITHUB_RUN_URL", "")
          if not token:
              raise SystemExit("SLACK_BOT_TOKEN is empty")

          with open("/tmp/analyze-app-profiling/slack.md", encoding="utf-8") as handle:
              text = handle.read().strip()
          if run_url:
              text = f"{text}\n<{run_url}|GitHub run>"
          if len(text) > 39000:
              text = text[:39000] + "\n_Truncated for Slack._"

          payload = json.dumps(
              {
                  "channel": channel,
                  "text": text,
                  "unfurl_links": False,
                  "unfurl_media": False,
              }
          ).encode("utf-8")
          request = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request) as response:
                  body = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Slack HTTP {error.code}: {error.read().decode('utf-8', errors='replace')}") from error

          if not body.get("ok"):
              raise SystemExit(f"Slack chat.postMessage failed: {body}")
          print(f"Slack message sent to {channel} ts={body.get('ts')}")
          PY
