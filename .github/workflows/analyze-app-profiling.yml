# Per-scenario Hermes CPU-profile analysis
#
# Downloads Hermes CPU profiles from a performance E2E run, groups every
# segment and retry by scenario, symbolicates with verified same-run Android
# sourcemaps when available, then emits deterministic skill timing. Claude
# adds optional short context only. TestMu app-profiling metrics are
# intentionally not used.
#
# Per-run analyses are called (`workflow_call`) by the last job of
# `run-performance-e2e-manual.yml`, so they run inside the performance run,
# on its ref, and publish their artifacts there. In that context `github.*`
# describes the performance run, so chained behaviour keys on
# `inputs.performance_run_id` / `inputs.performance_event` instead.
#
# Cadence:
# - After a *scheduled* 6-hour performance run: collect `report.json`, compare
#   the run with the average of the complete, non-spiking runs among the
#   previous six scheduled ticks (~36h), and record either the scenarios that
#   stayed over the 1.5× threshold in two consecutive runs or a one-line
#   all-clear in the Actions summary and the
#   `app-profiling-analysis` artifact. No per-scenario profile zips.
#   Findings also get an optional proposal from the pinned
#   `mms-profiling-regression-proposal` skill (MetaMask/skills#179). The model
#   only sees Evidence JSON from this job; it does not classify.
#   A finding is not filed as a GitHub issue. The verdict, including that
#   proposal when one was produced, is sent as a Slack DM to UEYQL2PEV.
#   An all-clear, a manual digest, and the Monday report are not sent.
#   The Monday report can still list issues that were already opened; it
#   does not open or comment on any.
# - After a *manually dispatched* performance run: full digest in the Actions
#   summary and the analysis artifact.
# - Monday 09:00 UTC: week-over-week exception report (this completed UTC
#   week vs the week before). The report lists only regressions / spikes / new
#   hot frames, plus the GitHub issues opened during that week with a
#   one-line brief and link each. Stable scenarios are omitted. The report is
#   the Actions summary and the analysis artifact.
#
# The only Slack post is that finding DM. It uses `SLACK_BOT_TOKEN`, which
# authenticates as the metamask-wallet-platform-bot Slack app. Channels stay
# quiet. Nightly, RC, and dependency-audit workflows still use the same secret.
#
# `lookback_hours` remains available on workflow_dispatch for an ad-hoc
# window. `--weekly` is the Monday path.
#
# NOTE: GitHub only offers `workflow_dispatch` for workflows that already exist
# on the default branch. After this lands on `main`, run it from Actions.
# It does not run on pull requests.

name: Analyze App Profiling

on:
  schedule:
    # Monday after the previous UTC week has closed (Mon 00:00 → Mon 00:00).
    - cron: '0 9 * * 1'
  workflow_call:
    inputs:
      performance_run_id:
        description: 'Performance run that produced the Hermes profiles (the caller run)'
        required: true
        type: string
      performance_event:
        description: 'Event that started the performance run (schedule or workflow_dispatch)'
        required: true
        type: string
      performance_result:
        description: 'Result of the performance E2E job (success, failure, cancelled)'
        required: true
        type: string
    secrets:
      E2E_CLAUDE_API_KEY:
        required: false
      SLACK_BOT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Performance workflow run id (blank = latest successful scheduled run on main)'
        required: false
        type: string
        default: ''
      lookback_hours:
        description: 'Analyze every scheduled run in the last N hours and report medians (blank = single run)'
        required: false
        type: string
        default: ''
      weekly:
        description: 'Build the Monday week-over-week exception report instead of a single run'
        required: false
        type: boolean
        default: false
      max_runs_per_week:
        description: 'Weekly only: cap uncollected runs re-analyzed per week (blank = every run)'
        required: false
        type: string
        default: ''
      max_analysis_minutes:
        description: 'Weekly only: wall clock spent rebuilding uncollected runs (blank = 25)'
        required: false
        type: string
        default: ''
      scenario:
        description: 'Optional exact scenario title filter (blank = all scenarios in the run)'
        required: false
        type: string
        default: ''
      skip_ai:
        description: 'Skip Claude analysis (Hermes summaries only)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  # Weekly jobs share one group. Per-run collection keys on the performance
  # run so a chain and a dispatch of the same id collapse. The chained id
  # comes first because a scheduled caller also reports `schedule`.
  group: analyze-app-profiling-${{ inputs.performance_run_id || (github.event_name == 'schedule' && 'weekly') || (inputs.weekly && 'weekly') || inputs.run_id || github.run_id }}
  cancel-in-progress: true

jobs:
  # A failed performance suite produces no analysis, so without this the
  # chained run would simply go quiet and look like nothing was ever requested.
  report-upstream-failure:
    name: Report unsuccessful performance run
    permissions: {}
    if: >-
      inputs.performance_run_id != '' &&
      inputs.performance_event == 'workflow_dispatch' &&
      inputs.performance_result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record unsuccessful performance run
        env:
          # Link to the performance run that failed, not to this reporter.
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ inputs.performance_run_id }}
          PERFORMANCE_RUN_ID: ${{ inputs.performance_run_id }}
          PERFORMANCE_CONCLUSION: ${{ inputs.performance_result }}
        run: |
          set -euo pipefail
          {
            echo "## Hermes CPU-profile analysis did not run"
            echo
            echo "The performance suite finished as \`${PERFORMANCE_CONCLUSION}\`, so there are no profiles to analyze."
            echo
            echo "Performance run: ${GITHUB_RUN_URL} (\`${PERFORMANCE_RUN_ID}\`)"
            echo
            echo "Retry the analysis: Actions → Analyze App Profiling → \`run_id\` = \`${PERFORMANCE_RUN_ID}\` (useful when only some scenarios failed)."
          } >> "$GITHUB_STEP_SUMMARY"

  analyze:
    name: Analyze per-scenario profiling
    permissions:
      contents: read
      actions: read
      pull-requests: read
      # Read-only. Issue filing is paused; the Monday report only lists
      # issues that already exist.
      issues: read
    if: >-
      inputs.performance_run_id == '' ||
      (inputs.performance_result == 'success' &&
       (inputs.performance_event == 'workflow_dispatch' ||
        inputs.performance_event == 'schedule'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      scenario-matrix: ${{ steps.scenario-matrix.outputs.matrix }}
      upload-profiles: ${{ steps.flags.outputs.upload-profiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JavaScript dependencies
        uses: ./.github/actions/setup-ci-js-deps

      - name: Load MetaMask performance analysis skills
        run: yarn skills

      # Decision rules for the optional findings proposal live in
      # MetaMask/skills, not in this repo. Pin the SHA so a skills `main`
      # bump cannot change Slack copy until we review it.
      # https://github.com/MetaMask/skills/pull/179
      - name: Pin profiling regression proposal skill
        continue-on-error: true
        env:
          SKILLS_REF: d384dd6713c575be5201aab29b542ed358949ab3
        run: |
          set -euo pipefail
          SKILLS_DIR="$RUNNER_TEMP/metamask-skills"
          git clone --filter=blob:none https://github.com/MetaMask/skills.git "$SKILLS_DIR"
          git -C "$SKILLS_DIR" checkout "$SKILLS_REF"
          "$SKILLS_DIR/tools/install" \
            --repo metamask-mobile \
            --target "$GITHUB_WORKSPACE" \
            --source "$SKILLS_DIR" \
            --include performance/profiling-regression-proposal

      - name: Analyze app profiling
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          E2E_CLAUDE_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
          # A chained run analyzes the performance run that called it.
          RUN_ID: ${{ inputs.performance_run_id || inputs.run_id }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          SCENARIO: ${{ inputs.scenario }}
          SKIP_AI: ${{ inputs.skip_ai }}
          WEEKLY: ${{ inputs.performance_run_id == '' && (github.event_name == 'schedule' || inputs.weekly == true) }}
          SCHEDULED_EXCEPTION: ${{ inputs.performance_event == 'schedule' }}
          # Issue filing is paused. --github-issues on the weekly path only
          # lists issues already opened; it does not create or comment.
          MAX_RUNS_PER_WEEK: ${{ inputs.max_runs_per_week }}
          MAX_ANALYSIS_MINUTES: ${{ inputs.max_analysis_minutes }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/analyze-app-profiling
          ARGS=(
            node .github/scripts/qa-automation/performance-tests/analyze-app-profiling.mjs
            --out-dir /tmp/analyze-app-profiling
            --repo "${GITHUB_REPOSITORY}"
          )
          if [ "${WEEKLY}" = "true" ]; then
            ARGS+=(--weekly --skip-ai --skip-scenario-artifacts --github-issues)
            if [ -n "${MAX_RUNS_PER_WEEK}" ]; then
              ARGS+=(--max-runs-per-week "${MAX_RUNS_PER_WEEK}")
            fi
            if [ -n "${MAX_ANALYSIS_MINUTES}" ]; then
              ARGS+=(--max-analysis-minutes "${MAX_ANALYSIS_MINUTES}")
            fi
          elif [ -n "${LOOKBACK_HOURS}" ]; then
            ARGS+=(--lookback-hours "${LOOKBACK_HOURS}")
          elif [ -n "${RUN_ID}" ]; then
            ARGS+=(--run "${RUN_ID}")
            if [ "${SCHEDULED_EXCEPTION}" = "true" ]; then
              ARGS+=(--scheduled-exception)
            fi
          fi
          if [ -n "${SCENARIO}" ] && [ "${WEEKLY}" != "true" ]; then
            ARGS+=(--scenario "${SCENARIO}")
          fi
          if [ "${SKIP_AI}" = "true" ] || [ "${WEEKLY}" = "true" ]; then
            ARGS+=(--skip-ai)
          fi
          "${ARGS[@]}"

      - name: Record upload flags
        id: flags
        env:
          WEEKLY: ${{ inputs.performance_run_id == '' && (github.event_name == 'schedule' || inputs.weekly == true) }}
          SCHEDULED_EXCEPTION: ${{ inputs.performance_event == 'schedule' }}
        run: |
          set -euo pipefail
          UPLOAD_PROFILES=true
          if [ "${WEEKLY}" = "true" ] || [ "${SCHEDULED_EXCEPTION}" = "true" ]; then
            UPLOAD_PROFILES=false
          fi
          # Digests are read within days. A collected report is the history the
          # Monday job compares against, so it has to outlive two whole weeks.
          RETENTION_DAYS=7
          if [ "${SCHEDULED_EXCEPTION}" = "true" ]; then
            RETENTION_DAYS=21
          fi
          echo "upload-profiles=${UPLOAD_PROFILES}" >> "$GITHUB_OUTPUT"
          echo "retention-days=${RETENTION_DAYS}" >> "$GITHUB_OUTPUT"

      - name: Prepare scenario artifact matrix
        id: scenario-matrix
        run: |
          set -euo pipefail
          echo "matrix=$(jq -c . /tmp/analyze-app-profiling/scenario-artifacts.json)" >> "$GITHUB_OUTPUT"

      # The linked report is published by `publish-summary`, once artifact ids
      # exist. This only covers the case where that job never runs.
      - name: Write job summary
        if: failure()
        run: |
          if [ -f /tmp/analyze-app-profiling/github-summary.md ]; then
            cat /tmp/analyze-app-profiling/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No analysis summary was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-profiling-analysis
          path: |
            /tmp/analyze-app-profiling/*.md
            /tmp/analyze-app-profiling/report.json
            /tmp/analyze-app-profiling/notification.json
            /tmp/analyze-app-profiling/ai-proposal-evidence.json
            /tmp/analyze-app-profiling/github-issues.json
            /tmp/analyze-app-profiling/slack-cards.json
            /tmp/analyze-app-profiling/scenario-artifacts.json
            /tmp/analyze-app-profiling/scenarios/
          if-no-files-found: ignore
          retention-days: ${{ steps.flags.outputs.retention-days || 7 }}

      - name: Cache scenario profile bundles
        if: success() && steps.flags.outputs.upload-profiles == 'true'
        uses: actions/cache/save@v6
        with:
          path: /tmp/analyze-app-profiling/scenario-artifacts/
          key: app-profiling-scenarios-${{ github.run_id }}

      # Without this, a broken analyzer or a missing artifact is indistinguishable
      # from a run that was never requested.
      - name: Record analysis failure
        if: >-
          failure() &&
          inputs.performance_event != 'schedule'
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ANALYZED_RUN_ID: ${{ inputs.performance_run_id || inputs.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Hermes CPU-profile analysis failed"
            echo
            echo "The performance suite finished, but this analysis job failed, so no digest was produced."
            echo
            echo "Performance run analyzed: \`${ANALYZED_RUN_ID:-latest successful scheduled run}\`"
            echo
            echo "Check the failed job above for the failing step: ${GITHUB_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

  upload-scenario-profiles:
    name: Upload ${{ matrix.scenario }}
    permissions: {}
    needs: analyze
    if: >-
      needs.analyze.result == 'success' &&
      needs.analyze.outputs.upload-profiles == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.analyze.outputs.scenario-matrix) }}
    steps:
      - name: Restore scenario profile bundles
        uses: actions/cache/restore@v6
        with:
          path: /tmp/analyze-app-profiling/scenario-artifacts/
          key: app-profiling-scenarios-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Upload scenario profile artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifactName }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  publish-summary:
    name: Post profiling summary
    permissions:
      contents: read
      actions: read # list this run's artifacts for the scenario links
    needs:
      - analyze
      - upload-scenario-profiles
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Download analysis summary
        uses: actions/download-artifact@v8
        with:
          name: app-profiling-analysis
          path: /tmp/analyze-app-profiling

      # Scenario names in the run report become the download for that
      # scenario's profiles. Artifact ids do not exist before this job.
      - name: Write job summary with per-scenario downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          node .github/scripts/qa-automation/performance-tests/link-scenario-artifacts.mjs \
            /tmp/analyze-app-profiling/github-summary.md \
            /tmp/analyze-app-profiling/github-summary-linked.md \
            --style markdown --optional
          cat /tmp/analyze-app-profiling/github-summary-linked.md >> "$GITHUB_STEP_SUMMARY"

      # Only a scheduled finding writes issue-dm.md. All-clear, manual, and
      # Monday runs leave the file absent, so this posts nothing.
      - name: DM issue verdict
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_TARGET: UEYQL2PEV
          SLACK_PLAIN: '1'
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_RUN_LABEL: Analysis run
        run: |
          set -euo pipefail
          if [ ! -s /tmp/analyze-app-profiling/issue-dm.md ]; then
            echo "No issue verdict to send"
            exit 0
          fi
          node .github/scripts/qa-automation/performance-tests/post-app-profiling-slack.mjs \
            /tmp/analyze-app-profiling/issue-dm.md

  report-scenario-upload-failure:
    name: Report scenario artifact upload failure
    permissions: {}
    needs:
      - analyze
      - upload-scenario-profiles
    if: >-
      always() &&
      needs.analyze.result == 'success' &&
      needs.upload-scenario-profiles.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record scenario artifact upload failure
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Hermes scenario artifacts failed to publish"
            echo
            echo "The profiles were analyzed, but one or more per-scenario downloads failed to upload."
            echo
            echo "Check the failed upload job: ${GITHUB_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
