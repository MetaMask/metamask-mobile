name: Nightly Build

# Runs on a schedule (4 AM UTC) like the old nightly-branch-sync.
#
# iOS uses build-and-upload-to-testflight.yml; Android calls build.yml directly.
#
# rc depends on exp within each platform stream to ensure the external version
# service produces sequential numbers (N for exp, N+1 for rc).

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      runner_provider:
        description: 'Runner provider: inherit uses the repo NAMESPACE_RUNNER_* variables'
        required: false
        type: choice
        options:
          - inherit
          - namespace
          - current
        default: inherit

permissions:
  contents: read

jobs:
  ios-exp:
    name: Nightly iOS exp
    permissions:
      contents: read
      id-token: write # AWS OIDC for signing and the TestFlight upload in build-and-upload-to-testflight.yml
    uses: ./.github/workflows/build-and-upload-to-testflight.yml
    with:
      source_branch: main
      environment: exp
      testflight_group: 'MetaMask BETA & Release Candidates'
      distribute_external: true
      build_attribution: nightly
      runner_provider: ${{ inputs.runner_provider }}
    secrets: inherit

  ios-rc:
    name: Nightly iOS rc
    needs: [ios-exp]
    permissions:
      contents: read
      id-token: write # AWS OIDC for signing and the TestFlight upload in build-and-upload-to-testflight.yml
    uses: ./.github/workflows/build-and-upload-to-testflight.yml
    with:
      source_branch: main
      environment: rc
      testflight_group: 'MetaMask BETA & Release Candidates'
      distribute_external: true
      build_attribution: nightly
      runner_provider: ${{ inputs.runner_provider }}
    secrets: inherit

  android-exp-generate:
    permissions:
      id-token: write # AWS OIDC for the build number service in generate-build-version.yml
    uses: ./.github/workflows/generate-build-version.yml

  android-exp:
    name: Nightly Android exp
    needs: [android-exp-generate]
    permissions:
      contents: read
      id-token: write # AWS OIDC for code signing in build.yml
    uses: ./.github/workflows/build.yml
    with:
      build_name: main-exp
      platform: android
      source_branch: main
      build_number: ${{ needs.android-exp-generate.outputs.build-version }}
      build_attribution: nightly
      runner_provider: ${{ inputs.runner_provider }}
    secrets: inherit

  android-rc-generate:
    needs: [android-exp]
    permissions:
      id-token: write # AWS OIDC for the build number service in generate-build-version.yml
    uses: ./.github/workflows/generate-build-version.yml

  android-rc:
    name: Nightly Android rc
    needs: [android-rc-generate]
    permissions:
      contents: read
      id-token: write # AWS OIDC for code signing in build.yml
    uses: ./.github/workflows/build.yml
    with:
      build_name: main-rc
      platform: android
      source_branch: main
      build_number: ${{ needs.android-rc-generate.outputs.build-version }}
      build_attribution: nightly
      runner_provider: ${{ inputs.runner_provider }}
    secrets: inherit

  size-analysis-ios:
    name: Sentry Size Analysis (iOS)
    needs: [ios-rc]
    if: success()
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Resolve base SHA
        id: base
        run: echo "sha=$(git rev-parse ${{ github.sha }}~1)" >> "$GITHUB_OUTPUT"
      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Download iOS xcarchive
        uses: actions/download-artifact@v7
        with:
          name: ios-xcarchive-main-rc
          path: ./build-artifacts/
      - name: Unzip xcarchive
        run: |
          cd ./build-artifacts
          unzip -q ./*.xcarchive.zip
          rm -f ./*.xcarchive.zip
      - name: Upload to Sentry Size Analysis
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.MM_SENTRY_AUTH_TOKEN }}
        run: |
          sentry-cli build upload ./build-artifacts/*.xcarchive \
            --org metamask \
            --project metamask-mobile \
            --build-configuration Release-iOS \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --head-ref main \
            --vcs-provider github \
            --head-repo-name MetaMask/metamask-mobile

  collect-metadata:
    name: Collect nightly build metadata
    needs: [ios-exp, ios-rc, android-exp, android-rc]
    # Always run, even if a build failed, so the Slack notification workflow
    # can still report which builds succeeded/failed instead of finding no
    # artifact at all. nightly-build-slack-notification.yml reads this.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write nightly-build-metadata.json
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGERED_SHA: ${{ github.sha }}
          IOS_EXP_RESULT: ${{ needs.ios-exp.result }}
          IOS_EXP_VERSION: ${{ needs.ios-exp.outputs.semantic_version }}
          IOS_EXP_BUILD_NUMBER: ${{ needs.ios-exp.outputs.ios_version_code }}
          IOS_EXP_COMMIT_SHA: ${{ needs.ios-exp.outputs.built_commit_sha }}
          IOS_RC_RESULT: ${{ needs.ios-rc.result }}
          IOS_RC_VERSION: ${{ needs.ios-rc.outputs.semantic_version }}
          IOS_RC_BUILD_NUMBER: ${{ needs.ios-rc.outputs.ios_version_code }}
          IOS_RC_COMMIT_SHA: ${{ needs.ios-rc.outputs.built_commit_sha }}
          ANDROID_EXP_RESULT: ${{ needs.android-exp.result }}
          ANDROID_EXP_VERSION: ${{ needs.android-exp.outputs.semantic_version }}
          ANDROID_EXP_BUILD_NUMBER: ${{ needs.android-exp.outputs.android_version_code }}
          ANDROID_EXP_COMMIT_SHA: ${{ needs.android-exp.outputs.built_commit_sha }}
          ANDROID_RC_RESULT: ${{ needs.android-rc.result }}
          ANDROID_RC_VERSION: ${{ needs.android-rc.outputs.semantic_version }}
          ANDROID_RC_BUILD_NUMBER: ${{ needs.android-rc.outputs.android_version_code }}
          ANDROID_RC_COMMIT_SHA: ${{ needs.android-rc.outputs.built_commit_sha }}
        run: |
          node -e '
            const fs = require("fs");
            const metadata = {
              run_id: process.env.RUN_ID,
              run_url: process.env.RUN_URL,
              triggered_sha: process.env.TRIGGERED_SHA,
              generated_at: new Date().toISOString(),
              builds: {
                "ios-exp": {
                  result: process.env.IOS_EXP_RESULT || null,
                  version: process.env.IOS_EXP_VERSION || null,
                  build_number: process.env.IOS_EXP_BUILD_NUMBER || null,
                  commit_sha: process.env.IOS_EXP_COMMIT_SHA || null,
                },
                "ios-rc": {
                  result: process.env.IOS_RC_RESULT || null,
                  version: process.env.IOS_RC_VERSION || null,
                  build_number: process.env.IOS_RC_BUILD_NUMBER || null,
                  commit_sha: process.env.IOS_RC_COMMIT_SHA || null,
                },
                "android-exp": {
                  result: process.env.ANDROID_EXP_RESULT || null,
                  version: process.env.ANDROID_EXP_VERSION || null,
                  build_number: process.env.ANDROID_EXP_BUILD_NUMBER || null,
                  commit_sha: process.env.ANDROID_EXP_COMMIT_SHA || null,
                },
                "android-rc": {
                  result: process.env.ANDROID_RC_RESULT || null,
                  version: process.env.ANDROID_RC_VERSION || null,
                  build_number: process.env.ANDROID_RC_BUILD_NUMBER || null,
                  commit_sha: process.env.ANDROID_RC_COMMIT_SHA || null,
                },
              },
            };
            fs.writeFileSync("nightly-build-metadata.json", JSON.stringify(metadata, null, 2));
          '
          cat nightly-build-metadata.json

      - name: Upload nightly build metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-build-metadata
          path: nightly-build-metadata.json
          compression-level: 0
          retention-days: 7

  size-analysis-android:
    name: Sentry Size Analysis (Android)
    needs: [android-rc]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Resolve base SHA
        id: base
        run: echo "sha=$(git rev-parse ${{ github.sha }}~1)" >> "$GITHUB_OUTPUT"
      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash
      - name: Download Android APK
        uses: actions/download-artifact@v7
        with:
          name: android-apk-main-rc
          path: ./build-artifacts/
      - name: Upload to Sentry Size Analysis
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.MM_SENTRY_AUTH_TOKEN }}
        run: |
          sentry-cli build upload ./build-artifacts/*.apk \
            --org metamask \
            --project metamask-mobile \
            --build-configuration Release-Android \
            --head-sha "${{ github.sha }}" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --head-ref main \
            --vcs-provider github \
            --head-repo-name MetaMask/metamask-mobile
