name: 'Check PR Max Lines'

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write # Required for the called workflow to manage labels

jobs:
  check-pr-max-lines:
    # Always recompute on every trigger, including title/body edits. A job-level
    # `if` here would post a `skipped` check run for the same head SHA, which
    # GitHub treats as the latest (authoritative) status and can silently clear
    # a prior oversized-PR failure. Recomputing is cheap and always accurate.
    runs-on: ubuntu-latest
    steps:
      - name: Check PR lines changed
        uses: MetaMask/github-tools/.github/actions/pr-line-check@v1
        with:
          max-lines: '1000'
          ignore-patterns: '(\.lock|\.snap|\.md|\.svg|\.yaml|tests/integration/|\.agents/skills/integration-test/)'
