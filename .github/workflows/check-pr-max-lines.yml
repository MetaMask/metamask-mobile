name: 'Check PR Max Lines'

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write # Required for the called workflow to manage labels

jobs:
  check-pr-max-lines:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR lines changed
        uses: MetaMask/github-tools/.github/actions/pr-line-check@v1
        with:
          max-lines: '1000'
          # Tests and fixtures are required coverage, not product-scope size.
          ignore-patterns: '(\.lock|\.snap|\.md|\.svg|\.yaml|\.test\.(ts|tsx)$|^tests/)'
