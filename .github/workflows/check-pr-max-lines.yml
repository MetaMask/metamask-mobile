name: 'Check PR Max Lines'

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write # Required for the called workflow to manage labels

jobs:
  check-pr-max-lines:
    # Re-run on base retargets (e.g. unstacking a PR onto main), but skip
    # re-runs for unrelated edits (title/body) which don't affect the diff.
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - name: Check PR lines changed
        uses: MetaMask/github-tools/.github/actions/pr-line-check@v1
        with:
          max-lines: '1000'
          ignore-patterns: '(\.lock|\.snap|\.md|\.svg|\.yaml|tests/integration/|\.agents/skills/integration-test/)'
