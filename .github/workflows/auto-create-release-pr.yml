name: Auto Create Release PR

# When Runway creates release/X.Y.Z (native) or release/X.Y.Z-ota (OTA hotfix),
# this workflow calls create-release-pr.yml.
# Semver / branch convention for mobile hotfixes:
# - release/X.Y.0         — regular release (no OTA_VERSION bump).
# - release/X.Y.Z (Z > 0) — native hotfix (no OTA_VERSION bump).
# - release/X.Y.Z-ota     — OTA hotfix; OTA_VERSION is set to v<X.Y.Z>.
#   Runway always increments Z past any existing native patch on the same X.Y
#   line, so the production OTA tag v<X.Y.Z> never collides with a native tag.
#   The `-ota` suffix is a branch-name convention ONLY: CHANGELOG.md header,
#   OTA_VERSION, and the production git tag all use the bare X.Y.Z.

on:
  create:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  extract:
    if: ${{ github.ref_type == 'branch' && startsWith(github.ref, 'refs/heads/release/') }}
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.out.outputs.semver }}
      is_ota: ${{ steps.out.outputs.is_ota }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: out
        shell: bash
        run: |
          .github/scripts/extract-semver.sh

  call-create-release-pr:
    needs: extract
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/create-release-pr.yml
    secrets:
      google-application-creds-base64: ${{ secrets.GCP_RLS_SHEET_ACCOUNT_BASE64 }}
    with:
      semver-version: ${{ needs.extract.outputs.semver }}
      is-ota: ${{ needs.extract.outputs.is_ota == 'true' }}

  # OTA hotfixes are excluded: create-release-pr.yml bumps OTA_VERSION on release/X.Y.Z-ota,
  # so runway-ota-resolve-context.yml reports ota_bump=true and build-rc-auto.yml skips both
  # native builds. OTA release candidates go through runway-ota-rc.yml instead.
  trigger-first-rc-build:
    name: Trigger first RC build
    needs: [extract, call-create-release-pr]
    if: needs.extract.outputs.is_ota != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      # Failing to dispatch must not make a successfully created release PR look broken, so
      # this reports the problem and still succeeds. Recovery is a manual dispatch of
      # build-rc-auto.yml on the release branch, or any subsequent push to it.
      - name: Dispatch build-rc-auto.yml on the release branch (best effort)
        id: dispatch
        env:
          # workflow_dispatch is the documented exception to GITHUB_TOKEN events not starting
          # workflow runs, so no token exchange is needed here.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail

          echo "Dispatching build-rc-auto.yml on '${BRANCH}'"
          if ! DISPATCH_LOG="$(gh workflow run build-rc-auto.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" 2>&1)"; then
            echo "$DISPATCH_LOG"
            echo "::error::Could not dispatch the first RC build on ${BRANCH}. Dispatch it manually from the Actions tab, or push to the branch."
            echo "dispatched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$DISPATCH_LOG"
          echo "dispatched=true" >> "$GITHUB_OUTPUT"

      - name: Summarize dispatch
        if: always()
        env:
          BRANCH: ${{ github.ref_name }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
        run: |
          set -euo pipefail

          # gh reports the event, not the run it creates, so link the branch-filtered run list.
          RUNS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/build-rc-auto.yml?query=branch%3A${BRANCH//\//%2F}"
          {
            echo "### First RC build"
            echo ""
            if [[ "$DISPATCHED" == "true" ]]; then
              echo "Dispatched \`build-rc-auto.yml\` on \`${BRANCH}\` — [view runs](${RUNS_URL})."
            else
              echo "Dispatch failed. The release PR is unaffected; start the first RC build by dispatching [\`build-rc-auto.yml\`](${RUNS_URL}) on \`${BRANCH}\`, or by pushing to the branch."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
