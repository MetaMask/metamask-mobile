# Keeps the shape of the E2E API mocks aligned with the live APIs.
#
# Runs `yarn test:e2e:sync-api-mocks`, which reads the "Sync config" table in
# tests/api-mocking/api-mock-catalog.md. `write` mocks are rewritten (fields
# added or removed, existing values kept); `report-only` drift is only listed.
#
# When a mock changed, this opens or updates a pull request from
# `sync/e2e-api-mocks`. The pull request runs `yarn lint:tsc`, which fails when
# a synced mock no longer satisfies the type the wallet reads.
#
# The branch is rebuilt from main on every run, so the pull request always holds
# one commit with the current drift.
name: Sync E2E API Mocks

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report drift in the job summary without opening a pull request
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-e2e-api-mocks
  cancel-in-progress: false

permissions: {}

jobs:
  sync-api-mocks:
    name: Sync E2E API mocks with the live APIs
    # The pull request targets main, so only run from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      SYNC_BRANCH: sync/e2e-api-mocks
      BASE_BRANCH: main
      GH_PROMPT_DISABLED: '1'
    steps:
      # The token comes from the MetaMask token exchange, so pushes to the sync
      # branch trigger CI. Commits pushed with GITHUB_TOKEN do not.
      - name: Get token
        id: get-token
        if: inputs.dry_run != true
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: yarn install --immutable

      # Exit codes: 0 no drift, 1 a mock was rewritten, 2 drift only in
      # report-only mocks, 3 a row failed. All of them continue, so a mock
      # that changed still gets its pull request. Exit 3 fails the job at the end.
      - name: Sync the mocks
        id: sync
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=(--report "$RUNNER_TEMP/sync-report.md")
          if [[ "$DRY_RUN" == "true" ]]; then
            ARGS+=(--dry-run)
          fi
          set +e
          yarn test:e2e:sync-api-mocks "${ARGS[@]}"
          EXIT="$?"
          set -e
          echo "EXIT_CODE=${EXIT}" >> "$GITHUB_OUTPUT"
          {
            echo "## E2E API mock sync"
            echo
            cat "$RUNNER_TEMP/sync-report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check for mock changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- tests/api-mocking)" ]]; then
            echo "HAS_CHANGES=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_CHANGES=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the sync branch
        if: steps.changes.outputs.HAS_CHANGES == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Token exchange did not return a token."
            exit 1
          fi
          git config user.name 'MetaMask Bot'
          git config user.email 'metamaskbot@users.noreply.github.com'
          git checkout -B "$SYNC_BRANCH"
          git add -A -- tests/api-mocking
          git commit -m 'test: sync E2E API mock shapes with the live APIs'
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$SYNC_BRANCH"

      - name: Open or update the sync pull request
        if: steps.changes.outputs.HAS_CHANGES == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/sync-pr-body.md"
          {
            cat <<'EOF'
          ## **Description**

          Weekly sync of the E2E API mocks with the live APIs, from `yarn test:e2e:sync-api-mocks`. It rewrites only the shape of the `write` mocks listed in `tests/api-mocking/api-mock-catalog.md`: it adds fields the API now returns, removes fields it no longer returns, and keeps every existing value that tests assert on.

          `yarn lint:tsc` runs on this pull request. If it fails, a synced mock no longer satisfies the type the wallet reads in `tests/api-mocking/api-response-types.ts`. Update that type, or the consumer, before merging.

          Drift in `report-only` mocks is listed below and is not written. Review it by hand.

          EOF
            echo "**Sync report**"
            echo
            cat "$RUNNER_TEMP/sync-report.md"
            cat <<'EOF'

          ## Test layer placement

          N/A. This pull request changes E2E mock data only.

          ## **Changelog**

          CHANGELOG entry: null

          ## **Related issues**

          Refs: [MMQA-2037](https://consensyssoftware.atlassian.net/browse/MMQA-2037)

          ## **Manual testing steps**

          N/A. Generated by a workflow; `yarn lint:tsc` and the unit tests validate it.

          ## **Screenshots/Recordings**

          N/A. Test-only change with no UI impact.

          ### **Before**

          N/A

          ### **After**

          N/A

          ## **Pre-merge author checklist**

          - [x] I've followed [MetaMask Contributor Docs](https://github.com/MetaMask/contributor-docs) and [MetaMask Mobile Coding Standards](https://github.com/MetaMask/metamask-mobile/blob/main/.github/guidelines/CODING_GUIDELINES.md).
          - [x] I've completed the PR template to the best of my ability
          - [x] I've included tests if applicable
          - [x] I've documented my code using [JSDoc](https://jsdoc.app/) format if applicable
          - [x] I've applied the right labels on the PR (see [labeling guidelines](https://github.com/MetaMask/metamask-mobile/blob/main/.github/guidelines/LABELING_GUIDELINES.md)). Not required for external contributors.

          ## **Pre-merge reviewer checklist**

          - [ ] I've manually tested the PR (e.g. pull and build branch, run the app, test code being changed).
          - [ ] I confirm that this PR addresses all acceptance criteria described in the ticket it closes and includes the necessary testing evidence such as recordings and or screenshots.

          EOF
            echo "Generated by [this workflow run](${RUN_URL})."
          } > "$BODY_FILE"

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            echo "Updated pull request #${PR_NUMBER}." >> "$GITHUB_STEP_SUMMARY"
          else
            PR_URL=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$BASE_BRANCH" \
              --head "$SYNC_BRANCH" \
              --draft \
              --title 'test: sync E2E API mock shapes with the live APIs' \
              --body-file "$BODY_FILE" \
              --label team-qa \
              --label no-changelog)
            echo "Opened pull request ${PR_URL}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail when a row could not be synced
        if: steps.sync.outputs.EXIT_CODE == '3'
        run: |
          echo "::error::At least one catalog row failed to sync. See the job summary."
          exit 1
