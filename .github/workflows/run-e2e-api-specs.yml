# OpenRPC API specs on iOS Appium (dedicated workflow — not Appium smoke tags).

name: API Specs E2E Tests

on:
  workflow_call:
    inputs:
      runner_provider:
        description: Runner provider forwarded from the caller
        required: false
        type: string
        default: current
      ios_build_run_id:
        description: Optional GitHub Actions run id that has main-e2e-MetaMask.app
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      runner_provider:
        description: Runner provider for this manual trial run
        required: false
        type: choice
        options:
          - current
          - namespace
        default: current
      ios_build_run_id:
        description: Optional GitHub Actions run id that has main-e2e-MetaMask.app (else latest successful build on main)
        required: false
        type: string
        default: ''
  pull_request:
    types: [opened, synchronize]

jobs:
  api-specs-ios:
    name: 'api-specs-ios'
    if: false
    continue-on-error: true
    permissions:
      actions: read
      contents: read
    runs-on: >-
      ${{
        (inputs.runner_provider || 'current') == 'namespace' &&
        'namespace-profile-metamask-ios-e2e' ||
        fromJSON('["ghcr.io/cirruslabs/macos-runner:tahoe"]')
      }}

    env:
      METAMASK_ENVIRONMENT: 'e2e'
      METAMASK_BUILD_TYPE: 'main'
      MM_TEST_WALLET_SRP: ${{ secrets.MM_TEST_WALLET_SRP }}
      SEGMENT_WRITE_KEY_QA: ${{ secrets.SEGMENT_WRITE_KEY_QA }}
      SEGMENT_PROXY_URL_QA: ${{ secrets.SEGMENT_PROXY_URL_QA }}
      SEGMENT_DELETE_API_SOURCE_ID_QA: ${{ secrets.SEGMENT_DELETE_API_SOURCE_ID_QA }}
      SEGMENT_REGULATIONS_ENDPOINT_QA: ${{ secrets.SEGMENT_REGULATIONS_ENDPOINT_QA }}
      MM_SENTRY_DSN_TEST: ${{ secrets.MM_SENTRY_DSN_TEST }}
      MM_SOLANA_E2E_TEST_SRP: ${{ secrets.MM_SOLANA_E2E_TEST_SRP }}
      IOS_APP_ARTIFACT_PATH: artifacts/main-e2e-MetaMask.app

    steps:
      - name: Checkout (Namespace)
        if: ${{ (inputs.runner_provider || 'current') == 'namespace' }}
        uses: namespacelabs/nscloud-checkout-action@938f5d2d403d6224d9a0c0dc559b1dae09c2ede4 # v8.1.1

      - name: Checkout
        if: ${{ (inputs.runner_provider || 'current') != 'namespace' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          clean: true

      - name: Setup E2E environment (iOS)
        uses: ./.github/actions/setup-e2e-env
        with:
          platform: ios
          setup-simulator: 'false'
          configure-keystores: 'false'
          install-foundry: 'true'
          skip-pod-install: 'true'
          install-applesimutils: 'false'
          runner_provider: ${{ inputs.runner_provider || 'current' }}

      - name: Cache ffmpeg (Homebrew)
        uses: actions/cache@v4
        with:
          path: ~/.cache/mms-ffmpeg
          key: brew-ffmpeg-${{ runner.os }}-v1
          restore-keys: |
            brew-ffmpeg-${{ runner.os }}-

      - name: Install ffmpeg for XCUITest screen recording
        run: bash scripts/e2e/ensure-ffmpeg-ci.sh
        shell: bash

      - name: Download main-e2e iOS app (self-contained)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: main-e2e-MetaMask.app
          APP_PATH: ${{ env.IOS_APP_ARTIFACT_PATH }}
          INPUT_RUN_ID: ${{ inputs.ios_build_run_id || '' }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          mkdir -p "$(dirname "$APP_PATH")"
          rm -rf "$APP_PATH"

          resolve_run_id() {
            if [ -n "${INPUT_RUN_ID}" ]; then
              echo "${INPUT_RUN_ID}"
              return
            fi

            # Prefer a successful build on the PR head branch when present, else main.
            BRANCH="${HEAD_REF:-${REF_NAME}}"
            if [ -z "${BRANCH}" ] || [ "${BRANCH}" = "${DEFAULT_BRANCH}" ]; then
              BRANCH="main"
            fi

            echo "Resolving latest successful build workflow run on branch '${BRANCH}'..." >&2
            RUN_ID="$(
              gh run list \
                --repo "${REPOSITORY}" \
                --workflow build.yml \
                --branch "${BRANCH}" \
                --status success \
                --limit 20 \
                --json databaseId \
                --jq '.[].databaseId' \
              | while read -r id; do
                  if gh api \
                    "repos/${REPOSITORY}/actions/runs/${id}/artifacts" \
                    --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .name" \
                    | grep -qx "${ARTIFACT_NAME}"; then
                    echo "${id}"
                    break
                  fi
                done
            )"

            if [ -z "${RUN_ID}" ] && [ "${BRANCH}" != "main" ]; then
              echo "No ${ARTIFACT_NAME} on '${BRANCH}'; falling back to main..." >&2
              RUN_ID="$(
                gh run list \
                  --repo "${REPOSITORY}" \
                  --workflow build.yml \
                  --branch main \
                  --status success \
                  --limit 20 \
                  --json databaseId \
                  --jq '.[].databaseId' \
                | while read -r id; do
                    if gh api \
                      "repos/${REPOSITORY}/actions/runs/${id}/artifacts" \
                      --jq ".artifacts[] | select(.name == \"${ARTIFACT_NAME}\") | .name" \
                      | grep -qx "${ARTIFACT_NAME}"; then
                      echo "${id}"
                      break
                    fi
                  done
              )"
            fi

            if [ -z "${RUN_ID}" ]; then
              echo "::error title=main-e2e iOS artifact not found::Could not find a successful build.yml run with artifact ${ARTIFACT_NAME}."
              exit 1
            fi

            echo "${RUN_ID}"
          }

          RUN_ID="$(resolve_run_id)"
          echo "📥 Downloading ${ARTIFACT_NAME} from run ${RUN_ID}..."
          echo "Run URL: https://github.com/${REPOSITORY}/actions/runs/${RUN_ID}"

          if ! gh run download "${RUN_ID}" \
            --repo "${REPOSITORY}" \
            -n "${ARTIFACT_NAME}" \
            -D "${APP_PATH}"; then
            echo "::error title=iOS artifact download failed::Failed to download ${ARTIFACT_NAME} from run ${RUN_ID}."
            exit 1
          fi

          if [ ! -f "${APP_PATH}/Info.plist" ]; then
            # gh sometimes extracts as nested MetaMask.app under the destination
            NESTED="$(find "${APP_PATH}" -maxdepth 2 -type d -name 'MetaMask.app' | head -1 || true)"
            if [ -n "${NESTED}" ] && [ -f "${NESTED}/Info.plist" ]; then
              echo "Normalizing nested bundle ${NESTED} -> ${APP_PATH}"
              TMP_DIR="$(mktemp -d)"
              mv "${NESTED}" "${TMP_DIR}/MetaMask.app"
              rm -rf "${APP_PATH}"
              mv "${TMP_DIR}/MetaMask.app" "${APP_PATH}"
              rmdir "${TMP_DIR}" 2>/dev/null || true
            fi
          fi

          if [ ! -f "${APP_PATH}/Info.plist" ]; then
            echo "::error title=Invalid iOS app bundle::Info.plist missing under ${APP_PATH}"
            find "${APP_PATH}" -maxdepth 2 2>/dev/null || true
            exit 1
          fi

          echo "✅ main-e2e MetaMask.app ready at ${APP_PATH}"
        shell: bash

      - name: Restore iOS bundle executable permissions
        env:
          APP_PATH: ${{ env.IOS_APP_ARTIFACT_PATH }}
        run: |
          BUNDLE_EXEC=$(/usr/libexec/PlistBuddy -c "Print CFBundleExecutable" "$APP_PATH/Info.plist" 2>/dev/null)
          if [ -z "$BUNDLE_EXEC" ]; then
            echo "Could not read CFBundleExecutable from Info.plist"
            exit 1
          fi

          ACTUAL_PATH=$(find "$APP_PATH" -maxdepth 1 -iname "$BUNDLE_EXEC" -type f | head -1)
          if [ -z "$ACTUAL_PATH" ]; then
            echo "Bundle executable not found: $BUNDLE_EXEC"
            exit 1
          fi

          if [ "$(basename "$ACTUAL_PATH")" != "$BUNDLE_EXEC" ]; then
            mv "$ACTUAL_PATH" "$APP_PATH/${BUNDLE_EXEC}_fix"
            mv "$APP_PATH/${BUNDLE_EXEC}_fix" "$APP_PATH/$BUNDLE_EXEC"
          fi

          chmod +x "$APP_PATH/$BUNDLE_EXEC"

          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -type d -name "*.framework" | while IFS= read -r fw; do
              binary="$fw/$(basename "$fw" .framework)"
              if [ -f "$binary" ]; then
                chmod +x "$binary"
              fi
            done
            find "$APP_PATH/Frameworks" -type f -name "*.dylib" -exec chmod +x {} \;
          fi
          echo "Restored execute permissions on main binary and all framework binaries"
        shell: bash

      - name: Resolve XCUITest driver version for WDA cache key
        id: xcuitest-version
        run: echo "version=$(node scripts/e2e/resolve-xcuitest-driver-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Get Xcode version for WDA cache key
        id: xcode-version
        run: echo "version=$(xcodebuild -version 2>/dev/null | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore WDA DerivedData cache
        uses: actions/cache@v4
        with:
          path: ~/appium-wda
          key: wda-derived-data-xcuitest-${{ steps.xcuitest-version.outputs.version }}-${{ steps.xcode-version.outputs.version }}-${{ runner.os }}
          restore-keys: |
            wda-derived-data-xcuitest-${{ steps.xcuitest-version.outputs.version }}-${{ steps.xcode-version.outputs.version }}-

      - name: Check if WDA is prebuilt
        id: wda-prebuilt
        run: |
          WDA_APP=$(find ~/appium-wda/Build/Products -name 'WebDriverAgentRunner-Runner.app' -type d 2>/dev/null | head -1 || true)
          XCTESTRUN=$(find ~/appium-wda/Build/Products -name '*.xctestrun' 2>/dev/null | head -1 || true)
          if [ -n "$WDA_APP" ] && [ -n "$XCTESTRUN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "WDA prebuilt artifacts found"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "WDA cache miss — prepare-ios-appium-runner will prebuild after sim boot"
          fi
        shell: bash

      - name: Prepare iOS Appium runner
        id: prepare-ios-appium
        timeout-minutes: 30
        run: node scripts/e2e/prepare-ios-appium-runner.mjs
        env:
          IOS_SIMULATOR_NAME: iPhone 16 Pro
          IOS_APP_PATH: ${{ env.IOS_APP_ARTIFACT_PATH }}
          IOS_BUNDLE_ID: io.metamask.MetaMask
          SKIP_WDA_PREBUILD: ${{ steps.wda-prebuilt.outputs.ready == 'true' && 'true' || 'false' }}
          IOS_SIMULATOR_POST_BOOT_SETTLE_MS: '30000'
          IOS_APP_WARM_LAUNCH_SETTLE_MS: '15000'

      - name: Verify Appium runner connectivity (iOS)
        run: yarn tsx scripts/e2e/verify-appium-runner-connectivity.mjs ios
        env:
          IOS_SIMULATOR_UDID: ${{ steps.prepare-ios-appium.outputs.ios-simulator-udid }}

      - name: Run API Specs (iOS Appium)
        timeout-minutes: 60
        run: yarn test:api-specs
        env:
          APPIUM_SMOKE_SUITE_NAME: api-specs-ios
          APPIUM_SMOKE_JOB_TITLE: API Specs (ios Appium)
          APPIUM_SMOKE_ARTIFACT_NAME: api-specs-report
          PLAYWRIGHT_JSON_OUTPUT_FILE: tests/test-reports/playwright-json/playwright-report.json
          SKIP_APPIUM_STOP: 'true'
          IOS_APP_PATH: ${{ env.IOS_APP_ARTIFACT_PATH }}
          IOS_SIMULATOR_NAME: iPhone 16 Pro
          IOS_SIMULATOR_UDID: ${{ steps.prepare-ios-appium.outputs.ios-simulator-udid }}
          IOS_WDA_PREINSTALLED: ${{ steps.prepare-ios-appium.outputs.ios-wda-preinstalled }}
          IOS_WDA_BUNDLE_ID: ${{ steps.prepare-ios-appium.outputs.ios-wda-bundle-id }}
          SKIP_DEVICE_BOOT: 'true'
          SKIP_APP_REINSTALL: 'true'
          USE_PREBUILT_WDA: 'true'
          IOS_SIMULATOR_POST_BOOT_SETTLE_MS: '30000'
          IOS_PRE_LAUNCH_SETTLE_MS: '1500'
          MM_INFURA_PROJECT_ID: ${{ secrets.MM_INFURA_PROJECT_ID }}

      - name: Upload Playwright HTML report (Namespace)
        if: ${{ always() && (inputs.runner_provider || 'current') == 'namespace' }}
        uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
        with:
          name: api-specs-report
          path: tests/test-reports/appium-smoke-report/api-specs-ios/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright HTML report (current)
        if: ${{ always() && (inputs.runner_provider || 'current') != 'namespace' }}
        uses: actions/upload-artifact@v4
        with:
          name: api-specs-report
          path: tests/test-reports/appium-smoke-report/api-specs-ios/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-specs-playwright-json
          path: tests/test-reports/playwright-json/
          if-no-files-found: ignore
          retention-days: 7
