##############################################################################################
#
# Runway OTA Production
#
# Triggered from Runway to push an OTA update to the production channel (iOS + Android).
#
# This workflow does not build binaries and does not bump the build version — the release PR is
# expected to bump OTA_VERSION (app/constants/ota.ts) before dispatch.
#
# Production publish is fail-closed on the ci.yml job "Check all jobs pass" for
# the exact PR head SHA. The gate reads that workflow's runs, not every check
# with the same name. This job is named "Require ci.yml success" so its own
# in-progress check cannot satisfy or block that lookup. A missing, pending,
# or unsuccessful ci.yml result blocks the push. Runway's workflow_dispatch
# inputs are unchanged. push-eas-update.yml checks the same SHA again after
# release-team approval. The production environment's required reviewers sit
# after that check, so eas-update-platform.yml re-reads ci.yml as the first
# step of the push job, after those reviewers approve and before the EAS push.
#
##############################################################################################
name: Runway OTA Production

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: >-
          Optional branch, tag, or SHA for OTA publish.
          Empty uses the branch selected in the "Use workflow from" UI.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read # list ci.yml workflow runs for the shipped SHA

cache-mode: none

jobs:
  resolve-context:
    name: Resolve OTA context
    uses: ./.github/workflows/runway-ota-resolve-context.yml
    with:
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit

  validate-ota-pr:
    name: Validate PR for OTA
    needs: resolve-context
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR number
        run: |
          if [[ -z "${{ needs.resolve-context.outputs.pr_number }}" ]]; then
            echo "::error::No PR found for this branch. OTA update requires a PR number."
            echo "::error::If you ran the workflow manually (workflow_dispatch), select your release branch in the 'Use workflow from' dropdown (e.g. release/7.71.0), not main."
            exit 1
          fi
          echo "Using PR #${{ needs.resolve-context.outputs.pr_number }}"

  require-ci:
    name: Require ci.yml success
    needs: [resolve-context, validate-ota-pr]
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.gate.outputs.commit_sha }}
    steps:
      - name: Checkout gate script
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/require-check-all-jobs-pass.mts
            .nvmrc

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Require Check all jobs pass on the PR head
        id: gate
        env:
          PR_NUMBER: ${{ needs.resolve-context.outputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          SHA=$(printf '%s' "$SHA" | tr '[:upper:]' '[:lower:]')
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a full commit SHA for PR #${PR_NUMBER}"
            exit 1
          fi
          echo "commit_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Requiring Check all jobs pass on ${SHA}"
          COMMIT_SHA="$SHA" node .github/scripts/require-check-all-jobs-pass.mts

  push-ota:
    name: Push OTA update (production)
    needs: [resolve-context, validate-ota-pr, require-ci]
    permissions:
      contents: read
      checks: read
      actions: read # reusable workflow lists ci.yml runs for the shipped SHA
      id-token: write # AWS OIDC for the EAS update push in push-eas-update.yml
    uses: ./.github/workflows/push-eas-update.yml
    with:
      pr_number: ${{ needs.resolve-context.outputs.pr_number }}
      base_branch: ${{ needs.resolve-context.outputs.base_ref }}
      message: ${{ needs.resolve-context.outputs.ota_version }}
      channel: production
      platform: all
      commit_sha: ${{ needs.require-ci.outputs.commit_sha }}
    secrets: inherit
