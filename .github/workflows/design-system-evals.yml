name: Design system evals

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - 'app/**/*.ts'
      - 'app/**/*.tsx'
      - 'app/**/*.js'
      - 'app/**/*.jsx'

permissions:
  contents: read

concurrency:
  group: design-system-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-evals:
    name: Design system evals
    # Fork pull requests never run this job.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: >-
      ${{
        (vars.NAMESPACE_RUNNER_LINUX || vars.NAMESPACE_RUNNER_PROVIDER || 'current') == 'namespace' &&
        'namespace-profile-metamask-ci-linux-small' || 'ubuntu-latest'
      }}
    timeout-minutes: 40
    env:
      # Same provider resolution as the lint jobs, without workflow inputs.
      RESOLVED_RUNNER_PROVIDER: >-
        ${{
          (vars.NAMESPACE_RUNNER_LINUX || vars.NAMESPACE_RUNNER_PROVIDER || 'current')
        }}
    steps:
      # PR checkout is the merge ref. fetch-depth 2 keeps that commit and its first parent (the base tip).
      - uses: namespacelabs/nscloud-checkout-action@938f5d2d403d6224d9a0c0dc559b1dae09c2ede4 # v8.1.1
        if: ${{ env.RESOLVED_RUNNER_PROVIDER == 'namespace' }}
        with:
          fetch-depth: 2
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ env.RESOLVED_RUNNER_PROVIDER != 'namespace' }}
        with:
          fetch-depth: 2
      - name: Configure Namespace cache
        if: ${{ env.RESOLVED_RUNNER_PROVIDER == 'namespace' }}
        uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1
        with:
          path: |
            ~/.cache/yarn
            .metamask
            node_modules
            .yarn/cache
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        # zizmor: ignore[cache-poisoning] At stake if this cache is poisoned: the job's GITHUB_TOKEN
        # (contents: read), no secrets, and the design-system annotation result.
        with:
          node-version-file: '.nvmrc'
          cache: ${{ env.RESOLVED_RUNNER_PROVIDER != 'namespace' && 'yarn' || '' }}
      - name: Install Yarn dependencies with retry
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: yarn install --immutable
      - name: Run design system evals
        run: yarn design-system:evals
