# Appium Smoke Tests — iOS
#
# A compute-matrix job filters the full suite list by selected_tags, then
# appium-ios-smoke fans out one runner per shard via dynamic matrix.
# To add a suite: add one entry per shard in the SUITES JSON in compute-matrix.

name: Appium Smoke Tests (iOS)

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector (e.g. ["SmokeAccounts"] or ["ALL"])'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for main-target PR flakiness detection'
        required: false
        type: string
        default: ''
      ios-device-pool-size:
        description: 'iOS simulator and Playwright worker count (default 2). Mirrors android-device-pool-size.'
        required: false
        type: number
        default: 2
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for main-target PR flakiness detection'
        required: false
        type: string
        default: ''
      ios-device-pool-size:
        description: 'iOS simulator and Playwright worker count (default 2)'
        required: false
        type: number
        default: 2

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: read

jobs:
  compute-matrix:
    name: Compute shard matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Filter suites by selected_tags
        id: filter
        shell: bash
        run: |
          # Full suite list — one entry per shard: {tag, slug, split, total_splits}.
          # Suites with N shards appear N times with split: 1..N.
          SUITES='[
            {"tag":"SmokeAccounts",           "slug":"accounts",            "split":1,"total_splits":2},
            {"tag":"SmokeAccounts",           "slug":"accounts",            "split":2,"total_splits":2},
            {"tag":"SmokePerps",              "slug":"perps",               "split":1,"total_splits":3},
            {"tag":"SmokePerps",              "slug":"perps",               "split":2,"total_splits":3},
            {"tag":"SmokePerps",              "slug":"perps",               "split":3,"total_splits":3},
            {"tag":"SmokePredictions",        "slug":"predictions",         "split":1,"total_splits":2},
            {"tag":"SmokePredictions",        "slug":"predictions",         "split":2,"total_splits":2},
            {"tag":"SmokeSeedlessOnboarding", "slug":"seedless-onboarding", "split":1,"total_splits":2},
            {"tag":"SmokeSeedlessOnboarding", "slug":"seedless-onboarding", "split":2,"total_splits":2},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":1,"total_splits":4},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":2,"total_splits":4},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":3,"total_splits":4},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":4,"total_splits":4},
            {"tag":"SmokeNetworkAbstractions","slug":"network-abstractions","split":1,"total_splits":2},
            {"tag":"SmokeNetworkAbstractions","slug":"network-abstractions","split":2,"total_splits":2},
            {"tag":"SmokeWalletPlatform",     "slug":"wallet-platform",     "split":1,"total_splits":2},
            {"tag":"SmokeWalletPlatform",     "slug":"wallet-platform",     "split":2,"total_splits":2},
            {"tag":"SmokeSwap",               "slug":"swap",                "split":1,"total_splits":2},
            {"tag":"SmokeSwap",               "slug":"swap",                "split":2,"total_splits":2},
            {"tag":"SmokeStake",              "slug":"stake",               "split":1,"total_splits":1},
            {"tag":"SmokeMoney",              "slug":"money",               "split":1,"total_splits":1},
            {"tag":"SmokeBrowser",            "slug":"browser",             "split":1,"total_splits":1},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":1,"total_splits":3},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":2,"total_splits":3},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":3,"total_splits":3},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":1,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":2,"total_splits":2},
            {"tag":"SmokeNetworkExpansion",   "slug":"network-expansion",   "split":1,"total_splits":2},
            {"tag":"SmokeNetworkExpansion",   "slug":"network-expansion",   "split":2,"total_splits":2}
          ]'
          SELECTED='${{ inputs.selected_tags }}'
          if echo "$SELECTED" | jq -e 'contains(["ALL"])' > /dev/null; then
            INCLUDE="$SUITES"
          else
            INCLUDE=$(echo "$SUITES" | jq --argjson sel "$SELECTED" \
              '[.[] | select(.tag as $t | $sel | contains([$t]))]')
          fi
          MATRIX=$(echo "$INCLUDE" | jq -c '{"include": .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  appium-ios-smoke:
    needs: [compute-matrix]
    if: ${{ !cancelled() && needs.compute-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
    uses: ./.github/workflows/run-appium-e2e-workflow.yml
    with:
      test-suite-name: appium-${{ matrix.slug }}-ios-smoke-${{ matrix.split }}
      platform: ios
      test_suite_tag: ${{ matrix.tag }}
      split_number: ${{ matrix.split }}
      total_splits: ${{ matrix.total_splits }}
      test-timeout-minutes: 25
      build_type: ${{ inputs.build_type || 'main' }}
      metamask_environment: ${{ inputs.metamask_environment || 'e2e' }}
      runner_provider: ${{ inputs.runner_provider || 'current' }}
      ios-device-pool-size: ${{ inputs.ios-device-pool-size }}
      changed_spec_files: ${{ inputs.changed_spec_files }}
    secrets: inherit
