# Appium Smoke Tests — iOS
#
# One reusable job per Appium smoke tag (fixed total_splits by default).
# With appium-dynamic-shards, run-appium-e2e-workflow plans shard count from timings.
# Invoked from ci.yml on main push/schedule when ios-tests-ready succeeds.
# iOS build artifacts come from build-ios-apps in the parent ci.yml workflow.

name: Appium Smoke Tests (iOS)

on:
  workflow_call:
    inputs:
      build_type:
        description: 'Build type (main or flask)'
        required: false
        type: string
        default: 'main'
      metamask_environment:
        description: 'MetaMask environment'
        required: false
        type: string
        default: 'e2e'
      runner_provider:
        description: 'Runner provider (namespace or current)'
        required: false
        type: string
        default: 'namespace'
      selected_tags:
        description: 'JSON array of tags from smart E2E selector (e.g. ["SmokeAccounts"] or ["ALL"])'
        required: false
        type: string
        default: '["ALL"]'
      changed_spec_files:
        description: 'Space-separated changed E2E specs for PR flakiness detection'
        required: false
        type: string
        default: ''
      dynamic_shards:
        description: 'When true (appium-dynamic-shards label), choose shard count from timings'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  actions: read
  pull-requests: read

jobs:
  appium-accounts-ios-smoke:
    if: >-
      ${{
        !cancelled() &&
        (contains(fromJson(inputs.selected_tags || '["ALL"]'), 'ALL') ||
         contains(fromJson(inputs.selected_tags || '["ALL"]'), 'SmokeAccounts'))
      }}
    uses: ./.github/workflows/run-appium-e2e-workflow.yml
    with:
      test-suite-name: appium-accounts-ios-smoke
      platform: ios
      test_suite_tag: SmokeAccounts
      total_splits: 2
      test-timeout-minutes: 25
      build_type: ${{ inputs.build_type || 'main' }}
      metamask_environment: ${{ inputs.metamask_environment || 'e2e' }}
      runner_provider: ${{ inputs.runner_provider || 'current' }}
      changed_spec_files: ${{ inputs.changed_spec_files }}
      dynamic_shards: ${{ inputs.dynamic_shards }}
    secrets: inherit

  appium-perps-ios-smoke:
