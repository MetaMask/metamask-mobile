# TEMPORARY — verify dynamic matrix expansion for run-appium-smoke-tests refactor.
# Delete this file before merging MCWP-740/refactor_appium_smoke_tests.

name: '[TEST] Appium matrix expansion'

on:
  push:
    branches:
      - MCWP-740/refactor_appium_smoke_tests

jobs:
  # ── Test case 1: Android, ALL tags → expect 19 shards ─────────────────────
  compute-android-all:
    name: 'Compute | Android | ALL'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Filter suites
        id: filter
        shell: bash
        run: |
          SUITES='[
            {"tag":"SmokeAccounts",           "slug":"accounts",            "split":1,"total_splits":1},
            {"tag":"SmokePerps",              "slug":"perps",               "split":1,"total_splits":2},
            {"tag":"SmokePerps",              "slug":"perps",               "split":2,"total_splits":2},
            {"tag":"SmokePredictions",        "slug":"predictions",         "split":1,"total_splits":1},
            {"tag":"SmokeSeedlessOnboarding", "slug":"seedless-onboarding", "split":1,"total_splits":1},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":1,"total_splits":3},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":2,"total_splits":3},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":3,"total_splits":3},
            {"tag":"SmokeNetworkAbstractions","slug":"network-abstractions","split":1,"total_splits":1},
            {"tag":"SmokeWalletPlatform",     "slug":"wallet-platform",     "split":1,"total_splits":1},
            {"tag":"SmokeSwap",               "slug":"swap",                "split":1,"total_splits":1},
            {"tag":"SmokeStake",              "slug":"stake",               "split":1,"total_splits":1},
            {"tag":"SmokeMoney",              "slug":"money",               "split":1,"total_splits":1},
            {"tag":"SmokeBrowser",            "slug":"browser",             "split":1,"total_splits":1},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":1,"total_splits":2},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":2,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":1,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":2,"total_splits":2},
            {"tag":"SmokeNetworkExpansion",   "slug":"network-expansion",   "split":1,"total_splits":1}
          ]'
          echo "Expected: 19 shards"
          echo "Actual:   $(echo "$SUITES" | jq 'length') shards"
          echo "$SUITES" | jq -r '.[] | "  \(.tag) \(.split)/\(.total_splits)"'
          MATRIX=$(echo "$SUITES" | jq -c '{"include": .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  verify-android-all:
    name: 'Shard ${{ matrix.tag }} ${{ matrix.split }}/${{ matrix.total_splits }}'
    needs: [compute-android-all]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-android-all.outputs.matrix) }}
    steps:
      - run: echo "appium-${{ matrix.slug }}-android-smoke-${{ matrix.split }}"

  # ── Test case 2: Android, SmokeSnaps only → expect 3 shards ───────────────
  compute-android-snaps:
    name: 'Compute | Android | SmokeSnaps'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Filter suites
        id: filter
        shell: bash
        run: |
          SUITES='[
            {"tag":"SmokeAccounts",           "slug":"accounts",            "split":1,"total_splits":1},
            {"tag":"SmokePerps",              "slug":"perps",               "split":1,"total_splits":2},
            {"tag":"SmokePerps",              "slug":"perps",               "split":2,"total_splits":2},
            {"tag":"SmokePredictions",        "slug":"predictions",         "split":1,"total_splits":1},
            {"tag":"SmokeSeedlessOnboarding", "slug":"seedless-onboarding", "split":1,"total_splits":1},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":1,"total_splits":3},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":2,"total_splits":3},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":3,"total_splits":3},
            {"tag":"SmokeNetworkAbstractions","slug":"network-abstractions","split":1,"total_splits":1},
            {"tag":"SmokeWalletPlatform",     "slug":"wallet-platform",     "split":1,"total_splits":1},
            {"tag":"SmokeSwap",               "slug":"swap",                "split":1,"total_splits":1},
            {"tag":"SmokeStake",              "slug":"stake",               "split":1,"total_splits":1},
            {"tag":"SmokeMoney",              "slug":"money",               "split":1,"total_splits":1},
            {"tag":"SmokeBrowser",            "slug":"browser",             "split":1,"total_splits":1},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":1,"total_splits":2},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":2,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":1,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":2,"total_splits":2},
            {"tag":"SmokeNetworkExpansion",   "slug":"network-expansion",   "split":1,"total_splits":1}
          ]'
          SELECTED='["SmokeSnaps"]'
          INCLUDE=$(echo "$SUITES" | jq --argjson sel "$SELECTED" \
            '[.[] | select(.tag as $t | $sel | contains([$t]))]')
          echo "Expected: 3 shards"
          echo "Actual:   $(echo "$INCLUDE" | jq 'length') shards"
          echo "$INCLUDE" | jq -r '.[] | "  \(.tag) \(.split)/\(.total_splits)"'
          MATRIX=$(echo "$INCLUDE" | jq -c '{"include": .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  verify-android-snaps:
    name: 'Shard ${{ matrix.tag }} ${{ matrix.split }}/${{ matrix.total_splits }}'
    needs: [compute-android-snaps]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-android-snaps.outputs.matrix) }}
    steps:
      - run: echo "appium-${{ matrix.slug }}-android-smoke-${{ matrix.split }}"

  # ── Test case 3: iOS, SmokePerps+SmokeConfirmations → expect 5 shards ─────
  compute-ios-multi:
    name: 'Compute | iOS | SmokePerps+SmokeConfirmations'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - name: Filter suites
        id: filter
        shell: bash
        run: |
          SUITES='[
            {"tag":"SmokeAccounts",           "slug":"accounts",            "split":1,"total_splits":2},
            {"tag":"SmokeAccounts",           "slug":"accounts",            "split":2,"total_splits":2},
            {"tag":"SmokePerps",              "slug":"perps",               "split":1,"total_splits":3},
            {"tag":"SmokePerps",              "slug":"perps",               "split":2,"total_splits":3},
            {"tag":"SmokePerps",              "slug":"perps",               "split":3,"total_splits":3},
            {"tag":"SmokePredictions",        "slug":"predictions",         "split":1,"total_splits":2},
            {"tag":"SmokePredictions",        "slug":"predictions",         "split":2,"total_splits":2},
            {"tag":"SmokeSeedlessOnboarding", "slug":"seedless-onboarding", "split":1,"total_splits":2},
            {"tag":"SmokeSeedlessOnboarding", "slug":"seedless-onboarding", "split":2,"total_splits":2},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":1,"total_splits":4},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":2,"total_splits":4},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":3,"total_splits":4},
            {"tag":"SmokeSnaps",              "slug":"snaps",               "split":4,"total_splits":4},
            {"tag":"SmokeNetworkAbstractions","slug":"network-abstractions","split":1,"total_splits":2},
            {"tag":"SmokeNetworkAbstractions","slug":"network-abstractions","split":2,"total_splits":2},
            {"tag":"SmokeWalletPlatform",     "slug":"wallet-platform",     "split":1,"total_splits":2},
            {"tag":"SmokeWalletPlatform",     "slug":"wallet-platform",     "split":2,"total_splits":2},
            {"tag":"SmokeSwap",               "slug":"swap",                "split":1,"total_splits":2},
            {"tag":"SmokeSwap",               "slug":"swap",                "split":2,"total_splits":2},
            {"tag":"SmokeStake",              "slug":"stake",               "split":1,"total_splits":1},
            {"tag":"SmokeMoney",              "slug":"money",               "split":1,"total_splits":1},
            {"tag":"SmokeBrowser",            "slug":"browser",             "split":1,"total_splits":1},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":1,"total_splits":2},
            {"tag":"SmokeConfirmations",      "slug":"confirmations",       "split":2,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":1,"total_splits":2},
            {"tag":"SmokeMultiChainAPI",      "slug":"multichain-api",      "split":2,"total_splits":2},
            {"tag":"SmokeNetworkExpansion",   "slug":"network-expansion",   "split":1,"total_splits":2},
            {"tag":"SmokeNetworkExpansion",   "slug":"network-expansion",   "split":2,"total_splits":2}
          ]'
          SELECTED='["SmokePerps","SmokeConfirmations"]'
          INCLUDE=$(echo "$SUITES" | jq --argjson sel "$SELECTED" \
            '[.[] | select(.tag as $t | $sel | contains([$t]))]')
          echo "Expected: 5 shards"
          echo "Actual:   $(echo "$INCLUDE" | jq 'length') shards"
          echo "$INCLUDE" | jq -r '.[] | "  \(.tag) \(.split)/\(.total_splits)"'
          MATRIX=$(echo "$INCLUDE" | jq -c '{"include": .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  verify-ios-multi:
    name: 'Shard ${{ matrix.tag }} ${{ matrix.split }}/${{ matrix.total_splits }}'
    needs: [compute-ios-multi]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.compute-ios-multi.outputs.matrix) }}
    steps:
      - run: echo "appium-${{ matrix.slug }}-ios-smoke-${{ matrix.split }}"
