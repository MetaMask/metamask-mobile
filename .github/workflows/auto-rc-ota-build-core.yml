##############################################################################################
#
# Auto RC OTA / build core (reusable)
#
# Shared logic for the Auto RC flow (build-rc-auto.yml): detect whether the push is an
# OTA_VERSION bump and, if so, skip the native build (OTA-only changes are published
# separately). Otherwise fall through to a native build.yml build (and TestFlight for iOS).
#
# Callers that already decided native-vs-OTA themselves pass ignore_ota_bump: true, which skips
# the OTA_VERSION check altogether so nothing about it — including a failure to compute it —
# can override that decision. build-rc-auto.yml does exactly this, using the Expo fingerprint
# as its signal.
#
# This workflow does not push OTA updates — OTA publishing is handled outside this flow.
#
# Runway's manual entry workflows do not use this file — they call the dedicated OTA-only or
# build-only workflows (runway-ota-*.yml, runway-*-builds.yml) directly.
#
##############################################################################################
name: Auto RC OTA Build Core

on:
  workflow_call:
    inputs:
      platform:
        description: 'Target platform passed to build.yml (android or ios)'
        required: true
        type: string
      source_branch:
        description: >-
          Optional branch, tag, or SHA (Build workflow source_branch).
          Empty uses the branch selected in the caller workflow_dispatch "Use workflow from" UI.
        required: false
        type: string
        default: ''
      build_name:
        description: 'build.yml build_name (e.g. main-rc, main-prod)'
        required: false
        type: string
        default: main-rc
      environment:
        description: 'Build environment / track passed to upload-to-testflight (e.g. rc, prod)'
        required: false
        type: string
        default: 'rc'
      distribute_external:
        description: 'Whether to distribute the iOS build to external TestFlight testers'
        required: false
        type: boolean
        default: true
      build_number:
        description: 'Build number from generate-build-version.yml to apply locally at build time'
        required: false
        type: string
        default: ''
      ignore_ota_bump:
        description: >-
          Always build, skipping the OTA_VERSION check entirely. Set by build-rc-auto.yml, which
          decides native-vs-OTA from the Expo fingerprint before calling this workflow: a
          fingerprint mismatch means native files really did change, so honouring the OTA_VERSION
          bump here would skip the build while the fingerprint gate blocks the OTA, shipping
          nothing at all. This skips the resolve-context job rather than just ignoring its
          output, so nothing about that check can influence the build. Left false everywhere
          else, where the OTA_VERSION check still decides as it does today.
        required: false
        type: boolean
        default: false
    outputs:
      semantic_version:
        description: 'package.json version at the built commit (empty when OTA bump skips the build)'
        value: ${{ jobs.trigger-build.outputs.semantic_version }}
      ios_version_code:
        description: 'iOS CURRENT_PROJECT_VERSION at the built commit (empty when OTA bump skips the build)'
        value: ${{ jobs.trigger-build.outputs.ios_version_code }}
      android_version_code:
        description: 'Android versionCode at the built commit (empty when OTA bump skips the build)'
        value: ${{ jobs.trigger-build.outputs.android_version_code }}

permissions:
  contents: read
  pull-requests: read # required by runway-ota-resolve-context.yml
  id-token: write # required by build.yml

jobs:
  resolve-context:
    name: Resolve OTA context
    # Its only consumer is trigger-build's ota_bump check below, so when the caller has
    # already made that decision there is nothing here worth resolving — and running it
    # anyway would let a transient failure in it veto a build we know we need.
    if: ${{ !inputs.ignore_ota_bump }}
    uses: ./.github/workflows/runway-ota-resolve-context.yml
    with:
      source_branch: ${{ inputs.source_branch }}
    secrets: inherit

  trigger-build:
    name: Trigger build mobile app
    needs: resolve-context
    # resolve-context is skipped when ignore_ota_bump is set, and the default implicit
    # success() treats a skipped dependency as failing, so it has to be overridden here (same
    # reason push-eas-update.yml overrides it for its optional approval job). When
    # resolve-context does run, a failure must still block the build: ota_bump is unknown at
    # that point, so building could ship a binary for a release that only wanted an OTA.
    if: >
      always() && !cancelled() &&
      (
        inputs.ignore_ota_bump ||
        (needs.resolve-context.result == 'success' &&
         needs.resolve-context.outputs.ota_bump != 'true')
      )
    uses: ./.github/workflows/build.yml
    with:
      build_name: ${{ inputs.build_name }}
      platform: ${{ inputs.platform }}
      source_branch: ${{ inputs.source_branch || github.ref_name }}
      build_number: ${{ inputs.build_number }}
      upload_to_sentry: true
    secrets: inherit

  upload-ios-testflight:
    name: Upload iOS to TestFlight
    needs: [trigger-build]
    if: ${{ inputs.platform == 'ios' }}
    uses: ./.github/workflows/upload-to-testflight.yml
    with:
      environment: ${{ inputs.environment }}
      source_branch: ${{ inputs.source_branch || github.ref_name }}
      build_name: ${{ inputs.build_name }}
      build_commit_sha: ${{ needs.trigger-build.outputs.built_commit_sha }}
      build_version: ${{ needs.trigger-build.outputs.semantic_version }}
      build_number: ${{ needs.trigger-build.outputs.ios_version_code }}
      distribute_external: ${{ inputs.distribute_external }}
    secrets: inherit
