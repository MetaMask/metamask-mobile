name: Require two approvals for Cursor PRs

on:
  # zizmor: ignore[dangerous-triggers] reads trusted workflow code and PR metadata only; never checks out or executes PR code
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    branches:
      - main
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: >-
    cursor-pr-approvals-${{
      github.event.pull_request.number ||
      github.event.merge_group.head_sha ||
      github.run_id
    }}
  cancel-in-progress: true

jobs:
  require-two-approvals:
    name: Require two approvals for Cursor PRs
    if: >-
      github.event_name == 'merge_group' ||
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check approvals
        uses: actions/github-script@v9
        with:
          script: |
            const requiredApprovalCount = 2;

            if (context.eventName === 'merge_group') {
              core.info('Approval requirements were verified before the pull request entered the merge queue.');
              return;
            }

            const pullRequest = context.payload.pull_request;
            if (!pullRequest) {
              core.setFailed('The workflow event did not include pull request metadata.');
              return;
            }

            if (pullRequest.user.login.toLowerCase() !== 'cursor[bot]') {
              core.info(`Approval gate does not apply to ${pullRequest.user.login}.`);
              return;
            }

            if (pullRequest.draft) {
              core.info('Approval gate is informational while the pull request is a draft.');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });

            const decisiveReviewStates = new Set([
              'APPROVED',
              'CHANGES_REQUESTED',
              'DISMISSED',
            ]);
            const latestStateByReviewer = new Map();

            reviews
              .sort((firstReview, secondReview) => firstReview.id - secondReview.id)
              .forEach((review) => {
                const state = review.state.toUpperCase();
                const reviewer = review.user;

                if (
                  review.commit_id !== pullRequest.head.sha ||
                  reviewer?.type !== 'User' ||
                  !decisiveReviewStates.has(state)
                ) {
                  return;
                }

                latestStateByReviewer.set(reviewer.login, state);
              });

            const approvalCandidates = [...latestStateByReviewer.entries()]
              .filter(([, state]) => state === 'APPROVED')
              .map(([login]) => login);
            const eligibleApprovers = [];

            for (const login of approvalCandidates) {
              try {
                const { data } =
                  await github.rest.repos.getCollaboratorPermissionLevel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    username: login,
                  });

                if (['admin', 'maintain', 'write'].includes(data.permission)) {
                  eligibleApprovers.push(login);
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                core.info(`${login} is not a repository collaborator.`);
              }
            }

            if (eligibleApprovers.length < requiredApprovalCount) {
              core.setFailed(
                `Cursor-authored pull requests require ${requiredApprovalCount} approvals ` +
                  `from collaborators with write access on the current commit; ` +
                  `found ${eligibleApprovers.length}.`,
              );
              return;
            }

            core.info(
              `Approval requirement met with ${eligibleApprovers.length} eligible approvals.`,
            );
