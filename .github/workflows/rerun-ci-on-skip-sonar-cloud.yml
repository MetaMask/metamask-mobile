name: Rerun failed CI on skip-sonar-cloud

# skip-sonar-cloud is read live by the quality-gate job, so a label added while
# CI is still running is picked up automatically. Once that job has already
# failed, re-run only the failed jobs instead of making authors retry by hand.

on:
  pull_request:
    types: [labeled]

jobs:
  rerun-failed-ci:
    if: github.event.pull_request.state == 'open' && github.event.label.name == 'skip-sonar-cloud'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun failed jobs on latest CI workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          echo "Looking for latest ci.yml run on $HEAD_REF..."
          RUN_JSON=$(gh run list \
            --repo "$REPO" \
            --branch "$HEAD_REF" \
            --workflow "ci.yml" \
            --limit 1 \
            --json databaseId,status)

          RUN_ID=$(jq -r '.[0].databaseId // empty' <<< "$RUN_JSON")
          STATUS=$(jq -r '.[0].status // empty' <<< "$RUN_JSON")

          if [[ -z "$RUN_ID" ]]; then
            echo "No CI workflow run found for branch $HEAD_REF"
            exit 0
          fi

          echo "Latest run: $RUN_ID (status=$STATUS)"

          if [[ "$STATUS" == "in_progress" || "$STATUS" == "queued" || "$STATUS" == "pending" || "$STATUS" == "waiting" ]]; then
            echo "CI is still running; the quality-gate job will read skip-sonar-cloud live."
            exit 0
          fi

          echo "Re-running failed jobs on $RUN_ID..."
          if gh run rerun "$RUN_ID" --repo "$REPO" --failed; then
            echo "Failed jobs re-triggered successfully"
          else
            echo "Rerun not possible (run may not be in a retriable state or had no failed jobs)"
          fi
