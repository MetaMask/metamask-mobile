name: AI PR risk analysis

# opened / synchronize / reopened / ready_for_review cover release branches
# and main pull requests that already have auto-merge. Applying auto-merge
# is handled by ai-pr-risk-analysis-label.yml.
#
# labeled is not a trigger here. A skipped Analyze job is reported as
# success, and that newer check would replace an in-progress or failed
# result on the same commit.
#
# There is no branches filter. Skipping the workflow that way leaves a
# required check pending. Skipping this job still reports Analyze, which
# branch protection treats as a success for pushes to other bases.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  analyze:
    name: Analyze
    timeout-minutes: 10
    # Main requires auto-merge. Release branches run on these events.
    # A draft that already has the label is analyzed on ready_for_review.
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.draft == false
      && (
        (
          github.event.pull_request.base.ref == 'main'
          && contains(github.event.pull_request.labels.*.name, 'auto-merge')
        )
        || startsWith(github.event.pull_request.base.ref, 'release/')
      )
    # ready_for_review queues instead of cancelling an in-progress analysis.
    # A later push may cancel a stale run.
    concurrency:
      group: ai-pr-risk-analysis-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event.action != 'ready_for_review' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # https://github.com/MetaMask/ai-analyzer/releases
      - name: Checkout AI Analyzer
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: f9a82c6ae0bfdadb352b9b736d26174705fe6348
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Run AI PR Analysis
        uses: ./.ai-analyzer-action
        with:
          mode: pr-risk-analysis
          add-comment: false
          add-label: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-api-key: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          # Opt-in Langfuse tracing (redacted source; host is hardcoded in the analyzer)
          langfuse-public-key: ${{ secrets.AI_ANALYZER_LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.AI_ANALYZER_LANGFUSE_SECRET_KEY }}
          # Gate override for Runway release-branch cherry-picks
          gate-override-risk-threshold: medium
          gate-override-base-pattern: '^release/'
          gate-override-author: 'runway-github[bot]'
          gate-override-title-pattern: 'cherry.?pick'
