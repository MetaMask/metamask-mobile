name: AI PR risk analysis

# Same shape as the extension workflow (MetaMask/metamask-extension#46745):
# one Analyze job. opened / synchronize / reopened / ready_for_review cover
# release branches and main pull requests that already have auto-merge.
# labeled is the other entry point, so applying auto-merge on main runs
# analysis without waiting for another push.
#
# There is no branches filter. Skipping the workflow that way leaves a
# required check pending. Skipping this job still reports Analyze, which
# branch protection treats as a success.
#
# Unrelated labels skip the job, so they do not take the concurrency group.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled

jobs:
  analyze:
    name: Analyze
    timeout-minutes: 10
    # Main requires auto-merge. Release branches run on the normal events.
    # A labeled event runs only when the label just added is auto-merge on
    # main. A draft that already has the label is analyzed on ready_for_review.
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.draft == false
      && (
        (
          github.event.action != 'labeled'
          && (
            (
              github.event.pull_request.base.ref == 'main'
              && contains(github.event.pull_request.labels.*.name, 'auto-merge')
            )
            || startsWith(github.event.pull_request.base.ref, 'release/')
          )
        )
        || (
          github.event.action == 'labeled'
          && github.event.label.name == 'auto-merge'
          && github.event.pull_request.base.ref == 'main'
        )
      )
    # One group per pull request. Label and ready_for_review runs queue
    # instead of cancelling an in-progress analysis. A later push may cancel
    # a stale label run.
    concurrency:
      group: ai-pr-risk-analysis-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event.action != 'labeled' && github.event.action != 'ready_for_review' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # https://github.com/MetaMask/ai-analyzer/releases
      - name: Checkout AI Analyzer
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: f9a82c6ae0bfdadb352b9b736d26174705fe6348
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Run AI PR Analysis
        uses: ./.ai-analyzer-action
        with:
          mode: pr-risk-analysis
          add-comment: false
          add-label: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-api-key: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          # Opt-in Langfuse tracing (redacted source; host is hardcoded in the analyzer)
          langfuse-public-key: ${{ secrets.AI_ANALYZER_LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.AI_ANALYZER_LANGFUSE_SECRET_KEY }}
          # Gate override for Runway release-branch cherry-picks
          gate-override-risk-threshold: medium
          gate-override-base-pattern: '^release/'
          gate-override-author: 'runway-github[bot]'
          gate-override-title-pattern: 'cherry.?pick'
