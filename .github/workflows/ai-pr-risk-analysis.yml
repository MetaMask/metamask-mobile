name: AI PR risk analysis

# Label add/remove is handled by ai-pr-risk-analysis-label.yml, and only for
# main. This workflow does not subscribe to those events, so a label on a
# release pull request cannot replace a successful Analyze check with a skip.
# The Gate check (AI PR Analyzer / Gate) from the last real run stays put.
#
# There is no branches filter. Skipping the workflow with a branches filter
# leaves a required check pending. Skipping the job still reports Analyze,
# which branch protection treats as a success.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  analyze:
    name: Analyze
    timeout-minutes: 10
    # Main requires auto-merge. Release branches always run (Runway cherry-picks).
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.draft == false
      && (
        (
          github.event.pull_request.base.ref == 'main'
          && contains(github.event.pull_request.labels.*.name, 'auto-merge')
        )
        || startsWith(github.event.pull_request.base.ref, 'release/')
      )
    # Job-level so a skipped run does not take this group. A skipped job must
    # not cancel an analysis that is already in progress.
    concurrency:
      group: ai-pr-risk-analysis-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # https://github.com/MetaMask/ai-analyzer/releases
      - name: Checkout AI Analyzer
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: f9a82c6ae0bfdadb352b9b736d26174705fe6348
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Run AI PR Analysis
        uses: ./.ai-analyzer-action
        with:
          mode: pr-risk-analysis
          add-comment: false
          add-label: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-api-key: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          # Opt-in Langfuse tracing (redacted source; host is hardcoded in the analyzer)
          langfuse-public-key: ${{ secrets.AI_ANALYZER_LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.AI_ANALYZER_LANGFUSE_SECRET_KEY }}
          # Gate override for Runway release-branch cherry-picks
          gate-override-risk-threshold: medium
          gate-override-base-pattern: '^release/'
          gate-override-author: 'runway-github[bot]'
          gate-override-title-pattern: 'cherry.?pick'

  clear-stale-risk-labels:
    name: Clear stale risk labels
    timeout-minutes: 5
    # Main pull requests without auto-merge are not analyzed. Remove risk:*
    # labels so a result from an earlier commit cannot stay on the pull request.
    # This job has no concurrency group: it is skipped for every pull request
    # that is actually being analyzed, and must not cancel that run.
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.base.ref == 'main'
      && !contains(github.event.pull_request.labels.*.name, 'auto-merge')
      && (
        contains(github.event.pull_request.labels.*.name, 'risk:critical')
        || contains(github.event.pull_request.labels.*.name, 'risk:high')
        || contains(github.event.pull_request.labels.*.name, 'risk:medium')
        || contains(github.event.pull_request.labels.*.name, 'risk:low')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Remove stale risk labels
        uses: ./.github/actions/clear-stale-ai-risk-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
