name: List BrowserStack Fold devices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    name: List App Automate Fold devices
    runs-on: ubuntu-latest
    steps:
      - name: Query account device list
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          curl -fsS -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            https://api-cloud.browserstack.com/app-automate/devices.json \
            | jq '[.[] | select(.os == "android" and (.device | test("Fold|fold"))) | {device, os_version}]'
