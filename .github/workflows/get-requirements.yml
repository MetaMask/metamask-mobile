# Centralised "should this job run?" workflow.

name: Get workflow and job requirements

on:
  workflow_call:
    outputs:
      skip_everything:
        description: 'Whether all jobs should be skipped in merge-queue (branch is already up-to-date with latest commit)'
        value: ${{ jobs.detect-changes.outputs.skip_everything }}
      skip_jest_tests:
        description: 'Whether the unit, component-view and integration Jest jobs (and the JS dependency prep they need) should be skipped. True only for pull requests whose changed files are all documentation; always false for pushes, merge-queue and scheduled runs.'
        value: ${{ jobs.detect-changes.outputs.skip_jest_tests }}
      skip_e2e:
        description: 'Whether all E2E builds and tests should be skipped. True for any skip signal (labels or commit tag). Check block_merge_for_e2e_readiness separately to know if merge is also blocked'
        value: ${{ jobs.detect-changes.outputs.skip_e2e }}
      android_e2e_needed:
        description: 'Whether Android E2E tests and builds should run (true when Android-specific or shared files changed)'
        value: ${{ jobs.detect-changes.outputs.android_e2e_needed }}
      ios_e2e_needed:
        description: 'Whether iOS is selected by the final platform policy for E2E. This flag gates both the iOS build and iOS tests. Pull requests require an explicit iOS request (run-appium-ios-tests, smoke-infrastructure changes on main, or a brand-new tests/smoke-appium spec). Pushes use path-filtered platforms, while scheduled runs select iOS only on main.'
        value: ${{ jobs.detect-changes.outputs.ios_e2e_needed }}
      changed_spec_files:
        description: 'Space-separated list of changed E2E spec file paths only — never the full changed-file list, which overflows ARG_MAX and kills this job on large PRs. Smoke test workflows use this to run modified spec files twice for flakiness detection on PRs targeting main.'
        value: ${{ jobs.detect-changes.outputs.changed_spec_files }}
      changed_cv_test_files:
        description: 'Space-separated list of changed component view test file paths (*.view.test.tsx) only — never the full changed-file list. The component-view-flakiness-detection job uses this to re-run modified CV tests N times for flakiness detection on PRs targeting main.'
        value: ${{ jobs.detect-changes.outputs.changed_cv_test_files }}
      jest_related_only:
        description: 'Whether the unit, component-view and integration Jest jobs should run only the tests related to the changed files (jest --findRelatedTests). True only for pull requests that change no Jest config, setup file, mock, fixture, test utility, dependency manifest or .github file and whose changed source file list is usable. False means the full sharded suite runs (merge queue, push, schedule, manual runs, and every pull request that does not qualify).'
        value: ${{ jobs.detect-changes.outputs.jest_related_only }}
      jest_related_files:
        description: 'Newline-separated list of changed files to pass to jest --findRelatedTests. Empty unless jest_related_only is true.'
        value: ${{ jobs.detect-changes.outputs.jest_related_files }}
      jest_coverage_args:
        description: 'Space-separated --collectCoverageFrom arguments that scope Jest coverage to the changed app source files. Only set on pull requests. Empty means collect coverage from the whole app (the default jest config). When a pull request changes no app source files the arguments point at a path that does not exist, so shards report empty coverage. Falls back to empty when the changed file list is too large or has paths that are unsafe to pass on a command line.'
        value: ${{ jobs.detect-changes.outputs.jest_coverage_args }}
      block_merge_for_e2e_readiness:
        description: 'Whether merge should be blocked for E2E readiness. True when "pr-not-ready-for-e2e" label is applied AND changes are not ignorable-only (i.e. E2E is actually relevant). Ignorable-only PRs (docs, assets, configs, test files) bypass the block automatically.'
        value: ${{ jobs.detect-changes.outputs.block_merge_for_e2e_readiness }}
      run_smart_e2e_selection:
        description: 'Whether the smart-e2e-selection job should run. False for non-PR events, forks, stable-target synchronization PRs, or hard E2E skips.'
        value: ${{ jobs.detect-changes.outputs.run_smart_e2e_selection }}
      run_smart_e2e_contracts:
        description: 'Whether Smart E2E mode, action, and analyzer engine contract tests should run.'
        value: ${{ jobs.detect-changes.outputs.run_smart_e2e_contracts }}
      run_performance:
        description: 'Whether a PR label requested performance E2E. True for run-performance-tests or any run-performance-*-tests area label.'
        value: ${{ jobs.detect-changes.outputs.run_performance }}
      performance_tags:
        description: 'JSON array of performance tags from PR labels. ["ALL"] runs the full suite. [] runs none.'
        value: ${{ jobs.detect-changes.outputs.performance_tags }}
      performance_tags_reasoning:
        description: 'Why the PR performance tags were selected'
        value: ${{ jobs.detect-changes.outputs.performance_tags_reasoning }}
      use_main_builds_for_test_only_prs:
        description: 'Whether test-only E2E runs should reuse Android/iOS builds from main and fall back to fresh native builds when unavailable; false for normal E2E runs.'
        value: ${{ jobs.detect-changes.outputs.use_main_builds_for_test_only_prs }}

jobs:
  detect-changes:
    name: Filter files changed and decide which jobs to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_everything: ${{ steps.skip-merge-queue.outputs.up-to-date == 'true' && 'true' || 'false' }}
      skip_jest_tests: ${{ steps.set-jest-outputs.outputs.skip_jest_tests || 'false' }}
      skip_e2e: ${{ steps.set-e2e-outputs.outputs.e2e_needed != 'true' && 'true' || 'false' }}
      android_e2e_needed: ${{ steps.set-e2e-outputs.outputs.android_final }}
      ios_e2e_needed: ${{ steps.set-e2e-outputs.outputs.ios_final }}
      changed_spec_files: ${{ steps.set-e2e-outputs.outputs.changed_spec_files }}
      changed_cv_test_files: ${{ steps.cv-test-files.outputs.changed_cv_test_files }}
      jest_related_only: ${{ steps.jest-scope.outputs.jest_related_only || 'false' }}
      jest_related_files: ${{ steps.jest-scope.outputs.jest_related_files }}
      jest_coverage_args: ${{ steps.coverage-scope.outputs.jest_coverage_args }}
      block_merge_for_e2e_readiness: ${{ steps.set-e2e-outputs.outputs.block_merge }}
      run_smart_e2e_selection: ${{ steps.set-e2e-outputs.outputs.run_smart_e2e_selection }}
      run_smart_e2e_contracts: ${{ steps.filter.outputs.smart_e2e_contracts }}
      run_performance: ${{ steps.set-e2e-outputs.outputs.run_performance }}
      performance_tags: ${{ steps.set-e2e-outputs.outputs.performance_tags }}
      performance_tags_reasoning: ${{ steps.set-e2e-outputs.outputs.performance_tags_reasoning }}
      use_main_builds_for_test_only_prs: ${{ steps.set-e2e-outputs.outputs.use_main_builds_for_test_only_prs }}
    env:
      # For a `pull_request` event, the head commit hash is `github.event.pull_request.head.sha`.
      # For a `push` event, the head commit hash is `github.sha`.
      HEAD_COMMIT_HASH: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check pull request merge queue status
        id: skip-merge-queue
        if: github.event_name == 'merge_group'
        uses: MetaMask/github-tools/.github/actions/check-skip-merge-queue@v1

      - name: Checkout repository
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch HEAD commit for message checks
        if: ${{ steps.skip-merge-queue.outputs.up-to-date != 'true' }}
        run: git fetch --depth=1 origin "${HEAD_COMMIT_HASH}"

      - name: Check skip E2E commit tag
        id: skip-e2e-tag
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] || [[ "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if git show --format='%B' --no-patch "${HEAD_COMMIT_HASH}" | grep --fixed-strings --quiet '[skip-e2e]'; then
              echo "SKIP=true" >> "$GITHUB_OUTPUT"
              echo "-> SKIP=true due to [skip-e2e] tag in last commit message"
            fi
          fi

      - name: Check PR labels
        id: check-labels
        if: steps.skip-merge-queue.outputs.up-to-date != 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "SKIP_E2E=false"
            echo "LABEL_BLOCKS_MERGE=false"
            echo "SKIP_SMART_SELECTION=false"
            echo "RUN_PERFORMANCE=false"
            echo "PERFORMANCE_AREA_LABELS="
            echo "RUN_APPIUM_IOS_LABEL=false"
          } >> "$GITHUB_OUTPUT"

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')

          if echo "$LABELS" | grep -qx "skip-e2e"; then
            echo "SKIP_E2E=true" >> "$GITHUB_OUTPUT"
            echo "-> SKIP_E2E=true due to 'skip-e2e' label on PR"
          fi

          if echo "$LABELS" | grep -qx "pr-not-ready-for-e2e"; then
            {
              echo "SKIP_E2E=true"
              echo "LABEL_BLOCKS_MERGE=true"
            } >> "$GITHUB_OUTPUT"
            echo "-> SKIP_E2E=true and LABEL_BLOCKS_MERGE=true due to 'pr-not-ready-for-e2e' label on PR"
          fi

          if echo "$LABELS" | grep -qx "skip-smart-e2e-selection"; then
            echo "SKIP_SMART_SELECTION=true" >> "$GITHUB_OUTPUT"
            echo "-> SKIP_SMART_SELECTION=true due to 'skip-smart-e2e-selection' label on PR"
          fi

          if echo "$LABELS" | grep -qx "run-performance-tests"; then
            echo "RUN_PERFORMANCE=true" >> "$GITHUB_OUTPUT"
            echo "-> RUN_PERFORMANCE=true due to 'run-performance-tests' label on PR"
          fi

          AREA_LABELS=""
          while IFS= read -r label; do
            case "$label" in
              run-performance-account-list-tests|run-performance-onboarding-tests|run-performance-login-tests|run-performance-swaps-tests|run-performance-launch-tests|run-performance-asset-loading-tests|run-performance-predict-tests|run-performance-perps-tests|run-performance-money-tests|run-performance-rewards-tests)
                if [ -n "$AREA_LABELS" ]; then
                  AREA_LABELS="${AREA_LABELS},${label}"
                else
                  AREA_LABELS="$label"
                fi
                echo "-> performance area label: $label"
                ;;
            esac
          done <<< "$LABELS"
          echo "PERFORMANCE_AREA_LABELS=$AREA_LABELS" >> "$GITHUB_OUTPUT"

          if echo "$LABELS" | grep -qx "run-appium-ios-tests"; then
            echo "RUN_APPIUM_IOS_LABEL=true" >> "$GITHUB_OUTPUT"
            echo "-> RUN_APPIUM_IOS_LABEL=true due to 'run-appium-ios-tests' label on PR"
          fi

      - name: Filter changed files
        id: filter
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        uses: dorny/paths-filter@9d7afb8d214ad99e78fbd4247752c4caed2b6e4c # v4.0.0
        with:
          filters: .github/rules/filter-rules.yml
          list-files: shell

      # Decide whether the Jest jobs can run only the tests related to the files a
      # pull request changes. Anything that is not a plain pull request, or that
      # Jest cannot follow through the import graph (see jest_full_run_triggers in
      # filter-rules.yml), keeps the full sharded suite. The file list ends up in
      # command-line arguments of the Jest shards, so it is capped and validated
      # here; a list that is too long or has an unusual path falls back to the full
      # suite. Jest ignores files it cannot follow, including deleted ones.
      # Put [full-jest] in the head commit message to force the full suite.
      - name: Resolve Jest test scope
        id: jest-scope
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JEST_FULL_RUN_TRIGGERS_COUNT: ${{ steps.filter.outputs.jest_full_run_triggers_count }}
          ALL_CHANGES_COUNT: ${{ steps.filter.outputs.all_changes_count }}
          ALL_CHANGES_LIST: ${{ steps.filter.outputs.all_changes_count <= 300 && steps.filter.outputs.all_changes_files || '' }}
        run: |
          set -f
          # The changed-file list goes into the command line of every Jest shard
          # and into a step output. Past 300 changed files the related set is close to the
          # whole suite anyway, so the full suite is the simpler, safe fallback.
          MAX_FILES=300
          related=false
          reason=""
          files=()

          head_message=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # HEAD_COMMIT_HASH is the job-level env and the "Fetch HEAD commit"
            # step above fetched it. Verify it anyway: a missing commit must fail
            # the step instead of reading as "no [full-jest] tag".
            if ! git rev-parse --verify --quiet "${HEAD_COMMIT_HASH}^{commit}" > /dev/null; then
              echo "::error::Head commit ${HEAD_COMMIT_HASH} is not available in the checkout"
              exit 1
            fi
            head_message="$(git show --format='%B' --no-patch "${HEAD_COMMIT_HASH}")"
          fi

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            reason="${GITHUB_EVENT_NAME} runs always use the full suite"
          elif [[ "$head_message" == *'[full-jest]'* ]]; then
            reason="[full-jest] tag in the head commit message"
          elif [[ "${JEST_FULL_RUN_TRIGGERS_COUNT:-0}" -gt 0 ]]; then
            reason="${JEST_FULL_RUN_TRIGGERS_COUNT} changed file(s) can affect every test (Jest config, setup, mocks, fixtures, test utilities, dependencies or .github)"
          elif [[ "${ALL_CHANGES_COUNT:-0}" -eq 0 ]]; then
            reason="no changed files"
          elif [[ "${ALL_CHANGES_COUNT}" -gt "$MAX_FILES" ]]; then
            reason="${ALL_CHANGES_COUNT} changed files (cap ${MAX_FILES})"
          else
            for file in $ALL_CHANGES_LIST; do
              if [[ ! "$file" =~ ^[A-Za-z0-9_./@+-]+$ ]]; then
                files=()
                reason="unsafe path '${file}'"
                break
              fi
              files+=("$file")
            done
            if [[ -z "$reason" ]]; then
              related=true
              reason="${#files[@]} changed file(s)"
            fi
          fi

          echo "-> jest_related_only=${related} (${reason})"
          echo "jest_related_only=${related}" >> "$GITHUB_OUTPUT"
          if [[ "$related" == "true" ]]; then
            {
              echo "jest_related_files<<JEST_RELATED_FILES_EOF"
              printf '%s\n' "${files[@]}"
              echo "JEST_RELATED_FILES_EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Jest test scope"
            echo "- Mode: $([[ "$related" == "true" ]] && echo 'related tests only (jest --findRelatedTests)' || echo 'full sharded suite')"
            echo "- Reason: ${reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute Jest skip flag
        id: set-jest-outputs
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          ALL_CHANGES_COUNT: ${{ steps.filter.outputs.all_changes_count }}
          JEST_SKIPPABLE_DOCS_COUNT: ${{ steps.filter.outputs.jest_skippable_docs_count }}
        run: |
          skip=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             [[ "${ALL_CHANGES_COUNT:-0}" -gt 0 ]] &&
             [[ "${JEST_SKIPPABLE_DOCS_COUNT:-0}" -eq "${ALL_CHANGES_COUNT:-0}" ]]; then
            skip=true
            echo "-> Skipping Jest jobs (docs-only changes)"
          fi
          echo "skip_jest_tests=$skip" >> "$GITHUB_OUTPUT"

      # Changed component view test files for flakiness detection. Mirrors
      # changed_spec_files: PRs targeting main only, emitted as a heredoc so a
      # long file list cannot break GITHUB_OUTPUT parsing. Nothing is emitted
      # when no CV test file changed, so the consuming job skips.
      - name: List changed component view test files
        id: cv-test-files
        if: >-
          steps.skip-merge-queue.outputs.up-to-date != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.base.ref == 'main'
        env:
          CV_TEST_FILES_LIST: ${{ steps.filter.outputs.cv_test_files_files }}
        run: |
          if [ -z "$CV_TEST_FILES_LIST" ]; then
            echo "-> No component view test files changed"
            exit 0
          fi
          {
            echo "changed_cv_test_files<<CV_TEST_FILES_EOF"
            echo "$CV_TEST_FILES_LIST"
            echo "CV_TEST_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Scope Jest coverage to the app source files a PR changes. The list goes
      # into command-line arguments of the Jest shards, so it is validated here:
      # a count above the cap or any path outside the safe character set falls
      # back to whole-app coverage. Untested changed files are still reported
      # (at 0%) because they are listed explicitly.
      - name: Resolve Jest coverage scope
        id: coverage-scope
        if: steps.skip-merge-queue.outputs.up-to-date != 'true' && github.event_name == 'pull_request'
        env:
          APP_SOURCE_FILES_COUNT: ${{ steps.filter.outputs.app_source_files_count }}
          APP_SOURCE_FILES_LIST: ${{ steps.filter.outputs.app_source_files_count <= 400 && steps.filter.outputs.app_source_files_files || '' }}
        run: |
          set -f
          # Only a command-line length guard (one --collectCoverageFrom argument
          # per file), so it is looser than the 300-file test cap above. Past it
          # the fallback is whole-app coverage.
          MAX_FILES=400
          if [ "${APP_SOURCE_FILES_COUNT:-0}" -gt "$MAX_FILES" ]; then
            echo "-> ${APP_SOURCE_FILES_COUNT} app source files changed (cap ${MAX_FILES}); collecting whole-app coverage"
            exit 0
          fi

          args=""
          files=0
          for file in $APP_SOURCE_FILES_LIST; do
            case "$file" in
              *.test.*|*.spec.*|*.stories.*) continue ;;
              */__tests__/*|*/__mocks__/*|*/_mocks_/*|*/mocks/*|*.mock.*|*.mocks.*) continue ;;
              */__fixtures__/*|*.fixture.*|*/testUtils/*|*.testUtils.*|*/util/test/*) continue ;;
            esac
            if [[ ! "$file" =~ ^app/[A-Za-z0-9_./@+-]+$ ]]; then
              echo "-> Unsafe path '${file}'; collecting whole-app coverage"
              exit 0
            fi
            # Deleted files have nothing to cover.
            [ -f "$file" ] || continue
            args="${args} --collectCoverageFrom=${file}"
            files=$((files + 1))
          done

          if [ "$files" -eq 0 ]; then
            echo "-> No changed app source files; coverage is scoped to nothing"
            args=" --collectCoverageFrom=app/__no-changed-app-source-files__.ts"
          else
            echo "-> Scoping coverage to ${files} changed app source files"
          fi
          echo "jest_coverage_args=${args# }" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js for E2E requirement computation
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # Pull request file status is the three-dot diff, so a spec deleted on the
      # base after branch point is not "added". Platform selection accepts only
      # status "added" with no previous filename.
      - name: List added Appium smoke specs
        id: added-smoke-specs
        if: steps.skip-merge-queue.outputs.up-to-date != 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "added_smoke_spec_files<<ADDED_SMOKE_SPECS_EOF"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[] | select(.filename | test("^tests/smoke-appium/.+\\.spec\\.ts$")) | "\(.status)\t\(.filename)\t\(.previous_filename // "")"'
            echo "ADDED_SMOKE_SPECS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute E2E flags
        id: set-e2e-outputs
        if: steps.skip-merge-queue.outputs.up-to-date != 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CI_REF_NAME: ${{ github.ref_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          SHOULD_SKIP_E2E: ${{ steps.skip-e2e-tag.outputs.SKIP == 'true' || steps.check-labels.outputs.SKIP_E2E == 'true' }}
          SKIP_SMART_SELECTION: ${{ steps.check-labels.outputs.SKIP_SMART_SELECTION }}
          LABEL_BLOCKS_MERGE: ${{ steps.check-labels.outputs.LABEL_BLOCKS_MERGE }}
          RUN_PERFORMANCE_LABEL: ${{ steps.check-labels.outputs.RUN_PERFORMANCE }}
          PERFORMANCE_AREA_LABELS: ${{ steps.check-labels.outputs.PERFORMANCE_AREA_LABELS }}
          RUN_APPIUM_IOS_LABEL: ${{ steps.check-labels.outputs.RUN_APPIUM_IOS_LABEL }}
          E2E_SMOKE_INFRA_COUNT: ${{ steps.filter.outputs.e2e_smoke_infra_count }}
          ALL_CHANGES_COUNT: ${{ steps.filter.outputs.all_changes_count }}
          CHANGED_SPEC_FILES: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && steps.filter.outputs.e2e_spec_files_files || '' }}
          E2E_IGNORABLE_COUNT: ${{ steps.filter.outputs.e2e_ignorable_count }}
          E2E_TEST_FILES_COUNT: ${{ steps.filter.outputs.e2e_test_files_count }}
          E2E_TEST_OR_IGNORABLE_COUNT: ${{ steps.filter.outputs.e2e_test_or_ignorable_count }}
          E2E_WORKFLOWS_COUNT: ${{ steps.filter.outputs.e2e_relevant_workflows_count }}
          ANDROID_COUNT: ${{ steps.filter.outputs.android_count }}
          IOS_COUNT: ${{ steps.filter.outputs.ios_count }}
          ANDROID_OR_IGNORABLE_COUNT: ${{ steps.filter.outputs.android_or_ignorable_count }}
          IOS_OR_IGNORABLE_COUNT: ${{ steps.filter.outputs.ios_or_ignorable_count }}
          ADDED_SMOKE_SPEC_FILES: ${{ steps.added-smoke-specs.outputs.added_smoke_spec_files }}
        run: node .github/scripts/qa-automation/e2e-ci-orchestration/run-compute-e2e-platform-flags.mjs
