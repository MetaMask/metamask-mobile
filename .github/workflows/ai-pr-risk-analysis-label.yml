name: AI PR risk analysis label gate

# Runs analysis when auto-merge is added to a main PR. The job is not named
# Analyze so unrelated labels cannot replace that check with a skip.
# Keep the analysis step in sync with ai-pr-risk-analysis.yml.

on:
  pull_request:
    types:
      - labeled
    branches:
      - main

jobs:
  analyze-on-auto-merge:
    name: Auto-merge label
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'labeled'
      && github.event.label.name == 'auto-merge'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # https://github.com/MetaMask/ai-analyzer/releases
      - name: Checkout AI Analyzer
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: f9a82c6ae0bfdadb352b9b736d26174705fe6348
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Run AI PR Analysis
        id: analysis
        uses: ./.ai-analyzer-action
        with:
          mode: pr-risk-analysis
          add-comment: false
          add-label: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-api-key: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          # Opt-in Langfuse tracing (redacted source; host is hardcoded in the analyzer)
          langfuse-public-key: ${{ secrets.AI_ANALYZER_LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.AI_ANALYZER_LANGFUSE_SECRET_KEY }}
          # Gate override for Runway release-branch cherry-picks
          gate-override-risk-threshold: medium
          gate-override-base-pattern: '^release/'
          gate-override-author: 'runway-github[bot]'
          gate-override-title-pattern: 'cherry.?pick'

      # Replaces the skipped Analyze check left by ai-pr-risk-analysis.yml.
      - name: Publish Analyze check
        if: always() && !cancelled()
        uses: actions/github-script@v9
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = process.env.ANALYSIS_OUTCOME === 'success' ? 'success' : 'failure';
            const completedAt = new Date();
            const startedAt = new Date(completedAt.getTime() - 1000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Analyze',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              started_at: startedAt.toISOString(),
              completed_at: completedAt.toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: conclusion === 'success'
                  ? 'AI PR risk analysis'
                  : 'AI PR risk analysis failed',
                summary: 'Ran because the auto-merge label was added. See the AI PR Analyzer / Gate check for the risk result.',
              },
            });
