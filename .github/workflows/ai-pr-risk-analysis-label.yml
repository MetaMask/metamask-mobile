name: AI PR risk analysis label gate

# Separate from ai-pr-risk-analysis.yml so label events stay off release
# branches. A release pull request keeps the Analyze and AI PR Analyzer / Gate
# checks from its last real run when someone adds an unrelated label.
#
# This workflow only listens on main. The analysis job is not named Analyze:
# a skipped run for an unrelated label must not become the latest Analyze
# check. A run that does execute publishes that check itself.
#
# Keep the analysis inputs in sync with ai-pr-risk-analysis.yml.

on:
  pull_request:
    types:
      - labeled
      - unlabeled
    branches:
      - main

jobs:
  analyze-on-auto-merge:
    name: Auto-merge label
    timeout-minutes: 10
    # No concurrency group. This job is skipped for every label except
    # auto-merge, and a skipped job must not cancel an analysis already running
    # from ai-pr-risk-analysis.yml. Adding auto-merge while that workflow is
    # in progress only happens if the label was not already present, in which
    # case the other workflow did not start an analysis.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'labeled'
      && github.event.label.name == 'auto-merge'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # https://github.com/MetaMask/ai-analyzer/releases
      - name: Checkout AI Analyzer
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: f9a82c6ae0bfdadb352b9b736d26174705fe6348
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Run AI PR Analysis
        id: analysis
        uses: ./.ai-analyzer-action
        with:
          mode: pr-risk-analysis
          add-comment: false
          add-label: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          litellm-api-key: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          # Opt-in Langfuse tracing (redacted source; host is hardcoded in the analyzer)
          langfuse-public-key: ${{ secrets.AI_ANALYZER_LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.AI_ANALYZER_LANGFUSE_SECRET_KEY }}
          # Gate override for Runway release-branch cherry-picks
          gate-override-risk-threshold: medium
          gate-override-base-pattern: '^release/'
          gate-override-author: 'runway-github[bot]'
          gate-override-title-pattern: 'cherry.?pick'

      # The open/sync workflow may already have reported Analyze as skipped on
      # this SHA. Publish a completed Analyze check so that skip is not the
      # latest result after auto-merge actually ran the analysis.
      - name: Publish Analyze check
        if: always() && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          ANALYSIS_OUTCOME: ${{ steps.analysis.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = process.env.ANALYSIS_OUTCOME === 'success' ? 'success' : 'failure';
            const completedAt = new Date();
            const startedAt = new Date(completedAt.getTime() - 1000);
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Analyze',
              head_sha: context.payload.pull_request.head.sha,
              status: 'completed',
              conclusion,
              started_at: startedAt.toISOString(),
              completed_at: completedAt.toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: conclusion === 'success'
                  ? 'AI PR risk analysis'
                  : 'AI PR risk analysis failed',
                summary: 'Ran because the auto-merge label was added. See the AI PR Analyzer / Gate check for the risk result.',
              },
            });

  clear-stale-risk-labels:
    name: Clear stale risk labels
    timeout-minutes: 5
    # Runs when main no longer has auto-merge, including the unlabeled event
    # that removed it. Also runs when an unrelated label is added to a main
    # pull request that still carries a risk:* label from an earlier analysis.
    # If an in-flight analysis adds risk:* after auto-merge was removed, that
    # labeled event reaches this job and strips the label again.
    # No concurrency group, for the same reason as the job above.
    if: >-
      github.event_name == 'pull_request'
      && !(github.event.pull_request.head.repo.fork || github.event.repository.fork)
      && github.event.pull_request.base.ref == 'main'
      && !contains(github.event.pull_request.labels.*.name, 'auto-merge')
      && (
        contains(github.event.pull_request.labels.*.name, 'risk:critical')
        || contains(github.event.pull_request.labels.*.name, 'risk:high')
        || contains(github.event.pull_request.labels.*.name, 'risk:medium')
        || contains(github.event.pull_request.labels.*.name, 'risk:low')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Remove stale risk labels
        uses: ./.github/actions/clear-stale-ai-risk-labels
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
