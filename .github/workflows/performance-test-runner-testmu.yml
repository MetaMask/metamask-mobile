name: Performance Test Runner — TestMu AI HyperExecute (Reusable)

# PoC branch variant: orchestrates performance suites via HyperExecute while
# keeping the existing Playwright + WebDriverIO Appium provider (mobile-hub).

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: 'Platform to test (android/ios)'
      build_type:
        required: true
        type: string
        description: 'Build type (imported-wallet/onboarding/mm-connect)'
      device_matrix:
        required: true
        type: string
        description: 'JSON string of device matrix'
      testmu_app_url:
        required: true
        type: string
        description: 'TestMu AI app URL (lt://...)'
      app_version:
        required: true
        type: string
        description: 'App version'
      branch_name:
        required: true
        type: string
        description: 'Branch name'
      testmu_build_name:
        required: true
        type: string
        description: 'Unified TestMu AI build name for all sessions'
      testmu_playground_url:
        required: false
        type: string
        description: 'TestMu AI URL for the RN playground APK (mm-connect tests only)'
      sentry_target:
        required: false
        type: string
        default: test
        description: 'Sentry DSN target: test or real'
      build_variant:
        required: false
        type: string
        default: e2e
        description: 'Deprecated for env; kept for workflow_call compatibility.'
      feature_flags_environment:
        required: false
        type: string
        default: rc
        description: 'client-config API environment (rc, exp, test).'
      grep_tags:
        required: false
        type: string
        default: ''
        description: 'Optional grep pattern to filter tests.'
      lt_username:
        required: true
        type: string
        description: 'TestMu AI username'
      # LT_ACCESS_KEY is a secret (passed via secrets: inherit / secrets.LT_ACCESS_KEY).
      # It cannot be a workflow_call input — secrets.* is illegal in caller `with:`.
      he_concurrency:
        required: false
        type: string
        default: '2'
        description: 'HyperExecute autosplit concurrency (default 2; set 1 if device allocation times out)'
    secrets:
      LT_ACCESS_KEY:
        required: true
      MM_TEST_ACCOUNT_SRP:
        required: true
      TEST_SRP_1:
        required: true
      TEST_SRP_2:
        required: true
      TEST_SRP_3:
        required: true
      TEST_SRP_4:
        required: true
      E2E_PASSWORD:
        required: true
      MM_SENTRY_DSN_TEST:
        required: false
      MM_SENTRY_DSN:
        required: false

jobs:
  run-tests:
    name: '[TestMu/HE] Run ${{ inputs.build_type }} on ${{ inputs.platform }} - ${{ matrix.device.name }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(inputs.device_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Test Environment
        run: |
          echo "Setting TestMu HyperExecute ${{ inputs.build_type }} environment for device: ${{ matrix.device.name }}"

          SENTRY_TARGET="${{ inputs.sentry_target }}"
          SENTRY_TEST_DSN="${{ secrets.MM_SENTRY_DSN_TEST }}"
          SENTRY_REAL_DSN="${{ secrets.MM_SENTRY_DSN }}"
          SELECTED_SENTRY_DSN=""
          SENTRY_ENVIRONMENT="github-actions-performance-e2e-testmu-he"
          FEATURE_FLAGS_ENV="${{ inputs.feature_flags_environment }}"
          TESTMU_GEO_LOCATION="${TESTMU_GEO_LOCATION:-SE}"

          if [ -z "${{ inputs.testmu_app_url }}" ]; then
            echo "❌ Error: No ${{ inputs.platform }} TestMu AI app URL available"
            exit 1
          fi

          case "$SENTRY_TARGET" in
            real)
              SELECTED_SENTRY_DSN="$SENTRY_REAL_DSN"
              SENTRY_ENVIRONMENT="github-actions-performance-e2e-testmu-he-real"
              ;;
            test)
              SELECTED_SENTRY_DSN="$SENTRY_TEST_DSN"
              ;;
            *)
              echo "❌ Invalid sentry_target '$SENTRY_TARGET'"
              exit 1
              ;;
          esac

          # Map BrowserStack matrix names → TestMu AI catalog names.
          MATRIX_DEVICE="${{ matrix.device.name }}"
          MATRIX_OS="${{ matrix.device.os_version }}"
          case "$MATRIX_DEVICE" in
            "Google Pixel 7 Pro"|"Pixel 7 Pro")
              TESTMU_DEVICE_NAME="Pixel 7 Pro"
              TESTMU_OS_VERSION="13"
              ;;
            "Google Pixel 8 Pro"|"Pixel 8 Pro")
              TESTMU_DEVICE_NAME="Pixel 8 Pro"
              TESTMU_OS_VERSION="14"
              ;;
            "Samsung Galaxy S25 Ultra"|"Galaxy S25 Ultra")
              TESTMU_DEVICE_NAME="Galaxy S25 Ultra"
              TESTMU_OS_VERSION="15"
              ;;
            *)
              TESTMU_DEVICE_NAME="$MATRIX_DEVICE"
              TESTMU_OS_VERSION="$MATRIX_OS"
              ;;
          esac
          echo "Matrix device '$MATRIX_DEVICE' ($MATRIX_OS) → TestMu '$TESTMU_DEVICE_NAME' ($TESTMU_OS_VERSION)"

          {
            echo "BUILD_TYPE=${{ inputs.build_type }}"
            echo "TESTMU_DEVICE=$TESTMU_DEVICE_NAME"
            echo "TESTMU_OS_VERSION=$TESTMU_OS_VERSION"
            echo "TESTMU_ANDROID_APP_URL=${{ inputs.testmu_app_url }}"
            echo "TESTMU_ANDROID_${{ inputs.build_type == 'onboarding' && 'CLEAN_' || '' }}APP_URL=${{ inputs.testmu_app_url }}"
            if [ -n "${{ inputs.testmu_playground_url }}" ]; then
              echo "TESTMU_RN_PLAYGROUND_URL=${{ inputs.testmu_playground_url }}"
            fi
            if [ "${{ inputs.build_type }}" = "onboarding" ]; then
              echo "TESTMU_ANDROID_ONBOARDING_PERF_APP_URL=${{ inputs.testmu_app_url }}"
              echo "TESTMU_ANDROID_CLEAN_APP_URL=${{ inputs.testmu_app_url }}"
            fi
            echo "TEST_PLATFORM=${{ inputs.platform }}"
            echo "QA_APP_VERSION=${{ inputs.app_version }}"
            echo "TESTMU_BUILD_NAME=${{ inputs.testmu_build_name }}-HyperExecute"
            echo "TESTMU_GEO_LOCATION=$TESTMU_GEO_LOCATION"
            echo "LT_USERNAME=${{ inputs.lt_username }}"
            echo "LT_ACCESS_KEY=${{ secrets.LT_ACCESS_KEY }}"
            echo "MM_TEST_ACCOUNT_SRP=${{ secrets.MM_TEST_ACCOUNT_SRP }}"
            echo "TEST_SRP_1=${{ secrets.TEST_SRP_1 }}"
            echo "TEST_SRP_2=${{ secrets.TEST_SRP_2 }}"
            echo "TEST_SRP_3=${{ secrets.TEST_SRP_3 }}"
            echo "TEST_SRP_4=${{ secrets.TEST_SRP_4 }}"
            echo "E2E_PASSWORD=${{ secrets.E2E_PASSWORD }}"
            echo "E2E_PERFORMANCE_SENTRY_DSN=$SELECTED_SENTRY_DSN"
            echo "E2E_PERFORMANCE_SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
            echo "E2E_PERFORMANCE_SENTRY_RELEASE=${{ github.sha }}"
            echo "E2E_PERFORMANCE_BUILD_VARIANT=$FEATURE_FLAGS_ENV"
            echo "E2E_PERFORMANCE_CLOUD_PROVIDER=testmu"
            echo "DISABLE_VIDEO_DOWNLOAD=true"
            echo "DISABLE_NETWORK_LOGS=true"
            echo "TESTMU_NETWORK_LOGS=true"
            echo "HE_CONCURRENCY=${{ inputs.he_concurrency || '2' }}"
            echo "TESTMU_LOCAL=${{ inputs.build_type == 'mm-connect' && 'true' || 'false' }}"
          } >> "$GITHUB_ENV"

      - name: Run Tests via HyperExecute
        id: he-run
        continue-on-error: true
        env:
          GREP_TAGS: ${{ inputs.grep_tags }}
          # Default 2 for PoC speed; set he_concurrency=1 if device allocation times out.
          HE_CONCURRENCY: ${{ inputs.he_concurrency || '2' }}
        working-directory: '.'
        run: |
          echo "=== [TestMu AI / HyperExecute] ${{ inputs.build_type }} on ${{ matrix.device.name }} (HE_CONCURRENCY=${HE_CONCURRENCY:-2}) ==="
          chmod +x ./tests/scripts/run-testmu-hyperexecute.sh
          ./tests/scripts/run-testmu-hyperexecute.sh

      - name: Resolve artifact name
        id: artifact-name
        if: always()
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_TYPE: ${{ inputs.build_type }}
          DEVICE_NAME: ${{ matrix.device.name }}
          OS_VERSION: ${{ matrix.device.os_version }}
        run: |
          sanitize() {
            printf '%s' "$1" | tr -c '[:alnum:]' '-' | sed -E 's/-+/-/g; s/^-|-$//g'
          }
          SUITE="${BUILD_TYPE/onboarding/onboarding-flow}"
          echo "name=testmu-${PLATFORM}-${SUITE}-test-results-$(sanitize "$DEVICE_NAME")-$(sanitize "$OS_VERSION")" >> "$GITHUB_OUTPUT"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          # Do NOT upload tmp/hyperexecute/ — generated YAML may be retained for
          # debugging locally, but secrets are injected via --job-secret-file
          # outside the workspace and must never ship as GHA artifacts.
          path: |
            tests/reporters/reports
            tests/test-reports/playwright-report/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7
