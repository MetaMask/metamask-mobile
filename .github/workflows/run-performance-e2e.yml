name: Build Apps and Run Performance E2E Tests
# This workflow runs performance E2E tests every 3 hours during weekdays (Monday-Friday)
# Schedule: Every 3 hours at the top of the hour (00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00)
# Days: Monday (1) through Friday (6)
on:
  schedule:
    - cron: '0 */3 * * 1-6'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      description:
        description: 'Optional description for this test run'
        required: false
        type: string
      sentry_target:
        description: 'Sentry target for performance events (test or real)'
        required: false
        type: choice
        options:
          - test
          - real
        default: test

      browserstack_app_url_android_onboarding:
        description: 'BrowserStack Android Onboarding App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_ios_onboarding:
        description: 'BrowserStack iOS Onboarding App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_android_imported_wallet:
        description: 'BrowserStack Android Imported Wallet App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_ios_imported_wallet:
        description: 'BrowserStack iOS Imported Wallet App URL (bs://...)'
        required: false
        type: string
      performance_tags:
        description: 'JSON array of performance tags (e.g. ["@PerformanceLogin","@PerformanceSwaps"]). Omit/blank = run all. "[]" = skip all (PR with no relevant changes).'
        required: false
        type: string
        default: ''
      reuse_main_builds:
        description: >-
          When true, skip fresh Android BrowserStack builds and reuse the latest
          uploaded apps from main-branch CI instead (same behavior as CI test-only PRs).
          When TestMu benchmark is enabled, also re-uploads those same main APKs to
          TestMu (lt://) instead of rebuilding. Falls back to a fresh build if no
          reusable main apps/artifacts are found. Ignored when manual
          browserstack_app_url_* inputs are provided.
        required: false
        type: boolean
        default: false
      source_fingerprint:
        description: >-
          Optional @expo/fingerprint hash. When omitted, the workflow computes and
          posts build-source-hash so Android BrowserStack dual builds can be reused
          across runs with matching native sources.
        required: false
        type: string
        default: ''
      enable_testmu_benchmark:
        description: 'Run parallel TestMu AI benchmark alongside BrowserStack (requires LT_ACCESS_KEY secret; username is fixed to javiervera)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      description:
        description: 'Optional description for this test run'
        required: false
        type: string
      sentry_target:
        description: 'Sentry target for performance events (test or real)'
        required: false
        type: string
        default: test

      browserstack_app_url_android_onboarding:
        description: 'BrowserStack Android Onboarding App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_ios_onboarding:
        description: 'BrowserStack iOS Onboarding App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_android_imported_wallet:
        description: 'BrowserStack Android Imported Wallet App URL (bs://...)'
        required: false
        type: string
      browserstack_app_url_ios_imported_wallet:
        description: 'BrowserStack iOS Imported Wallet App URL (bs://...)'
        required: false
        type: string
      branch_name:
        description: 'Branch name to use for build names (defaults to auto-detection)'
        required: false
        type: string
      source_ref:
        description: 'Exact branch, tag, or commit to use for native app builds'
        required: false
        type: string
        default: ''
      build_variant:
        description: 'BrowserStack build profile (e2e = build-e2e, works on feature branches; rc = build-rc, release branches only; exp = experimental)'
        required: false
        type: string
        default: 'e2e'
      performance_tags:
        description: 'JSON array of performance tags (e.g. ["@PerformanceLogin","@PerformanceSwaps"]). Omit/blank = run all. "[]" = skip all (PR with no relevant changes).'
        required: false
        type: string
        default: ''
      performance_tags_reasoning:
        description: 'Human-readable explanation of why performance tags were selected'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'Pull request number for posting results as a PR comment (workflow_call only)'
        required: false
        type: string
        default: ''
      reuse_main_builds:
        description: >-
          When true, skip fresh Android BrowserStack builds and reuse the latest
          uploaded apps from main-branch CI instead. When TestMu benchmark is
          enabled, also re-uploads those same main APKs to TestMu instead of rebuilding.
        required: false
        type: boolean
        default: false
      source_fingerprint:
        description: >-
          @expo/fingerprint hash from the caller (ci.yml native-build-fingerprint).
          When empty, this workflow computes and posts build-source-hash for
          Android BrowserStack APK reuse.
        required: false
        type: string
        default: ''
      enable_testmu_benchmark:
        description: 'Run parallel TestMu AI benchmark alongside BrowserStack (requires LT_ACCESS_KEY secret; username is fixed to javiervera)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write
  pull-requests: write
  statuses: write

concurrency:
  # Include build_variant so e2e, experimental (exp), and release/direct (rc) don't share the same
  # queue — avoids "Build Apps" (direct/release) and e2e/experimental runs canceling each other.
  # Note: GitHub allows at most 1 running + 1 pending per group; a 3rd run cancels the pending one.
  group: performance-e2e-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_variant || 'e2e' }}
  # Do not cancel in-progress runs; pending runs can still be replaced by a newer trigger.
  cancel-in-progress: false

env:
  BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
  BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
  MM_TEST_ACCOUNT_SRP: ${{ secrets.MM_TEST_ACCOUNT_SRP }}
  TEST_SRP_1: ${{ secrets.TEST_SRP_1 }}
  TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
  TEST_SRP_3: ${{ secrets.TEST_SRP_3 }}
  TEST_SRP_4: ${{ secrets.TEST_SRP_4 }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  DISABLE_VIDEO_DOWNLOAD: true

jobs:
  check-testmu-credentials:
    name: Resolve TestMu AI Credentials
    runs-on: ubuntu-latest
    outputs:
      testmu_ready: ${{ steps.resolve.outputs.testmu_ready }}
      lt_username: ${{ steps.resolve.outputs.lt_username }}
    steps:
      - name: Resolve TestMu AI credentials
        id: resolve
        env:
          # PoC: only one secret slot available — username is fixed, key from LT_ACCESS_KEY.
          # Do NOT put LT_ACCESS_KEY in job outputs: GitHub strips secret-valued outputs
          # ("Skip output ... since it may contain secret"), which left uploads unauthorized
          # and forced a fresh Android build fallback.
          SECRET_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          if [ -n "$SECRET_KEY" ]; then
            echo "Using fixed TestMu AI username javiervera + LT_ACCESS_KEY secret"
            {
              echo "lt_username=javiervera"
              echo "testmu_ready=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "TestMu AI credentials not available (configure LT_ACCESS_KEY secret)"
            echo "testmu_ready=false" >> "$GITHUB_OUTPUT"
          fi

  determine-branch-name:
    name: Determine Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.get-branch.outputs.branch_name }}
    steps:
      - name: Get correct branch name
        id: get-branch
        env:
          INPUT_BRANCH: ${{ inputs.branch_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Determine the correct branch name for all trigger scenarios:
          # - workflow_call (from ci.yml): uses INPUT_BRANCH (github.head_ref for PRs, github.ref_name for push)
          # - pull_request: uses HEAD_REF (source branch, e.g., "feature-branch")
          # - schedule: uses REF_NAME (typically "main")
          # - workflow_dispatch: uses INPUT_BRANCH if provided, otherwise REF_NAME
          # Priority: explicit input > PR head_ref > ref_name
          if [ -n "$INPUT_BRANCH" ]; then
            BRANCH_NAME="$INPUT_BRANCH"
            echo "Using explicit input: $BRANCH_NAME"
          elif [ "$EVENT_NAME" = "pull_request" ] && [ -n "$HEAD_REF" ]; then
            BRANCH_NAME="$HEAD_REF"
            echo "Using PR source branch: $BRANCH_NAME"
          else
            BRANCH_NAME="$REF_NAME"
            echo "Using ref_name: $BRANCH_NAME"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH_NAME"

  # Same contract as ci.yml native-build-fingerprint → build-android-e2e:
  # fingerprint must resolve for this job to succeed. Empty fingerprint disables
  # reuse inside build-android-upload-to-browserstack (resolve job is skipped) but
  # the dual Gradle path still runs. Download-miss fallback lives in that workflow,
  # matching build-android-e2e.yml's continue-on-error + native-build gate.
  ensure-fingerprint:
    name: Ensure native build fingerprint
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
    steps:
      - name: Use caller-provided fingerprint
        id: provided
        if: ${{ inputs.source_fingerprint }}
        env:
          SOURCE_FINGERPRINT: ${{ inputs.source_fingerprint }}
        run: |
          echo "fingerprint=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Using caller-provided fingerprint: $SOURCE_FINGERPRINT"

      - name: Checkout
        if: ${{ !inputs.source_fingerprint }}
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: ${{ !inputs.source_fingerprint }}
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install Yarn dependencies with retry
        if: ${{ !inputs.source_fingerprint }}
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 #v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: yarn install --immutable

      - name: Compute and post build-source-hash
        id: computed
        if: ${{ !inputs.source_fingerprint }}
        uses: ./.github/actions/post-build-source-hash
        with:
          github-token: ${{ github.token }}
          post-status: 'true'
          target-sha: ${{ github.sha }}

      - name: Resolve fingerprint output
        id: resolve
        env:
          PROVIDED: ${{ steps.provided.outputs.fingerprint }}
          COMPUTED: ${{ steps.computed.outputs.fingerprint }}
        run: |
          if [ -n "$PROVIDED" ]; then
            echo "fingerprint=$PROVIDED" >> "$GITHUB_OUTPUT"
          elif [ -n "$COMPUTED" ]; then
            echo "fingerprint=$COMPUTED" >> "$GITHUB_OUTPUT"
          else
            echo "❌ No fingerprint available" >&2
            exit 1
          fi
          echo "Resolved fingerprint: $(grep fingerprint= "$GITHUB_OUTPUT" | tail -1)"

  read-device-matrix:
    name: Read Device Matrix
    runs-on: ubuntu-latest
    needs: [determine-branch-name]
    outputs:
      android_matrix: ${{ steps.read-matrix.outputs.android_matrix }}
      ios_matrix: ${{ steps.read-matrix.outputs.ios_matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Devices
        id: read-matrix
        env:
          BRANCH_NAME: ${{ needs.determine-branch-name.outputs.branch_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          FILE="tests/performance/device-matrix.json"

          # TestMu PoC: one logical Pixel device only (no Galaxy, no duplicate Pixel aliases).
          # Matrix keeps BrowserStack catalog name "Google Pixel 7 Pro" / 13; TestMu runner/resolver
          # maps it to TestMu catalog name "Pixel 7 Pro" / 13 for session capabilities.
          ANDROID_MATRIX=$(jq '[.android_devices[] | select(.name == "Google Pixel 7 Pro")]' "$FILE")
          IOS_MATRIX='[]'
          echo "PoC mode: Google Pixel 7 Pro only (event: ${{ github.event_name }}, branch: $BRANCH_NAME, PR: ${PR_NUMBER:-none})"

          {
            echo "android_matrix<<EOF"
            echo "$ANDROID_MATRIX"
            echo "EOF"
            echo "ios_matrix<<EOF"
            echo "$IOS_MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Selected: $(echo "$ANDROID_MATRIX" | jq length) Android, $(echo "$IOS_MATRIX" | jq length) iOS"

  set-build-names:
    name: Set Unified BrowserStack Build Names
    runs-on: ubuntu-latest
    needs: [determine-branch-name]
    outputs:
      android_build_name: ${{ steps.set-builds.outputs.android_build_name }}
      ios_build_name: ${{ steps.set-builds.outputs.ios_build_name }}
      testmu_android_build_name: ${{ steps.set-builds.outputs.testmu_android_build_name }}
      testmu_ios_build_name: ${{ steps.set-builds.outputs.testmu_ios_build_name }}
    steps:
      - name: Set unified build names
        id: set-builds
        run: |
          BRANCH_NAME="${{ needs.determine-branch-name.outputs.branch_name }}"
          echo "android_build_name=Android-Performance-$BRANCH_NAME-Branch" >> "$GITHUB_OUTPUT"
          echo "ios_build_name=iOS-Performance-$BRANCH_NAME-Branch" >> "$GITHUB_OUTPUT"
          echo "testmu_android_build_name=TestMu-Android-Performance-$BRANCH_NAME-Branch" >> "$GITHUB_OUTPUT"
          echo "testmu_ios_build_name=TestMu-iOS-Performance-$BRANCH_NAME-Branch" >> "$GITHUB_OUTPUT"
          echo "Set unified build names:"
          echo "  Android: Android-Performance-$BRANCH_NAME-Branch"
          echo "  iOS: iOS-Performance-$BRANCH_NAME-Branch"

  compute-test-selection:
    name: Compute Performance Test Selection
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.map.outputs.run_tests }}
      grep_pattern: ${{ steps.map.outputs.grep_pattern }}
    steps:
      - name: Map performance tags to grep pattern
        id: map
        env:
          PERF_REASONING: ${{ inputs.performance_tags_reasoning }}
        run: |
          TAGS='${{ inputs.performance_tags }}'
          REASONING="$PERF_REASONING"

          # No input (blank) → schedule/dispatch: run all tests with no grep filter
          if [[ -z "$TAGS" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "grep_pattern="  >> "$GITHUB_OUTPUT"
            echo "▶️  Running all performance tests (schedule/dispatch mode — no tag filter)"
            exit 0
          fi

          # '[]' → PR with no performance-relevant changes: skip all tests
          if [[ "$TAGS" == "[]" ]]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "grep_pattern="   >> "$GITHUB_OUTPUT"
            echo "⏭️  Skipping performance tests — no performance-relevant changes detected in this PR"
            if [[ -n "$REASONING" ]]; then
              echo "   Reasoning: $REASONING"
            fi
            exit 0
          fi

          # Build OR-pattern for playwright --grep (e.g. "@PerformanceSwaps|@PerformanceLogin")
          # Playwright matches against the full test name (describe + test title), so each tag
          # selects only the individual tests that use it in their describe block.
          GREP=$(echo "$TAGS" | jq -r 'join("|")')

          echo "run_tests=true"      >> "$GITHUB_OUTPUT"
          echo "grep_pattern=$GREP"  >> "$GITHUB_OUTPUT"

          echo "⚡ Performance test selection:"
          echo "   Tags: $TAGS"
          echo "   Grep pattern: $GREP"
          if [[ -n "$REASONING" ]]; then
            echo "   Reasoning: $REASONING"
          fi

  resolve-main-browserstack-urls:
    name: Resolve main-branch BrowserStack Android apps
    runs-on: ubuntu-latest
    if: >-
      inputs.reuse_main_builds &&
      !inputs.browserstack_app_url_android_onboarding &&
      !inputs.browserstack_app_url_android_imported_wallet
    outputs:
      found: ${{ steps.resolve.outputs.found }}
      with-srp-browserstack-url: ${{ steps.resolve.outputs.with-srp-browserstack-url }}
      without-srp-browserstack-url: ${{ steps.resolve.outputs.without-srp-browserstack-url }}
      with-srp-version: ${{ steps.resolve.outputs.with-srp-version }}
      without-srp-version: ${{ steps.resolve.outputs.without-srp-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/resolve-main-browserstack-apps.cjs
            .github/scripts/browserstack-app-validation.cjs
          sparse-checkout-cone-mode: false

      - name: Resolve latest main BrowserStack apps
        id: resolve
        run: node .github/scripts/resolve-main-browserstack-apps.cjs
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

  # When BrowserStack apps are reused from main, re-upload the same APKs to TestMu
  # (lt://) instead of compiling again. Falls back to a fresh dual build if this
  # job is skipped or cannot find/upload the artifacts.
  upload-reused-apks-to-testmu:
    name: Re-upload main APKs to TestMu AI
    runs-on: ubuntu-latest
    needs: [resolve-main-browserstack-urls, check-testmu-credentials]
    if: >-
      always() &&
      !cancelled() &&
      inputs.enable_testmu_benchmark != false &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      needs.resolve-main-browserstack-urls.result == 'success' &&
      needs.resolve-main-browserstack-urls.outputs.found == 'true'
    outputs:
      found: ${{ steps.upload.outputs.found }}
      with-srp-testmu-url: ${{ steps.upload.outputs.with-srp-testmu-url }}
      without-srp-testmu-url: ${{ steps.upload.outputs.without-srp-testmu-url }}
      with-srp-version: ${{ steps.upload.outputs.with-srp-version }}
      without-srp-version: ${{ steps.upload.outputs.without-srp-version }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/find-main-performance-apk-run.cjs
            tests/scripts/verify-testmu-app-url.sh
          sparse-checkout-cone-mode: false

      - name: Resolve APK artifact names
        id: names
        run: |
          VARIANT="${{ inputs.build_variant || 'e2e' }}"
          if [ "$VARIANT" = "exp" ]; then
            echo "with_srp=android-apk-main-exp-with-srp" >> "$GITHUB_OUTPUT"
            echo "without_srp=android-apk-main-exp-without-srp" >> "$GITHUB_OUTPUT"
          elif [ "$VARIANT" = "rc" ]; then
            echo "with_srp=android-apk-main-rc-with-srp" >> "$GITHUB_OUTPUT"
            echo "without_srp=android-apk-main-rc-without-srp" >> "$GITHUB_OUTPUT"
          else
            echo "with_srp=android-apk-main-e2e-bs-with-srp" >> "$GITHUB_OUTPUT"
            echo "without_srp=android-apk-main-e2e-bs-without-srp" >> "$GITHUB_OUTPUT"
          fi

      - name: Find main performance run with APK artifacts
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WITH_SRP_ARTIFACT: ${{ steps.names.outputs.with_srp }}
          WITHOUT_SRP_ARTIFACT: ${{ steps.names.outputs.without_srp }}
          WORKFLOW_FILE: run-performance-e2e.yml
          BRANCH: main
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: node .github/scripts/find-main-performance-apk-run.cjs

      - name: Download with-SRP APK from main run
        if: steps.find.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.names.outputs.with_srp }}
          path: artifacts/with-srp
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find.outputs.run_id }}

      - name: Download without-SRP APK from main run
        if: steps.find.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.names.outputs.without_srp }}
          path: artifacts/without-srp
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.find.outputs.run_id }}

      - name: Upload reused APKs to TestMu AI
        id: upload
        env:
          LT_USERNAME: ${{ needs.check-testmu-credentials.outputs.lt_username }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
          FIND_FOUND: ${{ steps.find.outputs.found }}
          SOURCE_RUN_ID: ${{ steps.find.outputs.run_id }}
        run: |
          set +e
          if [ "$FIND_FOUND" != "true" ]; then
            echo "No reusable main APK artifacts found — TestMu will fall back to a fresh build."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Re-uploading APKs from main performance run $SOURCE_RUN_ID to TestMu AI..."
          chmod +x tests/scripts/verify-testmu-app-url.sh

          WITH_SRP_APK=$(find artifacts/with-srp -name "*.apk" | head -1)
          WITHOUT_SRP_APK=$(find artifacts/without-srp -name "*.apk" | head -1)
          WITH_SRP_APP_URL=""
          WITHOUT_SRP_APP_URL=""

          # visibility=team: HyperExecute workers resolve org-scoped storage;
          # individual uploads can return lt:// that later fail with
          # "no valid app URL found" on the HE hub.
          if [ -n "$WITH_SRP_APK" ]; then
            echo "Uploading with-SRP APK: $WITH_SRP_APK"
            WITH_SRP_RESPONSE=$(curl -u "$LT_USERNAME:$LT_ACCESS_KEY" \
              -X POST "https://manual-api.lambdatest.com/app/upload/realDevice" \
              -F "appFile=@$WITH_SRP_APK" \
              -F "name=MetaMask-Android-With-SRP-Reuse-${{ github.run_id }}" \
              -F "visibility=team" \
              -F "custom_id=mm-android-with-srp-reuse-${{ github.run_id }}")
            WITH_SRP_APP_URL=$(echo "$WITH_SRP_RESPONSE" | jq -r '.app_url // .appUrl // empty')
            if [ -n "$WITH_SRP_APP_URL" ]; then
              echo "✅ With-SRP uploaded to TestMu: $WITH_SRP_APP_URL"
              if ! LT_USERNAME="$LT_USERNAME" LT_ACCESS_KEY="$LT_ACCESS_KEY" \
                ./tests/scripts/verify-testmu-app-url.sh "$WITH_SRP_APP_URL"; then
                echo "❌ With-SRP app URL not resolvable in TestMu storage after upload"
                WITH_SRP_APP_URL=""
              fi
            else
              echo "❌ With-SRP TestMu upload failed: $WITH_SRP_RESPONSE"
            fi
          else
            echo "❌ With-SRP APK missing after download"
          fi

          if [ -n "$WITHOUT_SRP_APK" ]; then
            echo "Uploading without-SRP APK: $WITHOUT_SRP_APK"
            WITHOUT_SRP_RESPONSE=$(curl -u "$LT_USERNAME:$LT_ACCESS_KEY" \
              -X POST "https://manual-api.lambdatest.com/app/upload/realDevice" \
              -F "appFile=@$WITHOUT_SRP_APK" \
              -F "name=MetaMask-Android-Without-SRP-Reuse-${{ github.run_id }}" \
              -F "visibility=team" \
              -F "custom_id=mm-android-without-srp-reuse-${{ github.run_id }}")
            WITHOUT_SRP_APP_URL=$(echo "$WITHOUT_SRP_RESPONSE" | jq -r '.app_url // .appUrl // empty')
            if [ -n "$WITHOUT_SRP_APP_URL" ]; then
              echo "✅ Without-SRP uploaded to TestMu: $WITHOUT_SRP_APP_URL"
              if ! LT_USERNAME="$LT_USERNAME" LT_ACCESS_KEY="$LT_ACCESS_KEY" \
                ./tests/scripts/verify-testmu-app-url.sh "$WITHOUT_SRP_APP_URL"; then
                echo "❌ Without-SRP app URL not resolvable in TestMu storage after upload"
                WITHOUT_SRP_APP_URL=""
              fi
            else
              echo "❌ Without-SRP TestMu upload failed: $WITHOUT_SRP_RESPONSE"
            fi
          else
            echo "❌ Without-SRP APK missing after download"
          fi

          if [ -n "$WITH_SRP_APP_URL" ] && [ -n "$WITHOUT_SRP_APP_URL" ]; then
            {
              echo "found=true"
              echo "with-srp-testmu-url=$WITH_SRP_APP_URL"
              echo "without-srp-testmu-url=$WITHOUT_SRP_APP_URL"
              echo "with-srp-version=main-reuse"
              echo "without-srp-version=main-reuse"
            } >> "$GITHUB_OUTPUT"
            echo "TestMu reuse upload succeeded — skipping fresh Android dual build for TestMu."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "TestMu reuse upload incomplete — CI will fall back to a fresh dual build."
          fi

  trigger-android-dual-versions:
    name: Trigger Android Dual Versions and Extract BrowserStack URLs
    uses: ./.github/workflows/build-android-upload-to-browserstack.yml
    needs:
      [
        determine-branch-name,
        resolve-main-browserstack-urls,
        ensure-fingerprint,
        check-testmu-credentials,
        upload-reused-apks-to-testmu,
      ]
    # Build/upload when BrowserStack apps are needed (not reusing main / reuse miss),
    # or when TestMu still needs lt:// URLs and the reuse→TestMu re-upload did not succeed.
    if: >-
      always() &&
      !cancelled() &&
      (needs.resolve-main-browserstack-urls.result == 'skipped' || needs.resolve-main-browserstack-urls.result == 'success') &&
      needs.ensure-fingerprint.result == 'success' &&
      (needs.upload-reused-apks-to-testmu.result == 'skipped' || needs.upload-reused-apks-to-testmu.result == 'success') &&
      (
          !inputs.browserstack_app_url_android_onboarding &&
          !inputs.browserstack_app_url_android_imported_wallet &&
          (
            !inputs.reuse_main_builds ||
            needs.resolve-main-browserstack-urls.outputs.found != 'true'
          )
        ||
        (
          inputs.enable_testmu_benchmark != false &&
          needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
          needs.upload-reused-apks-to-testmu.outputs.found != 'true'
        )
      )
    with:
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      source_ref: ${{ inputs.source_ref || needs.determine-branch-name.outputs.branch_name }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      source_fingerprint: ${{ needs.ensure-fingerprint.outputs.fingerprint }}
      main_branch_only: ${{ inputs.reuse_main_builds }}
      lt_username: ${{ needs.check-testmu-credentials.outputs.lt_username }}
      # LT_ACCESS_KEY must travel via secrets: inherit — secrets.* is illegal in reusable-workflow `with:`
    secrets: inherit

  trigger-ios-dual-versions:
    name: Trigger iOS Dual Versions and Extract BrowserStack URLs
    uses: ./.github/workflows/build-ios-upload-to-browserstack.yml
    needs: [determine-branch-name]
    if: false # temporarily disabled — iOS tests not yet active
    # if: (!inputs.browserstack_app_url_ios_onboarding && !inputs.browserstack_app_url_ios_imported_wallet)
    with:
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
    secrets: inherit

  # =============================================================================
  # PHASE 1: ONBOARDING TESTS (Run First)
  # =============================================================================

  run-android-onboarding-tests:
    name: Performance Test Android (Onboarding)
    uses: ./.github/workflows/performance-test-runner.yml
    needs:
      [
        read-device-matrix,
        trigger-android-dual-versions,
        resolve-main-browserstack-urls,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
      ]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.compute-test-selection.outputs.run_tests == 'true' &&
      (
        needs.trigger-android-dual-versions.result == 'skipped' ||
        needs.trigger-android-dual-versions.result == 'success'
      ) &&
      (
        needs.resolve-main-browserstack-urls.result == 'skipped' ||
        needs.resolve-main-browserstack-urls.result == 'success'
      ) &&
      (
        inputs.browserstack_app_url_android_onboarding != '' ||
        needs.trigger-android-dual-versions.outputs.without-srp-browserstack-url != '' ||
        needs.resolve-main-browserstack-urls.outputs.without-srp-browserstack-url != ''
      )
    with:
      platform: android
      build_type: onboarding
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.android_matrix }}
      # Prefer an explicitly supplied or freshly uploaded app. Reused main
      # URLs are only a fallback; otherwise onboarding can receive a stale
      # with-SRP/without-SRP app from the main build.
      browserstack_app_url: ${{ inputs.browserstack_app_url_android_onboarding || needs.trigger-android-dual-versions.outputs.without-srp-browserstack-url || needs.resolve-main-browserstack-urls.outputs.without-srp-browserstack-url }}
      app_version: ${{ needs.trigger-android-dual-versions.outputs.without-srp-version || needs.resolve-main-browserstack-urls.outputs.without-srp-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      browserstack_build_name: ${{ needs.set-build-names.outputs.android_build_name }}
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  # =============================================================================
  # TESTMU AI BENCHMARK (parallel to BrowserStack — same tests, different provider)
  # =============================================================================

  run-android-onboarding-tests-testmu:
    name: '[TestMu] Run Android Onboarding Tests'
    uses: ./.github/workflows/performance-test-runner-testmu.yml
    needs:
      [
        read-device-matrix,
        trigger-android-dual-versions,
        upload-reused-apks-to-testmu,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
        check-testmu-credentials,
      ]
    if: >-
      always() && !failure() && !cancelled() &&
      inputs.enable_testmu_benchmark != false &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      needs.compute-test-selection.outputs.run_tests == 'true' &&
      (needs.trigger-android-dual-versions.result == 'skipped' || needs.trigger-android-dual-versions.result == 'success') &&
      (needs.upload-reused-apks-to-testmu.result == 'skipped' || needs.upload-reused-apks-to-testmu.result == 'success') &&
      (
        needs.upload-reused-apks-to-testmu.outputs.without-srp-testmu-url != '' ||
        needs.trigger-android-dual-versions.outputs.without-srp-testmu-url != ''
      )
    with:
      platform: android
      build_type: onboarding
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.android_matrix }}
      testmu_app_url: ${{ needs.upload-reused-apks-to-testmu.outputs.without-srp-testmu-url || needs.trigger-android-dual-versions.outputs.without-srp-testmu-url }}
      app_version: ${{ needs.upload-reused-apks-to-testmu.outputs.without-srp-version || needs.trigger-android-dual-versions.outputs.without-srp-testmu-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      testmu_build_name: ${{ needs.set-build-names.outputs.testmu_android_build_name }}
      lt_username: ${{ needs.check-testmu-credentials.outputs.lt_username }}
      # LT_ACCESS_KEY via secrets: inherit (secrets.* illegal in reusable-workflow `with:`)
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  run-android-onboarding-tests-testmu-standard:
    name: '[TestMu Standard] Run Android Onboarding Tests'
    uses: ./.github/workflows/performance-test-runner-testmu-standard.yml
    needs:
      [
        read-device-matrix,
        trigger-android-dual-versions,
        upload-reused-apks-to-testmu,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
        check-testmu-credentials,
      ]
    if: >-
      always() && !failure() && !cancelled() &&
      inputs.enable_testmu_benchmark != false &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      needs.compute-test-selection.outputs.run_tests == 'true' &&
      (needs.trigger-android-dual-versions.result == 'skipped' || needs.trigger-android-dual-versions.result == 'success') &&
      (needs.upload-reused-apks-to-testmu.result == 'skipped' || needs.upload-reused-apks-to-testmu.result == 'success') &&
      (
        needs.upload-reused-apks-to-testmu.outputs.without-srp-testmu-url != '' ||
        needs.trigger-android-dual-versions.outputs.without-srp-testmu-url != ''
      )
    with:
      platform: android
      build_type: onboarding
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.android_matrix }}
      testmu_app_url: ${{ needs.upload-reused-apks-to-testmu.outputs.without-srp-testmu-url || needs.trigger-android-dual-versions.outputs.without-srp-testmu-url }}
      app_version: ${{ needs.upload-reused-apks-to-testmu.outputs.without-srp-version || needs.trigger-android-dual-versions.outputs.without-srp-testmu-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      testmu_build_name: ${{ needs.set-build-names.outputs.testmu_android_build_name }}-Standard
      lt_username: ${{ needs.check-testmu-credentials.outputs.lt_username }}
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  run-ios-onboarding-tests:
    name: Performance Test iOS (Onboarding)
    uses: ./.github/workflows/performance-test-runner.yml
    needs:
      [
        read-device-matrix,
        trigger-ios-dual-versions,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
      ]
    if: always() && !failure() && !cancelled() && needs.compute-test-selection.outputs.run_tests == 'true' && (needs.trigger-ios-dual-versions.result == 'skipped' || needs.trigger-ios-dual-versions.result == 'success') && (inputs.browserstack_app_url_ios_onboarding != '' || needs.trigger-ios-dual-versions.outputs.without-srp-browserstack-url != '')
    with:
      platform: ios
      build_type: onboarding
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.ios_matrix }}
      browserstack_app_url: ${{ needs.trigger-ios-dual-versions.outputs.without-srp-browserstack-url || inputs.browserstack_app_url_ios_onboarding }}
      app_version: ${{ needs.trigger-ios-dual-versions.outputs.without-srp-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      browserstack_build_name: ${{ needs.set-build-names.outputs.ios_build_name }}
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  # =============================================================================
  # PHASE 2: IMPORTED WALLET TESTS (Run After Onboarding Complete)
  # =============================================================================

  wait-for-onboarding-completion:
    name: Wait for Onboarding Completion
    runs-on: ubuntu-latest
    needs:
      [
        run-android-onboarding-tests,
        run-ios-onboarding-tests,
        run-android-onboarding-tests-testmu,
        run-android-onboarding-tests-testmu-standard,
      ]
    if: always()
    steps:
      - name: Wait for onboarding tests to complete
        run: |
          echo "Onboarding tests have completed (success or failure)"
          echo "Proceeding with imported wallet tests..."

  run-android-imported-wallet-tests:
    name: Performance Test Android (Imported Wallet)
    uses: ./.github/workflows/performance-test-runner.yml
    needs:
      [
        read-device-matrix,
        trigger-android-dual-versions,
        resolve-main-browserstack-urls,
        wait-for-onboarding-completion,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
      ]
    if: >-
      always() && !cancelled() &&
      needs.compute-test-selection.outputs.run_tests == 'true' &&
      (
        needs.trigger-android-dual-versions.result == 'skipped' ||
        needs.trigger-android-dual-versions.result == 'success'
      ) &&
      (
        needs.resolve-main-browserstack-urls.result == 'skipped' ||
        needs.resolve-main-browserstack-urls.result == 'success'
      ) &&
      (
        inputs.browserstack_app_url_android_imported_wallet != '' ||
        needs.trigger-android-dual-versions.outputs.with-srp-browserstack-url != '' ||
        needs.resolve-main-browserstack-urls.outputs.with-srp-browserstack-url != ''
      )
    with:
      platform: android
      build_type: imported-wallet
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.android_matrix }}
      browserstack_app_url: ${{ inputs.browserstack_app_url_android_imported_wallet || needs.trigger-android-dual-versions.outputs.with-srp-browserstack-url || needs.resolve-main-browserstack-urls.outputs.with-srp-browserstack-url }}
      app_version: ${{ needs.trigger-android-dual-versions.outputs.with-srp-version || needs.resolve-main-browserstack-urls.outputs.with-srp-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      browserstack_build_name: ${{ needs.set-build-names.outputs.android_build_name }}
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  run-ios-imported-wallet-tests:
    name: Performance Test iOS (Imported Wallet)
    uses: ./.github/workflows/performance-test-runner.yml
    needs:
      [
        read-device-matrix,
        trigger-ios-dual-versions,
        wait-for-onboarding-completion,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
      ]
    if: always() && !cancelled() && needs.compute-test-selection.outputs.run_tests == 'true' && (needs.trigger-ios-dual-versions.result == 'skipped' || needs.trigger-ios-dual-versions.result == 'success') && (inputs.browserstack_app_url_ios_imported_wallet != '' || needs.trigger-ios-dual-versions.outputs.with-srp-browserstack-url != '')
    with:
      platform: ios
      build_type: imported-wallet
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.ios_matrix }}
      browserstack_app_url: ${{ needs.trigger-ios-dual-versions.outputs.with-srp-browserstack-url || inputs.browserstack_app_url_ios_imported_wallet }}
      app_version: ${{ needs.trigger-ios-dual-versions.outputs.with-srp-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      browserstack_build_name: ${{ needs.set-build-names.outputs.ios_build_name }}
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  run-android-imported-wallet-tests-testmu:
    name: '[TestMu] Run Android Imported Wallet Tests'
    uses: ./.github/workflows/performance-test-runner-testmu.yml
    needs:
      [
        read-device-matrix,
        trigger-android-dual-versions,
        upload-reused-apks-to-testmu,
        wait-for-onboarding-completion,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
        check-testmu-credentials,
      ]
    if: >-
      always() && !cancelled() &&
      inputs.enable_testmu_benchmark != false &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      needs.compute-test-selection.outputs.run_tests == 'true' &&
      (needs.trigger-android-dual-versions.result == 'skipped' || needs.trigger-android-dual-versions.result == 'success') &&
      (needs.upload-reused-apks-to-testmu.result == 'skipped' || needs.upload-reused-apks-to-testmu.result == 'success') &&
      (
        needs.upload-reused-apks-to-testmu.outputs.with-srp-testmu-url != '' ||
        needs.trigger-android-dual-versions.outputs.with-srp-testmu-url != ''
      )
    with:
      platform: android
      build_type: imported-wallet
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.android_matrix }}
      testmu_app_url: ${{ needs.upload-reused-apks-to-testmu.outputs.with-srp-testmu-url || needs.trigger-android-dual-versions.outputs.with-srp-testmu-url }}
      app_version: ${{ needs.upload-reused-apks-to-testmu.outputs.with-srp-version || needs.trigger-android-dual-versions.outputs.with-srp-testmu-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      testmu_build_name: ${{ needs.set-build-names.outputs.testmu_android_build_name }}
      lt_username: ${{ needs.check-testmu-credentials.outputs.lt_username }}
      # LT_ACCESS_KEY via secrets: inherit (secrets.* illegal in reusable-workflow `with:`)
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  run-android-imported-wallet-tests-testmu-standard:
    name: '[TestMu Standard] Run Android Imported Wallet Tests'
    uses: ./.github/workflows/performance-test-runner-testmu-standard.yml
    needs:
      [
        read-device-matrix,
        trigger-android-dual-versions,
        upload-reused-apks-to-testmu,
        wait-for-onboarding-completion,
        set-build-names,
        determine-branch-name,
        compute-test-selection,
        check-testmu-credentials,
      ]
    if: >-
      always() && !cancelled() &&
      inputs.enable_testmu_benchmark != false &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      needs.compute-test-selection.outputs.run_tests == 'true' &&
      (needs.trigger-android-dual-versions.result == 'skipped' || needs.trigger-android-dual-versions.result == 'success') &&
      (needs.upload-reused-apks-to-testmu.result == 'skipped' || needs.upload-reused-apks-to-testmu.result == 'success') &&
      (
        needs.upload-reused-apks-to-testmu.outputs.with-srp-testmu-url != '' ||
        needs.trigger-android-dual-versions.outputs.with-srp-testmu-url != ''
      )
    with:
      platform: android
      build_type: imported-wallet
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      device_matrix: ${{ needs.read-device-matrix.outputs.android_matrix }}
      testmu_app_url: ${{ needs.upload-reused-apks-to-testmu.outputs.with-srp-testmu-url || needs.trigger-android-dual-versions.outputs.with-srp-testmu-url }}
      app_version: ${{ needs.upload-reused-apks-to-testmu.outputs.with-srp-version || needs.trigger-android-dual-versions.outputs.with-srp-testmu-version || 'Manual-Input' }}
      branch_name: ${{ needs.determine-branch-name.outputs.branch_name }}
      testmu_build_name: ${{ needs.set-build-names.outputs.testmu_android_build_name }}-Standard
      lt_username: ${{ needs.check-testmu-credentials.outputs.lt_username }}
      grep_tags: ${{ needs.compute-test-selection.outputs.grep_pattern }}
    secrets: inherit

  aggregate-results:
    name: Aggregate All Test Results
    runs-on: ubuntu-latest
    needs:
      [
        run-android-imported-wallet-tests,
        run-android-onboarding-tests,
        run-ios-imported-wallet-tests,
        run-ios-onboarding-tests,
        run-android-onboarding-tests-testmu,
        run-android-onboarding-tests-testmu-standard,
        run-android-imported-wallet-tests-testmu,
        run-android-imported-wallet-tests-testmu-standard,
        wait-for-onboarding-completion,
        determine-branch-name,
      ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Test Results
        uses: actions/download-artifact@v4
        with:
          pattern: '*-test-results-*'
          path: ./test-results
          merge-multiple: false

      - name: Run aggregation script
        env:
          BRANCH_NAME: ${{ needs.determine-branch-name.outputs.branch_name }}
          BUILD_VARIANT: ${{ inputs.build_variant || 'e2e' }}
        run: |
          echo "Processing all test results..."
          echo "Running aggregation script..."
          node tests/scripts/aggregate-performance-reports.mjs
          echo "Aggregation completed"

      - name: Upload Final Combined Results
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-reports
          path: |
            tests/aggregated-reports/
          if-no-files-found: ignore
          retention-days: 30

  post-pr-comment:
    name: Post Performance Results to PR
    runs-on: ubuntu-latest
    needs: [aggregate-results, determine-branch-name]
    # Only runs when triggered from a PR via workflow_call with a pr_number
    if: always() && !cancelled() && inputs.pr_number != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Aggregated Results
        uses: actions/download-artifact@v4
        with:
          name: aggregated-reports
          path: ./aggregated-reports
        continue-on-error: true

      - name: Generate PR comment markdown
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node tests/scripts/generate-performance-pr-comment.mjs \
            aggregated-reports/summary.json \
            performance-pr-comment.md

      - name: Delete previous performance / app-profiling comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ALL_COMMENT_IDS=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ inputs.pr_number }}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- perf-test-results -->") or contains("<!-- app-profiling-check -->")) | .id')

          if [ -n "$ALL_COMMENT_IDS" ]; then
            echo "$ALL_COMMENT_IDS" | while read -r COMMENT_ID; do
              if [ -n "$COMMENT_ID" ]; then
                gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                  --method DELETE > /dev/null 2>&1 || true
              fi
            done
            echo "Deleted previous performance / app-profiling comments"
          fi

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MARKER="<!-- perf-test-results -->"
          COMMENT=$(cat performance-pr-comment.md 2>/dev/null || echo "⚠️ Performance test results are not available.")
          FULL_COMMENT="${COMMENT}"$'\n'"${MARKER}"
          gh pr comment "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --body "$FULL_COMMENT"
          echo "Performance results posted to PR #${{ inputs.pr_number }}"

  slack-notification:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    needs:
      [
        run-android-imported-wallet-tests,
        run-android-onboarding-tests,
        run-ios-imported-wallet-tests,
        run-ios-onboarding-tests,
        run-android-onboarding-tests-testmu,
        run-android-imported-wallet-tests-testmu,
        aggregate-results,
        determine-branch-name,
      ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Aggregated Results
        uses: actions/download-artifact@v4
        with:
          name: aggregated-reports
          path: ./aggregated-reports

      - name: Generate Test Summary
        id: summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ needs.determine-branch-name.outputs.branch_name }}
        run: |
          {
            echo "summary<<EOF"
            ./tests/scripts/generate-slack-summary.sh aggregated-reports/summary.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          webhook: ${{ secrets.PERFORMANCE_E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.summary.outputs.summary }}"
            }
