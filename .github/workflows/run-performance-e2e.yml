name: Run Performance E2E Tests

on:
  workflow_call:
    inputs:
      sentry_target:
        description: 'Sentry target for performance events (test or real)'
        required: false
        type: string
        default: test

      branch_name:
        description: 'Branch name used for build names and reports'
        required: true
        type: string
      source_ref:
        description: 'Exact branch, tag, or commit to use for native app builds'
        required: true
        type: string
      build_variant:
        description: 'App build profile (e2e = standard E2E, exp = experimental, rc = release candidate)'
        required: false
        type: string
        default: 'e2e'
      performance_tags:
        description: 'JSON array of performance tags (e.g. ["@PerformanceLogin","@PerformanceSwaps"]). ["ALL"] runs all. [] runs none. On a PR, a blank value runs none. Schedule and manual runs treat blank as run all.'
        required: false
        type: string
        default: ''
      performance_tags_reasoning:
        description: 'Human-readable explanation of why performance tags were selected'
        required: false
        type: string
        default: ''
      pr_number:
        description: 'Pull request number for posting results as a PR comment (workflow_call only)'
        required: false
        type: string
        default: ''
      reuse_main_builds:
        description: >-
          For e2e builds only, use for test-only changes. Reuses main-branch
          Android APKs when available without JS repacking, then falls back to
          a fresh build. Leave false for app changes, which use fingerprint
          reuse with JS repacking.
        required: false
        type: boolean
        default: false
      source_fingerprint:
        description: >-
          @expo/fingerprint hash from the caller (ci.yml native-build-fingerprint).
          When empty, this workflow computes and posts build-source-hash for
          Android performance APK reuse.
        required: false
        type: string
        default: ''
      testmu_app_url_android_onboarding:
        description: 'TestMu AI Android onboarding app URL (lt://...). Optional when APKs are uploaded from the build job.'
        required: false
        type: string
        default: ''
      testmu_app_url_android_imported_wallet:
        description: 'TestMu AI Android imported-wallet app URL (lt://...). Optional when APKs are uploaded from the build job.'
        required: false
        type: string
        default: ''
      testmu_project_name:
        description: 'TestMu AI project name. Empty keeps the provider default.'
        required: false
        type: string
        default: ''
      testmu_build_name:
        description: 'TestMu AI build name before the HyperExecute suffix. Empty uses the branch-based name.'
        required: false
        type: string
        default: ''
      he_concurrency:
        description: 'HyperExecute autosplit concurrency for the TestMu lane'
        required: false
        type: string
        default: '2'
      collect_hermes_cpuprofiles:
        description: >-
          Harvest Hermes .cpuprofile artifacts for analyze-app-profiling.
          True for schedule/manual; false (default) for PR runs.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  actions: write
  pull-requests: write
  statuses: write

env:
  MM_TEST_ACCOUNT_SRP: ${{ secrets.MM_TEST_ACCOUNT_SRP }}
  TEST_SRP_1: ${{ secrets.TEST_SRP_1 }}
  TEST_SRP_2: ${{ secrets.TEST_SRP_2 }}
  TEST_SRP_3: ${{ secrets.TEST_SRP_3 }}
  TEST_SRP_4: ${{ secrets.TEST_SRP_4 }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
  DISABLE_VIDEO_DOWNLOAD: true

jobs:
  prepare:
    name: Prepare Performance E2E
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.resolve-fingerprint.outputs.fingerprint }}
      android_matrix: ${{ steps.read-matrix.outputs.android_matrix }}
      run_tests: ${{ steps.select-tests.outputs.run_tests }}
      grep_pattern: ${{ steps.select-tests.outputs.grep_pattern }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Map performance tags to grep pattern
        id: select-tests
        env:
          PERF_TAGS: ${{ inputs.performance_tags }}
          PERF_REASONING: ${{ inputs.performance_tags_reasoning }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          TAGS="$PERF_TAGS"
          REASONING="$PERF_REASONING"

          # Blank on a PR is a selector miss: run none.
          # Blank without a PR (schedule/manual) still runs the full suite.
          if [[ -z "${TAGS//[[:space:]]/}" ]]; then
            if [[ -n "$PR_NUMBER" ]]; then
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
              echo "grep_pattern="   >> "$GITHUB_OUTPUT"
              echo "⏭️  Skipping performance tests — blank selection on a PR"
              exit 0
            fi
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "grep_pattern="  >> "$GITHUB_OUTPUT"
            echo "▶️  Running all performance tests (no tag filter)"
            exit 0
          fi

          # '[]' → no performance-relevant changes, or selection failed: skip tests and native builds.
          if [[ "$TAGS" == "[]" ]]; then
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "grep_pattern="   >> "$GITHUB_OUTPUT"
            echo "⏭️  Skipping performance tests — no performance-relevant changes detected"
            if [[ -n "$REASONING" ]]; then
              echo "   Reasoning: $REASONING"
            fi
            exit 0
          fi

          # '["ALL"]' (any case, or mixed with other tags) → run the full suite.
          if echo "$TAGS" | jq -e 'type == "array" and any(.[]; ascii_upcase == "ALL")' >/dev/null 2>&1; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "grep_pattern="  >> "$GITHUB_OUTPUT"
            echo "▶️  Running all performance tests (ALL tag)"
            if [[ -n "$REASONING" ]]; then
              echo "   Reasoning: $REASONING"
            fi
            exit 0
          fi

          GREP=$(echo "$TAGS" | jq -r 'join("|")')
          echo "run_tests=true"     >> "$GITHUB_OUTPUT"
          echo "grep_pattern=$GREP" >> "$GITHUB_OUTPUT"
          echo "⚡ Tags: $TAGS"
          echo "   Grep pattern: $GREP"
          if [[ -n "$REASONING" ]]; then
            echo "   Reasoning: $REASONING"
          fi

      - name: Read device matrix
        id: read-matrix
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          FILE="tests/performance/device-matrix.json"

          # PRs use Android low-profile devices only. Scheduled and manual runs
          # use the full Android matrix. Cloud performance runs are Android on
          # TestMu HyperExecute.
          if [ -n "$PR_NUMBER" ]; then
            ANDROID_MATRIX=$(jq '[.android_devices[] | select(.category == "low")]' "$FILE")
            echo "PR mode: Android low category devices only (PR: $PR_NUMBER, branch: $BRANCH_NAME)"
          else
            ANDROID_MATRIX=$(jq ".android_devices" "$FILE")
            echo "Full mode: all Android devices (branch: $BRANCH_NAME)"
          fi

          {
            echo "android_matrix<<EOF"
            echo "$ANDROID_MATRIX"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Selected: $(echo "$ANDROID_MATRIX" | jq length) Android"

      # A fingerprint is only needed when tests will run and Android apps were
      # not supplied and latest-main reuse is not selected.
      - name: Use caller-provided fingerprint
        id: provided
        if: >-
          steps.select-tests.outputs.run_tests == 'true' &&
          !inputs.reuse_main_builds &&
          !inputs.testmu_app_url_android_onboarding &&
          !inputs.testmu_app_url_android_imported_wallet &&
          inputs.source_fingerprint
        env:
          SOURCE_FINGERPRINT: ${{ inputs.source_fingerprint }}
        run: |
          echo "fingerprint=$SOURCE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "Using caller-provided fingerprint: $SOURCE_FINGERPRINT"

      - name: Set up Node.js
        if: >-
          steps.select-tests.outputs.run_tests == 'true' &&
          !inputs.reuse_main_builds &&
          !inputs.testmu_app_url_android_onboarding &&
          !inputs.testmu_app_url_android_imported_wallet &&
          !inputs.source_fingerprint
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install Yarn dependencies with retry
        if: >-
          steps.select-tests.outputs.run_tests == 'true' &&
          !inputs.reuse_main_builds &&
          !inputs.testmu_app_url_android_onboarding &&
          !inputs.testmu_app_url_android_imported_wallet &&
          !inputs.source_fingerprint
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: yarn install --immutable

      - name: Compute and post build-source-hash
        id: computed
        if: >-
          steps.select-tests.outputs.run_tests == 'true' &&
          !inputs.reuse_main_builds &&
          !inputs.testmu_app_url_android_onboarding &&
          !inputs.testmu_app_url_android_imported_wallet &&
          !inputs.source_fingerprint
        uses: ./.github/actions/post-build-source-hash
        with:
          github-token: ${{ github.token }}
          post-status: 'true'
          target-sha: ${{ github.sha }}

      - name: Resolve fingerprint output
        id: resolve-fingerprint
        if: >-
          steps.select-tests.outputs.run_tests == 'true' &&
          !inputs.reuse_main_builds &&
          !inputs.testmu_app_url_android_onboarding &&
          !inputs.testmu_app_url_android_imported_wallet
        env:
          PROVIDED: ${{ steps.provided.outputs.fingerprint }}
          COMPUTED: ${{ steps.computed.outputs.fingerprint }}
        run: |
          if [ -n "$PROVIDED" ]; then
            echo "fingerprint=$PROVIDED" >> "$GITHUB_OUTPUT"
          elif [ -n "$COMPUTED" ]; then
            echo "fingerprint=$COMPUTED" >> "$GITHUB_OUTPUT"
          else
            echo "❌ No fingerprint available" >&2
            exit 1
          fi
          echo "Resolved fingerprint: $(grep fingerprint= "$GITHUB_OUTPUT" | tail -1)"

  check-testmu-credentials:
    name: Resolve TestMu AI Credentials
    runs-on: ubuntu-latest
    outputs:
      testmu_ready: ${{ steps.resolve.outputs.testmu_ready }}
    steps:
      - name: Resolve TestMu AI credentials
        id: resolve
        env:
          # Do not write these secrets to job outputs. GitHub strips outputs
          # whose values match a secret, which previously left uploads unauthorized.
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          if [ -z "$LT_USERNAME" ] || [ -z "$LT_ACCESS_KEY" ]; then
            echo "Performance runs require LT_USERNAME and LT_ACCESS_KEY secrets"
            exit 1
          fi
          http_code="$(curl -sS -o /dev/null -w '%{http_code}' -u "$LT_USERNAME:$LT_ACCESS_KEY" \
            "https://manual-api.lambdatest.com/app/data?type=android&level=user&limit=1" || true)"
          if [ "$http_code" != "200" ]; then
            echo "TestMu AI credentials are set but the API rejected them (HTTP $http_code)"
            exit 1
          fi
          echo "TestMu AI credentials are configured and valid"
          echo "testmu_ready=true" >> "$GITHUB_OUTPUT"

  trigger-android-dual-versions:
    name: Trigger Android Dual Versions and Upload to TestMu
    uses: ./.github/workflows/build-android-upload-to-testmu.yml
    needs: [prepare, check-testmu-credentials]
    # Android runs without explicit TestMu app URLs go through this workflow.
    # It selects fingerprint reuse for app changes and latest-main artifact
    # reuse for test-only changes, with a fresh-build fallback. APKs are
    # uploaded to TestMu only.
    if: >-
      always() &&
      !cancelled() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.run_tests == 'true' &&
      needs.check-testmu-credentials.result == 'success' &&
      !inputs.testmu_app_url_android_onboarding &&
      !inputs.testmu_app_url_android_imported_wallet
    with:
      branch_name: ${{ inputs.branch_name }}
      source_ref: ${{ inputs.source_ref }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      source_fingerprint: ${{ needs.prepare.outputs.fingerprint }}
      reuse_latest_main_builds: ${{ inputs.reuse_main_builds && inputs.build_variant == 'e2e' }}
      upload_to_browserstack: false
      upload_to_testmu: true
      # Coerce to a real boolean. On schedule/push, workflow_dispatch inputs are
      # unset; passing a blank value into this boolean workflow_call input makes
      # the reusable Android build job fail to start.
      main_branch_only: ${{ inputs.reuse_main_builds == true && inputs.build_variant == 'e2e' }}
    secrets: inherit

  # =============================================================================
  # ONBOARDING AND IMPORTED WALLET TESTS (TestMu HyperExecute)
  # =============================================================================

  run-android-onboarding-tests-testmu:
    name: Performance Test Android TestMu HyperExecute (Onboarding)
    uses: ./.github/workflows/performance-test-runner.yml
    needs: [prepare, check-testmu-credentials, trigger-android-dual-versions]
    if: >-
      always() && !cancelled() &&
      needs.prepare.outputs.run_tests == 'true' &&
      needs.check-testmu-credentials.result == 'success' &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      (
        needs.trigger-android-dual-versions.result == 'skipped' ||
        needs.trigger-android-dual-versions.result == 'success'
      ) &&
      (
        inputs.testmu_app_url_android_onboarding != '' ||
        needs.trigger-android-dual-versions.outputs.without-srp-testmu-url != ''
      )
    with:
      platform: android
      build_type: onboarding
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      branch_name: ${{ inputs.branch_name }}
      device_matrix: ${{ needs.prepare.outputs.android_matrix }}
      testmu_app_url: ${{ inputs.testmu_app_url_android_onboarding || needs.trigger-android-dual-versions.outputs.without-srp-testmu-url }}
      app_version: ${{ needs.trigger-android-dual-versions.outputs.without-srp-testmu-version || needs.trigger-android-dual-versions.outputs.without-srp-version || 'Manual-Input' }}
      testmu_project_name: ${{ inputs.testmu_project_name }}
      testmu_build_name: ${{ inputs.testmu_build_name || format('TestMu-Android-Performance-{0}-Branch', inputs.branch_name) }}
      grep_tags: ${{ needs.prepare.outputs.grep_pattern }}
      he_concurrency: ${{ inputs.he_concurrency }}
      collect_hermes_cpuprofiles: ${{ inputs.collect_hermes_cpuprofiles == true }}
    secrets: inherit

  run-android-imported-wallet-tests-testmu:
    name: Performance Test Android TestMu HyperExecute (Imported Wallet)
    uses: ./.github/workflows/performance-test-runner.yml
    needs: [prepare, check-testmu-credentials, trigger-android-dual-versions]
    if: >-
      always() && !cancelled() &&
      needs.prepare.outputs.run_tests == 'true' &&
      needs.check-testmu-credentials.result == 'success' &&
      needs.check-testmu-credentials.outputs.testmu_ready == 'true' &&
      (
        needs.trigger-android-dual-versions.result == 'skipped' ||
        needs.trigger-android-dual-versions.result == 'success'
      ) &&
      (
        inputs.testmu_app_url_android_imported_wallet != '' ||
        needs.trigger-android-dual-versions.outputs.with-srp-testmu-url != ''
      )
    with:
      platform: android
      build_type: imported-wallet
      sentry_target: ${{ inputs.sentry_target || 'test' }}
      build_variant: ${{ inputs.build_variant || 'e2e' }}
      branch_name: ${{ inputs.branch_name }}
      device_matrix: ${{ needs.prepare.outputs.android_matrix }}
      testmu_app_url: ${{ inputs.testmu_app_url_android_imported_wallet || needs.trigger-android-dual-versions.outputs.with-srp-testmu-url }}
      app_version: ${{ needs.trigger-android-dual-versions.outputs.with-srp-testmu-version || needs.trigger-android-dual-versions.outputs.with-srp-version || 'Manual-Input' }}
      testmu_project_name: ${{ inputs.testmu_project_name }}
      testmu_build_name: ${{ inputs.testmu_build_name || format('TestMu-Android-Performance-{0}-Branch', inputs.branch_name) }}
      grep_tags: ${{ needs.prepare.outputs.grep_pattern }}
      he_concurrency: ${{ inputs.he_concurrency }}
      collect_hermes_cpuprofiles: ${{ inputs.collect_hermes_cpuprofiles == true }}
    secrets: inherit

  aggregate-results:
    name: Aggregate All Test Results
    runs-on: ubuntu-latest
    needs:
      [
        prepare,
        run-android-onboarding-tests-testmu,
        run-android-imported-wallet-tests-testmu,
      ]
    if: always() && needs.prepare.outputs.run_tests == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download All Test Results
        uses: actions/download-artifact@v7
        with:
          pattern: '*-test-results-*'
          path: ./test-results
          # Keep each artifact in its own directory. The directory name carries
          # the testmu-he- prefix used by the aggregator.

      - name: Run aggregation script
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          BUILD_VARIANT: ${{ inputs.build_variant || 'e2e' }}
        run: |
          echo "Processing all test results..."
          echo "Running aggregation script..."
          node .github/scripts/qa-automation/performance-tests/aggregate-performance-reports.mjs
          echo "Aggregation completed"

      - name: Upload Final Combined Results
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-reports
          path: |
            tests/aggregated-reports/
          if-no-files-found: ignore
          retention-days: 30

  post-pr-comment:
    name: Post Performance Results to PR
    runs-on: ubuntu-latest
    needs: [aggregate-results]
    # Labeled PR runs pass pr_number. A run that never executed tests
    # (skipped suite, cancelled before TestMu) must not replace the comment.
    if: always() && !cancelled() && needs.aggregate-results.result == 'success' && inputs.pr_number != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Aggregated Results
        uses: actions/download-artifact@v7
        with:
          name: aggregated-reports
          path: ./aggregated-reports
        continue-on-error: true

      - name: Generate PR comment markdown
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/qa-automation/performance-tests/generate-performance-pr-comment.mjs \
            aggregated-reports/summary.json \
            performance-pr-comment.md

      - name: Post PR comment when tests ran
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          SUMMARY="aggregated-reports/summary.json"
          TOTAL=0
          if [ -f "$SUMMARY" ]; then
            TOTAL=$(jq -r '.uniqueTests // .totalTests // 0' "$SUMMARY")
          fi
          if [ "$TOTAL" = "0" ] || [ "$TOTAL" = "null" ]; then
            echo "No performance tests executed. Leaving the existing PR comment in place."
            exit 0
          fi

          ALL_COMMENT_IDS=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- perf-test-results -->") or contains("<!-- app-profiling-check -->")) | .id')

          if [ -n "$ALL_COMMENT_IDS" ]; then
            echo "$ALL_COMMENT_IDS" | while read -r COMMENT_ID; do
              if [ -n "$COMMENT_ID" ]; then
                gh api "repos/${{ github.repository }}/issues/comments/$COMMENT_ID" \
                  --method DELETE > /dev/null 2>&1 || true
              fi
            done
            echo "Deleted previous performance / app-profiling comments"
          fi

          MARKER="<!-- perf-test-results -->"
          COMMENT=$(cat performance-pr-comment.md)
          FULL_COMMENT="${COMMENT}"$'\n'"${MARKER}"
          gh pr comment "${PR_NUMBER}" --repo "${{ github.repository }}" --body "$FULL_COMMENT"
          echo "Performance results posted to PR #${PR_NUMBER}"

      - name: Add complete API request list to the run summary
        run: |
          # The PR comment shows the most called endpoints per scenario (GitHub
          # caps comments at 65,536 characters); the complete list goes here.
          if [ -f performance-pr-comment-api-full.md ]; then
            cat performance-pr-comment-api-full.md >> "$GITHUB_STEP_SUMMARY"
          fi

  slack-notification:
    name: Send Slack Notification
    runs-on: ubuntu-latest
    needs:
      [
        run-android-onboarding-tests-testmu,
        run-android-imported-wallet-tests-testmu,
        aggregate-results,
      ]
    # Off on this branch: its runs post no summary to Slack.
    if: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Aggregated Results
        uses: actions/download-artifact@v7
        with:
          name: aggregated-reports
          path: ./aggregated-reports

      - name: Generate Test Summary
        id: summary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: |
          {
            echo "summary<<EOF"
            ./.github/scripts/qa-automation/performance-tests/generate-slack-summary.sh aggregated-reports/summary.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a
        with:
          webhook: ${{ secrets.PERFORMANCE_E2E_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.summary.outputs.summary }}"
            }
