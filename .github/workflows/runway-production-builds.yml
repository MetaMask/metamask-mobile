##############################################################################################
#
# Runway Production Builds
#
# Triggered from Runway to build the production iOS + Android binaries in one run.
# Generates the build number once, then dispatches build.yml with platform: both so iOS and Android
# apply the same number locally at build time (no version-bump commit). Finishes by uploading the
# iOS IPA to TestFlight.
#
# Must be dispatched from a release/X.Y.Z branch whose open release PR into stable meets the
# stable branch rules (configured in the repository rulesets, not in this workflow) and whose
# commit passed the required CI check. The build is pinned to that verified commit.
#
# This workflow only produces fresh native binaries — OTA updates are handled by the separate
# runway-ota-production.yml workflow.
#
##############################################################################################
name: Runway Production Builds

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: >-
          Optional branch, tag, or SHA (Build workflow source_branch).
          Empty uses the branch selected in the "Use workflow from" UI.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

cache-mode: none

jobs:
  verify-release:
    name: Verify release PR and required CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      commit_sha: ${{ steps.resolve-commit.outputs.commit_sha }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Resolve release PR into stable
        id: resolve-pr
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_branch || github.ref_name }}
        run: |
          set -euo pipefail

          BRANCH="${SOURCE_REF#refs/heads/}"
          if ! [[ "$BRANCH" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Production builds must run from a release/X.Y.Z branch so its release PR can be checked (got: ${BRANCH})."
            exit 1
          fi

          PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base stable --state open \
            --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)] | .[0].number // empty')
          if [[ -z "$PR_NUMBER" ]]; then
            echo "::error::No open release PR from ${BRANCH} into stable."
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Require the release PR to meet the stable branch rules
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
        run: .github/scripts/verify-release-pr-mergeable.sh

      - name: Resolve commit to build
        id: resolve-commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "$SOURCE_BRANCH" ]]; then
            COMMIT_SHA="$DISPATCH_SHA"
          else
            BRANCH="${SOURCE_BRANCH#refs/heads/}"
            COMMIT_SHA=$(gh api "/repos/${GITHUB_REPOSITORY}/branches/${BRANCH//\//%2F}" --jq '.commit.sha')
          fi

          echo "Building ${COMMIT_SHA}"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Require green CI on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.resolve-commit.outputs.commit_sha }}
        run: .github/scripts/verify-required-ci.sh

  generate-build-version:
    name: Generate build version
    needs: verify-release
    permissions:
      id-token: write # AWS OIDC for the build number service in generate-build-version.yml
    uses: ./.github/workflows/generate-build-version.yml

  build:
    name: Build iOS + Android (main-prod)
    needs: [verify-release, generate-build-version]
    permissions:
      contents: read
      id-token: write # AWS OIDC for code signing in build.yml
    uses: ./.github/workflows/build.yml
    with:
      build_name: main-prod
      platform: both
      # Pinned to the commit whose release PR and CI were verified, so iOS and Android
      # build exactly that commit under one build number.
      source_branch: ${{ needs.verify-release.outputs.commit_sha }}
      build_number: ${{ needs.generate-build-version.outputs.build-version }}
      upload_to_sentry: true
    secrets: inherit

  upload-ios-testflight:
    name: Upload iOS to TestFlight
    needs: build
    permissions:
      contents: read
      id-token: write # AWS OIDC for the TestFlight upload in upload-to-testflight.yml
    uses: ./.github/workflows/upload-to-testflight.yml
    with:
      environment: prod
      source_branch: ${{ inputs.source_branch || github.ref_name }}
      build_name: main-prod
      build_commit_sha: ${{ needs.build.outputs.built_commit_sha }}
      build_version: ${{ needs.build.outputs.semantic_version }}
      build_number: ${{ needs.build.outputs.ios_version_code }}
    secrets: inherit

  slack-notification:
    name: Slack Production Notification
    needs: build
    if: success()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/slack-rc-notification.yml
    with:
      source_branch: ${{ inputs.source_branch || github.ref_name }}
      semver: ${{ needs.build.outputs.semantic_version }}
      ios_build_number: ${{ needs.build.outputs.ios_version_code }}
      android_build_number: ${{ needs.build.outputs.android_version_code }}
      build_kind: production
    secrets: inherit
