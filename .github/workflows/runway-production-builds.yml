##############################################################################################
#
# Runway Production Builds
#
# Triggered from Runway to build the production iOS + Android binaries in one run.
# Generates the build number once, then dispatches build.yml with platform: both so iOS and Android
# apply the same number locally at build time (no version-bump commit). Finishes by uploading the
# iOS IPA to TestFlight.
#
# This workflow only produces fresh native binaries — OTA updates are handled by the separate
# runway-ota-production.yml workflow.
#
##############################################################################################
name: Runway Production Builds

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: >-
          Optional branch, tag, or SHA (Build workflow source_branch).
          Empty uses the branch selected in the "Use workflow from" UI.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

cache-mode: none

jobs:
  generate-build-version:
    name: Generate build version
    permissions:
      id-token: write # AWS OIDC for the build number service in generate-build-version.yml
    uses: ./.github/workflows/generate-build-version.yml

  build:
    name: Build iOS + Android (main-prod)
    needs: generate-build-version
    permissions:
      contents: read
      id-token: write # AWS OIDC for code signing in build.yml
    uses: ./.github/workflows/build.yml
    with:
      build_name: main-prod
      platform: both
      # Prefer an explicit input; otherwise pin to the dispatch SHA so iOS and
      # Android do not race a moving branch tip under one build number.
      source_branch: ${{ inputs.source_branch || github.sha }}
      build_number: ${{ needs.generate-build-version.outputs.build-version }}
      upload_to_sentry: true
    secrets: inherit

  upload-ios-testflight:
    name: Upload iOS to TestFlight
    needs: build
    permissions:
      contents: read
      id-token: write # AWS OIDC for the TestFlight upload in upload-to-testflight.yml
    uses: ./.github/workflows/upload-to-testflight.yml
    with:
      environment: prod
      source_branch: ${{ inputs.source_branch || github.ref_name }}
      build_name: main-prod
      build_commit_sha: ${{ needs.build.outputs.built_commit_sha }}
      build_version: ${{ needs.build.outputs.semantic_version }}
      build_number: ${{ needs.build.outputs.ios_version_code }}
    secrets: inherit

  # A separate job so build.yml (shared by every build caller) does not need
  # attestations: write. Artifacts are digest-checked on download, so the subjects are
  # the exact files the build job produced.
  attest-release:
    name: Attest release binaries and SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signing for the attestations
      attestations: write
    steps:
      - name: Checkout built commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.built_commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download iOS IPA
        uses: actions/download-artifact@v7
        with:
          name: ios-ipa-main-prod
          path: ${{ runner.temp }}/release/ios

      - name: Download Android AAB
        uses: actions/download-artifact@v7
        with:
          name: android-aab-main-prod
          path: ${{ runner.temp }}/release/android

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/ios/*.ipa
            ${{ runner.temp }}/release/android/*.aab

      # Catalogs the lockfiles in the source tree (yarn.lock, Podfile.lock, Gemfile.lock).
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/sbom-main-prod.cdx.json
          artifact-name: sbom-main-prod.cdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/ios/*.ipa
            ${{ runner.temp }}/release/android/*.aab
          sbom-path: ${{ runner.temp }}/sbom-main-prod.cdx.json

  slack-notification:
    name: Slack Production Notification
    needs: build
    if: success()
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/slack-rc-notification.yml
    with:
      source_branch: ${{ inputs.source_branch || github.ref_name }}
      semver: ${{ needs.build.outputs.semantic_version }}
      ios_build_number: ${{ needs.build.outputs.ios_version_code }}
      android_build_number: ${{ needs.build.outputs.android_version_code }}
      build_kind: production
    secrets: inherit
