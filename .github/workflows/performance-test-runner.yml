name: Performance Test Runner (Reusable)

# Runs Android performance specs on TestMu real devices, orchestrated by
# TestMu HyperExecute.

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
        description: 'Platform to test (android)'
      build_type:
        required: true
        type: string
        description: 'Build type (imported-wallet/onboarding)'
      device_matrix:
        required: true
        type: string
        description: 'JSON string of device matrix'
      testmu_app_url:
        required: true
        type: string
        description: 'TestMu AI app URL (lt://...)'
      app_version:
        required: true
        type: string
        description: 'App version'
      branch_name:
        required: true
        type: string
        description: 'Branch name used for performance observability'
      testmu_build_name:
        required: true
        type: string
        description: 'Unified TestMu AI build name for all sessions'
      testmu_project_name:
        required: false
        type: string
        default: ''
        description: 'TestMu AI project name. Empty keeps the provider default.'
      sentry_target:
        required: false
        type: string
        default: test
        description: 'Sentry DSN target: test or real'
      build_variant:
        required: false
        type: string
        default: e2e
        description: 'App build variant used for performance observability'
      feature_flags_environment:
        required: false
        type: string
        default: rc
        description: 'client-config API environment (rc, exp, test). Independent of build_variant.'
      grep_tags:
        required: false
        type: string
        default: ''
        description: 'Optional grep pattern to filter tests. Empty runs all tests.'
      he_concurrency:
        required: false
        type: string
        default: '2'
        description: 'HyperExecute autosplit concurrency'
      he_region:
        required: false
        type: string
        default: 'us'
        description: 'HyperExecute region (us or eu)'
      collect_hermes_cpuprofiles:
        required: false
        type: boolean
        default: false
        description: >-
          Harvest Hermes .cpuprofile artifacts after each performance spec.
          True for schedule/manual; false (default) for PR runs.
      collect_network_logs:
        required: false
        type: boolean
        default: true
        description: >-
          Capture device network traffic on TestMu sessions so API calls appear
          in the performance report. Adds session overhead that can skew
          timings; set false for timing-sensitive runs.
    secrets:
      LT_USERNAME:
        required: true
      LT_ACCESS_KEY:
        required: true
      MM_TEST_ACCOUNT_SRP:
        required: true
      TEST_SRP_1:
        required: true
      TEST_SRP_2:
        required: true
      TEST_SRP_3:
        required: true
      TEST_SRP_4:
        required: true
      E2E_PASSWORD:
        required: true
      MM_SENTRY_DSN_TEST:
        required: false
      MM_SENTRY_DSN:
        required: false
      E2E_CLAUDE_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  run-tests:
    name: '[TestMu/HE] ${{ inputs.build_type }} on ${{ inputs.platform }} - ${{ matrix.device.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(inputs.device_matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Test Environment
        env:
          # Inputs and secrets reach the script as environment variables, never
          # expanded into it, so a value such as a branch name cannot inject shell.
          BUILD_TYPE: ${{ inputs.build_type }}
          PLATFORM: ${{ inputs.platform }}
          DEVICE_NAME: ${{ matrix.device.name }}
          DEVICE_OS_VERSION: ${{ matrix.device.os_version }}
          SENTRY_TARGET: ${{ inputs.sentry_target }}
          SENTRY_TEST_DSN: ${{ secrets.MM_SENTRY_DSN_TEST }}
          SENTRY_REAL_DSN: ${{ secrets.MM_SENTRY_DSN }}
          FEATURE_FLAGS_ENV: ${{ inputs.feature_flags_environment }}
          CI_BUILD_VARIANT: ${{ inputs.build_variant }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          TESTMU_APP_URL: ${{ inputs.testmu_app_url }}
          APP_VERSION: ${{ inputs.app_version }}
          TESTMU_BUILD_NAME_INPUT: ${{ inputs.testmu_build_name }}
          TESTMU_PROJECT_NAME_INPUT: ${{ inputs.testmu_project_name }}
          HE_CONCURRENCY_INPUT: ${{ inputs.he_concurrency }}
          HE_REGION_INPUT: ${{ inputs.he_region }}
          COLLECT_HERMES_INPUT: ${{ inputs.collect_hermes_cpuprofiles == true && 'true' || 'false' }}
          COLLECT_NETWORK_LOGS_INPUT: ${{ inputs.collect_network_logs == true && 'true' || 'false' }}
          LT_USERNAME_SECRET: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY_SECRET: ${{ secrets.LT_ACCESS_KEY }}
          MM_TEST_ACCOUNT_SRP_SECRET: ${{ secrets.MM_TEST_ACCOUNT_SRP }}
          TEST_SRP_1_SECRET: ${{ secrets.TEST_SRP_1 }}
          TEST_SRP_2_SECRET: ${{ secrets.TEST_SRP_2 }}
          TEST_SRP_3_SECRET: ${{ secrets.TEST_SRP_3 }}
          TEST_SRP_4_SECRET: ${{ secrets.TEST_SRP_4 }}
          E2E_PASSWORD_SECRET: ${{ secrets.E2E_PASSWORD }}
          ANTHROPIC_API_KEY_SECRET: ${{ secrets.E2E_CLAUDE_API_KEY }}
        run: |
          echo "Setting TestMu HyperExecute $BUILD_TYPE environment for device: $DEVICE_NAME"

          SELECTED_SENTRY_DSN=""
          SENTRY_ENVIRONMENT="github-actions-performance-e2e-testmu-he"
          TESTMU_GEO_LOCATION="${TESTMU_GEO_LOCATION:-SE}"

          if [[ "$FEATURE_FLAGS_ENV" != "rc" && "$FEATURE_FLAGS_ENV" != "exp" && "$FEATURE_FLAGS_ENV" != "test" && "$FEATURE_FLAGS_ENV" != "dev" && "$FEATURE_FLAGS_ENV" != "prod" ]]; then
            echo "Invalid feature_flags_environment '$FEATURE_FLAGS_ENV'. Expected rc, exp, test, dev, or prod."
            exit 1
          fi

          if [ -z "$TESTMU_APP_URL" ]; then
            echo "No $PLATFORM TestMu AI app URL available"
            exit 1
          fi

          case "$SENTRY_TARGET" in
            real)
              SELECTED_SENTRY_DSN="$SENTRY_REAL_DSN"
              SENTRY_ENVIRONMENT="github-actions-performance-e2e-testmu-he-real"
              ;;
            test)
              SELECTED_SENTRY_DSN="$SENTRY_TEST_DSN"
              ;;
            *)
              echo "Invalid sentry_target '$SENTRY_TARGET'. Expected 'test' or 'real'."
              exit 1
              ;;
          esac

          RELEASE_VERSION=""
          if [[ "$BRANCH_NAME" =~ ^release/(.+)$ ]]; then
            RELEASE_VERSION="${BASH_REMATCH[1]}"
          fi
          if [[ "$CI_BUILD_VARIANT" == "rc" ]]; then
            SENTRY_ENVIRONMENT="${SENTRY_ENVIRONMENT}-rc"
          fi

          SENTRY_RELEASE="mm-mobile-perf-${CI_BUILD_VARIANT}-${GITHUB_SHA}"
          if [[ "$CI_BUILD_VARIANT" == "rc" && -n "$RELEASE_VERSION" ]]; then
            SENTRY_RELEASE="mm-mobile-rc-${RELEASE_VERSION}"
          fi

          {
            echo "BUILD_TYPE=$BUILD_TYPE"
            echo "TESTMU_DEVICE=$DEVICE_NAME"
            echo "TESTMU_OS_VERSION=$DEVICE_OS_VERSION"
            echo "TESTMU_ANDROID_APP_URL=$TESTMU_APP_URL"
            if [ "$BUILD_TYPE" = "onboarding" ]; then
              echo "TESTMU_ANDROID_CLEAN_APP_URL=$TESTMU_APP_URL"
              echo "TESTMU_ANDROID_ONBOARDING_PERF_APP_URL=$TESTMU_APP_URL"
              echo "TESTMU_ANDROID_SEEDLESS_PERF_APP_URL=$TESTMU_APP_URL"
            fi
            echo "TEST_PLATFORM=$PLATFORM"
            echo "QA_APP_VERSION=$APP_VERSION"
            echo "TESTMU_BUILD_NAME=${TESTMU_BUILD_NAME_INPUT}-HyperExecute"
            if [ -n "$TESTMU_PROJECT_NAME_INPUT" ]; then
              echo "TESTMU_PROJECT_NAME=$TESTMU_PROJECT_NAME_INPUT"
            fi
            echo "TESTMU_GEO_LOCATION=$TESTMU_GEO_LOCATION"
            echo "LT_USERNAME=$LT_USERNAME_SECRET"
            echo "LT_ACCESS_KEY=$LT_ACCESS_KEY_SECRET"
            echo "MM_TEST_ACCOUNT_SRP=$MM_TEST_ACCOUNT_SRP_SECRET"
            echo "TEST_SRP_1=$TEST_SRP_1_SECRET"
            echo "TEST_SRP_2=$TEST_SRP_2_SECRET"
            echo "TEST_SRP_3=$TEST_SRP_3_SECRET"
            echo "TEST_SRP_4=$TEST_SRP_4_SECRET"
            echo "E2E_PASSWORD=$E2E_PASSWORD_SECRET"
            # AI locator recovery for broken Page Object taps / wallet-home scrolls.
            # Stays off when the key is missing (for example on fork PRs).
            echo "AI_LOCATOR_RECOVERY_ENABLED=true"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY_SECRET"
            echo "E2E_PERFORMANCE_SENTRY_DSN=$SELECTED_SENTRY_DSN"
            echo "E2E_PERFORMANCE_SENTRY_ENVIRONMENT=$SENTRY_ENVIRONMENT"
            echo "E2E_PERFORMANCE_SENTRY_RELEASE=$SENTRY_RELEASE"
            echo "E2E_PERFORMANCE_BUILD_VARIANT=$FEATURE_FLAGS_ENV"
            echo "E2E_PERFORMANCE_CI_BUILD_VARIANT=$CI_BUILD_VARIANT"
            echo "E2E_PERFORMANCE_RELEASE_VERSION=$RELEASE_VERSION"
            echo "E2E_PERFORMANCE_GITHUB_REF_NAME=$BRANCH_NAME"
            echo "E2E_PERFORMANCE_CLOUD_PROVIDER=testmu"
            echo "DISABLE_VIDEO_DOWNLOAD=true"
            echo "HE_CONCURRENCY=$HE_CONCURRENCY_INPUT"
            echo "HE_REGION=$HE_REGION_INPUT"
            echo "COLLECT_HERMES_CPUPROFILES=$COLLECT_HERMES_INPUT"
            echo "TESTMU_NETWORK_LOGS=$COLLECT_NETWORK_LOGS_INPUT"
          } >> "$GITHUB_ENV"

      - name: Run Tests via HyperExecute
        id: he-run
        continue-on-error: true
        env:
          GREP_TAGS: ${{ inputs.grep_tags }}
          BUILD_TYPE_LABEL: ${{ inputs.build_type }}
          DEVICE_NAME_LABEL: ${{ matrix.device.name }}
        run: |
          echo "=== [TestMu AI / HyperExecute] $BUILD_TYPE_LABEL on $DEVICE_NAME_LABEL ==="
          chmod +x ./.github/scripts/qa-automation/performance-tests/run-testmu-hyperexecute.sh
          ./.github/scripts/qa-automation/performance-tests/run-testmu-hyperexecute.sh

      - name: Resolve artifact name
        id: artifact-name
        if: always()
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_TYPE: ${{ inputs.build_type }}
          DEVICE_NAME: ${{ matrix.device.name }}
          OS_VERSION: ${{ matrix.device.os_version }}
        run: |
          SUITE="${BUILD_TYPE/onboarding/onboarding-flow}"
          echo "name=testmu-he-${PLATFORM}-${SUITE}-test-results-${DEVICE_NAME}-${OS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            tests/reporters/reports
            tests/test-reports/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Prefixed testmu-he- so analyze-app-profiling downloads these profiles.
      - name: Upload Hermes CPU profiles
        uses: actions/upload-artifact@v7
        if: ${{ always() && inputs.collect_hermes_cpuprofiles == true }}
        with:
          name: testmu-he-hermes-cpuprofiles-${{ inputs.platform }}-${{ inputs.build_type == 'onboarding' && 'onboarding-flow' || inputs.build_type }}-${{ matrix.device.name }}-${{ matrix.device.os_version }}
          path: tests/reporters/reports/hermes-cpuprofiles/
          if-no-files-found: ignore
          retention-days: 14

      # he-run is continue-on-error so test failures stay non-blocking, but a
      # run that produced no metrics at all (e.g. HyperExecute `pre` stage
      # failed) must not look green.
      - name: Fail when HyperExecute produced no results
        if: ${{ always() && steps.he-run.outcome == 'failure' }}
        run: |
          if find tests/reporters/reports -type f -name '*performance-metrics*.json' 2>/dev/null | grep -q .; then
            echo "HyperExecute reported failures but performance metrics were produced; keeping the job non-blocking."
            exit 0
          fi
          echo "::error::HyperExecute failed and no performance metrics were produced. Check the HyperExecute job link in the 'Run Tests via HyperExecute' step."
          exit 1
