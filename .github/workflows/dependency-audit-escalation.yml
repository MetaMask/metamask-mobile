name: Dependency Audit Escalation

# `yarn audit:ci` is advisory-only in ci.yml (dependency-audit job) — it never
# blocks a PR. This workflow is the actual triage loop:
#   1. scripts/collect-audit-advisories.ts parses the raw `yarn audit` output
#      and drops anything already tracked by an open PR/issue. (Permanently
#      accepted risks never even get this far — see
#      npmAuditIgnoreAdvisories in .yarnrc.yml.)
#   2. scripts/attempt-audit-fix.ts hands what's left to MetaMask/ai-analyzer's
#      dependency-audit-fix mode (routed through the org's LiteLLM proxy),
#      which proposes a fix per advisory (a version bump, a `resolutions`
#      pin, or "no safe fix"). The AI never edits a file itself — this script
#      applies each proposal and independently re-verifies it against the
#      actual resulting lockfile before trusting it and opening a PR — see
#      the trust-model comment at the top of that script.
# The PR is titled with a cp-<next-release> token so the existing
# add-release-label automation tags it for release. Whatever it can't fix
# gets filed/updated as a tracking issue. The audit owner (and their manager,
# if configured) gets pinged in Slack twice: once right after advisories are
# found (so they know before waiting on the AI step/PR creation, which can
# take a few minutes), and once at the end with links to whatever PR/issue
# actually got created, threaded off the first message. See
# .github/audit-owners.yml (owner) and npmAuditIgnoreAdvisories in
# .yarnrc.yml (accepting a risk instead of fixing it).
#
# No schedule: ci.yml's `dependency-audit` job already runs `yarn audit:ci`
# on every push/PR/hourly-schedule run ci.yml itself has, so re-running the
# same check again on a separate cron would just be redundant. Instead,
# ci.yml calls this workflow (via workflow_call) only on runs where that job
# actually found advisories.

on:
  workflow_call:
  workflow_dispatch:
  # TEMPORARY, for e2e smoke tests: direct-push trigger disabled for now so a
  # push to test/fake-audit-advisory-e2e exercises the new ci.yml ->
  # workflow_call chain (via test-ci-escalation-wiring.yml) exactly once,
  # instead of also firing this workflow a second time directly.
  # push:
  #   branches:
  #     - test/fake-audit-advisory-e2e

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # required by MetaMask/github-tools/.github/actions/get-token

jobs:
  dependency-audit-escalation:
    name: Triage dependency audit advisories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # TEMPORARY: real workflow pins `ref: main`. This smoke-test branch
          # checks out itself instead, since the escalation scripts/config
          # this test exercises aren't on main yet (still on this open PR).
          ref: test/fake-audit-advisory-e2e
          fetch-depth: 0 # needed so get-next-semver-version.sh can see all release/* branches

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install Yarn dependencies with retry
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 #v3.0.2
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: yarn install --immutable

      # TEMPORARY: real workflow runs the yarn npm audit command here. This
      # smoke-test branch injects one obviously-fake advisory instead, so the
      # rest of the pipeline (Slack messages, collect, AI-assisted fix,
      # PR/issue creation) can be exercised for real without waiting for/
      # faking an actual vulnerable dependency. `ms` is a real, transitive
      # dependency pulled in by multiple different pinned `debug` versions
      # with conflicting exact ranges (2.0.0 vs 2.1.2) — a good real-world
      # check that the AI's new `dependents` awareness correctly declines a
      # `resolutions` pin here rather than forcing one that breaks a consumer.
      - name: Run dependency audit (FAKED for e2e smoke test)
        id: audit
        shell: bash
        run: |
          cat > audit.ndjson << 'EOF'
          {"value":"ms","children":{"ID":"TEST-0009","Issue":"[TEST] Synthetic advisory injected to confirm the tracking issue now shows the AI's real reasoning instead of the static 'Pending AI-assisted review.' placeholder. Not a real vulnerability — safe to close/delete anything this produces.","Severity":"high","Vulnerable Versions":"*","URL":"https://github.com/MetaMask/metamask-mobile/pull/35470"}}
          EOF
          echo "has-advisories=true" >> "$GITHUB_OUTPUT"

      # Idempotent: `gh label create --force` edits the label in place if it
      # already exists instead of erroring, so this is safe to run every time
      # rather than only on first setup.
      - name: Ensure dependency-audit labels exist
        id: labels
        if: ${{ steps.audit.outputs.has-advisories == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependency-audit --repo "$GITHUB_REPOSITORY" --color '0e8a16' \
            --description 'Auto-fix PR opened by dependency-audit-escalation.yml' --force
          gh label create dependency-audit-manual --repo "$GITHUB_REPOSITORY" --color 'd93f0b' \
            --description 'Tracking issue for an advisory dependency-audit-escalation.yml could not auto-fix' --force

      - name: Build skip-list from open PRs/issues
        id: skip-list
        # Advisories the owner has permanently accepted as risk are handled
        # by .yarnrc.yml's npmAuditIgnoreAdvisories instead — those never
        # reach `yarn npm audit`'s output at all, so there's nothing to skip
        # here for them. This step only dedupes against advisories that are
        # mid-flight (already tracked by an open fix PR or manual-review
        # issue from a previous run).
        if: ${{ steps.audit.outputs.has-advisories == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            gh pr list --repo "$GITHUB_REPOSITORY" --label dependency-audit --state open --json body --jq '.[].body'
            gh issue list --repo "$GITHUB_REPOSITORY" --label dependency-audit-manual --state open --json body --jq '.[].body'
          } | grep -o '<!-- audit-ids: [^>]*-->' | sed -E 's/<!-- audit-ids: (.*) -->/\1/' | tr ',' '\n' \
            > skip-ids.txt || true

          node -e "
            const fs = require('fs');
            const ids = fs.existsSync('skip-ids.txt')
              ? fs.readFileSync('skip-ids.txt', 'utf8').split('\n').map((s) => s.trim()).filter(Boolean)
              : [];
            fs.writeFileSync('skip-ids.json', JSON.stringify([...new Set(ids)]));
          "
          echo "Skip list: $(cat skip-ids.json)"

      - name: Collect advisories for AI-assisted review
        id: collect
        if: ${{ steps.audit.outputs.has-advisories == 'true' }}
        shell: bash
        run: |
          yarn ts-node --transpile-only scripts/collect-audit-advisories.ts audit.ndjson skip-ids.json
          MANUAL_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audit-fix-result.json','utf8')).manual.length)")
          echo "manual-count=$MANUAL_COUNT" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (detected)
        id: notify-detected
        # Fires right away, before the AI step runs (which can take a few
        # minutes), so the owner doesn't wait until a PR/issue already exists
        # just to learn something was found.
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_STAGE: detected
          AUDIT_RESULT_PATH: audit-fix-result.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/slack-audit-notification.mjs
          # slack-audit-notification.mjs already only ever writes this file
          # when Slack's response matched its own `<digits>.<digits>`
          # timestamp shape (see SLACK_TS_PATTERN), but re-validate here too
          # before trusting it as a step output: an unescaped value with a
          # newline in it could otherwise inject extra lines into
          # $GITHUB_OUTPUT.
          if [[ -f slack-message-ts.txt ]] && grep -Eq '^[0-9]+\.[0-9]+$' slack-message-ts.txt; then
            echo "thread-ts=$(cat slack-message-ts.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Read audit owner
        id: owner
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        shell: bash
        run: |
          OWNER_GH=$(node -e "console.log(require('js-yaml').load(require('fs').readFileSync('.github/audit-owners.yml','utf8')).owner.github)")
          echo "github=$OWNER_GH" >> "$GITHUB_OUTPUT"

      - name: Get the next semver version
        id: next-semver
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        env:
          FORCE_NEXT_SEMVER_VERSION: ${{ vars.FORCE_NEXT_SEMVER_VERSION }}
        run: ./.github/scripts/get-next-semver-version.sh "$FORCE_NEXT_SEMVER_VERSION"

      - name: Get token
        id: get-token
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        uses: MetaMask/github-tools/.github/actions/get-token@v1
        with:
          token-exchange-url: ${{ vars.TOKEN_EXCHANGE_URL }}
          permissions: |
            contents: write
            pull_requests: write
            issues: write

      # https://github.com/MetaMask/ai-analyzer/releases — same private repo
      # and secrets ai-pr-risk-analysis.yml / flaky-unit-test-detection.yml
      # already use. Only checked out when there's something to look at, so a
      # clean audit never pays for it.
      #
      # Pinned to the same commit ai-pr-risk-analysis.yml uses (not the `v1`
      # tag flaky-unit-test-detection.yml uses): v1 still has a
      # validateProvidedFiles() check in src/index.ts requiring every
      # --changed-files entry to already be a committed git diff against the
      # base branch, which the advisory context file this script writes
      # (untracked, no diff yet) can never satisfy. That check is gone as of
      # this commit.
      - name: Checkout AI Analyzer
        id: checkout-ai-analyzer
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        uses: actions/checkout@v6
        with:
          repository: MetaMask/ai-analyzer
          ref: 68870b76360431110ae00b27a0072d3011e6238c
          path: .ai-analyzer-action
          token: ${{ secrets.AI_ANALYZER_TOKEN }}

      - name: Install AI Analyzer dependencies
        id: install-ai-analyzer-deps
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        working-directory: .ai-analyzer-action
        run: npm ci

      - name: Attempt AI-assisted fix
        id: fix
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        shell: bash
        env:
          LITELLM_API_KEY: ${{ secrets.AI_ANALYZER_LITELLM_KEY }}
          NODE_PATH: ${{ github.workspace }}/.ai-analyzer-action/node_modules
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          OWNER_GH: ${{ steps.owner.outputs.github }}
        run: |
          yarn ts-node --transpile-only scripts/attempt-audit-fix.ts audit-fix-result.json
          MANUAL_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audit-fix-result.json','utf8')).manual.length)")
          FIXED_COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audit-fix-result.json','utf8')).fixed.length)")
          PR_URL=$(cat audit-ai-pr-url.txt 2>/dev/null || echo '')
          {
            echo "manual-count=$MANUAL_COUNT"
            echo "fixed-count=$FIXED_COUNT"
            echo "pr-url=$PR_URL"
          } >> "$GITHUB_OUTPUT"

      - name: File or update tracking issue for advisories needing manual review
        id: manual-issue
        if: ${{ steps.audit.outputs.has-advisories == 'true' && steps.fix.outputs.manual-count != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.get-token.outputs.token }}
          OWNER_GH: ${{ steps.owner.outputs.github }}
        run: |
          set -euo pipefail
          NEW_IDS=$(node -e "console.log(JSON.parse(require('fs').readFileSync('audit-fix-result.json','utf8')).manual.map((e) => e.id).join(','))")
          NEW_SECTION="$(mktemp)"
          node -e "
            const entries = JSON.parse(require('fs').readFileSync('audit-fix-result.json','utf8')).manual;
            for (const e of entries) {
              console.log(\`- **\${e.pkg}** (\${e.severity}) — [\${e.id}](\${e.url || ''}): \${e.title}\`);
              console.log(\`  - Reason: \${e.reason}\`);
            }
          " > "$NEW_SECTION"

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label dependency-audit-manual --state open --json number --jq '.[0].number // empty')
          if [[ -n "$EXISTING" ]]; then
            # The skip-list step (above) only scans issue *bodies* for the
            # `<!-- audit-ids: ... -->` marker, not comments. Posting a
            # comment alone would leave every ID mentioned only there
            # invisible to that dedupe, so it gets re-collected, re-notified
            # in Slack, and re-sent to the AI on every subsequent run even
            # though it's already tracked here. Rewrite the body instead,
            # merging this run's IDs into the existing marker — the comment
            # below is just for a human-readable changelog of what changed.
            OLD_BODY=$(gh issue view "$EXISTING" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
            OLD_IDS=$(printf '%s' "$OLD_BODY" | grep -o '<!-- audit-ids: [^>]*-->' | sed -E 's/<!-- audit-ids: (.*) -->/\1/' || true)
            MERGED_IDS=$(OLD_IDS="$OLD_IDS" NEW_IDS="$NEW_IDS" node -e "
              const old = (process.env.OLD_IDS || '').split(',').map((s) => s.trim()).filter(Boolean);
              const fresh = (process.env.NEW_IDS || '').split(',').map((s) => s.trim()).filter(Boolean);
              console.log([...new Set([...old, ...fresh])].join(','));
            ")
            BODY_FILE="$(mktemp)"
            {
              printf '%s' "$OLD_BODY" | sed -E '/<!-- audit-ids: .* -->/d'
              echo
              cat "$NEW_SECTION"
              echo
              echo "<!-- audit-ids: ${MERGED_IDS} -->"
            } > "$BODY_FILE"
            gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$BODY_FILE"
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file "$NEW_SECTION"
            ISSUE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${EXISTING}"
          else
            BODY_FILE="$(mktemp)"
            {
              echo "\`yarn audit:ci\` found advisories that [dependency-audit-escalation](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) could not fix automatically (no safe version bump or resolutions pin, or the fix broke \`yarn dedupe\`/\`yarn constraints\`). See .github/audit-owners.yml for the owner, or add the ID to npmAuditIgnoreAdvisories in .yarnrc.yml (with a comment explaining why) to accept this as a risk instead of fixing it."
              echo
              cat "$NEW_SECTION"
              echo
              echo "<!-- audit-ids: ${NEW_IDS} -->"
            } > "$BODY_FILE"
            ISSUE_URL=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "Dependency audit: manual review needed" \
              --body-file "$BODY_FILE" \
              --label dependency-audit-manual \
              --assignee "$OWNER_GH")
          fi
          echo "issue-url=$ISSUE_URL" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (result)
        # `success()` (not always()) is deliberate: a bare `if:` on a custom
        # expression drops GitHub Actions' implicit success-only gate
        # entirely, so without spelling it out here this step would still
        # fire even after e.g. "Read audit owner" or "Checkout AI Analyzer"
        # failed — not just a fix/Get token failure — misleadingly implying
        # the run finished when it actually means the fix attempt and/or
        # tracking issue never ran at all. "Notify Slack (failure)" below
        # covers every one of those failure cases with its own dedicated
        # alert instead.
        if: ${{ success() && steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          AUDIT_RESULT_PATH: audit-fix-result.json
          PR_URL: ${{ steps.fix.outputs.pr-url }}
          ISSUE_URL: ${{ steps.manual-issue.outputs.issue-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Threads off the "detected" message when it fired, so both land
          # together in Slack. Empty when notify-detected was skipped/failed —
          # slack-audit-notification.mjs then just posts top-level.
          SLACK_THREAD_TS: ${{ steps.notify-detected.outputs.thread-ts }}
        run: node scripts/slack-audit-notification.mjs

      # "Notify Slack (result)" above uses success(), so it skips itself on
      # ANY upstream failure, not just fix/Get token (see its own comment).
      # This step exists purely to close the resulting gap: `failure()`
      # mirrors that same "any previous step failed" check, so the owner
      # still gets a dedicated alert instead of just the "detected" message
      # with no follow-up.
      - name: Notify Slack (failure)
        if: ${{ failure() && steps.audit.outputs.has-advisories == 'true' && steps.collect.outputs.manual-count != '0' }}
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_STAGE: failure
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_THREAD_TS: ${{ steps.notify-detected.outputs.thread-ts }}
          STEP_LABELS: ${{ steps.labels.outcome }}
          STEP_SKIP_LIST: ${{ steps.skip-list.outcome }}
          STEP_COLLECT: ${{ steps.collect.outcome }}
          STEP_OWNER: ${{ steps.owner.outcome }}
          STEP_NEXT_SEMVER: ${{ steps['next-semver'].outcome }}
          STEP_GET_TOKEN: ${{ steps.get-token.outcome }}
          STEP_CHECKOUT_AI_ANALYZER: ${{ steps['checkout-ai-analyzer'].outcome }}
          STEP_INSTALL_AI_ANALYZER_DEPS: ${{ steps['install-ai-analyzer-deps'].outcome }}
          STEP_FIX: ${{ steps.fix.outcome }}
          STEP_MANUAL_ISSUE: ${{ steps['manual-issue'].outcome }}
        run: |
          # Picks the first step (in job order) whose outcome is "failure" so
          # the alert names something more useful than "an unknown step" —
          # failure() firing this step at all no longer tells us which one on
          # its own, now that it covers every step above instead of just fix/
          # Get token.
          FAILED_STEP=$(node -e "
            const steps = [
              ['STEP_LABELS', 'Ensure dependency-audit labels exist'],
              ['STEP_SKIP_LIST', 'Build skip-list from open PRs/issues'],
              ['STEP_COLLECT', 'Collect advisories for AI-assisted review'],
              ['STEP_OWNER', 'Read audit owner'],
              ['STEP_NEXT_SEMVER', 'Get the next semver version'],
              ['STEP_GET_TOKEN', 'Get token'],
              ['STEP_CHECKOUT_AI_ANALYZER', 'Checkout AI Analyzer'],
              ['STEP_INSTALL_AI_ANALYZER_DEPS', 'Install AI Analyzer dependencies'],
              ['STEP_FIX', 'Attempt AI-assisted fix'],
              ['STEP_MANUAL_ISSUE', 'File or update tracking issue for advisories needing manual review'],
            ];
            const failed = steps.find(([key]) => process.env[key] === 'failure');
            console.log(failed ? failed[1] : '');
          ")
          FAILED_STEP="$FAILED_STEP" node scripts/slack-audit-notification.mjs
