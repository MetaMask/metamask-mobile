# Upload to Namespace and/or GitHub artifact stores, retrying Namespace action
# failures up to 3 times to absorb transient CreateArtifact ECONNREFUSED
# failures. Composite actions only expose the nested `uses:` step outcome, so
# non-retryable Namespace errors are not distinguished here yet.
# By default both stores must succeed on Namespace runners: GitHub API consumers
# (qa-stats, freeze-timings, gh run download) cannot see Namespace storage. See
# "Runner provider switch" in .github/CONTRIBUTING.md. Set skip-github=true for
# large Namespace-only artifacts that no GitHub API consumer needs.
name: 'Dual upload E2E artifact'
description: >
  Upload an artifact to the Namespace store and the GitHub store, retrying
  Namespace action failures up to 3 times. The step fails unless every required
  store succeeds. Set skip-github to upload Namespace-only (GitHub is still
  required when the runner is not Namespace).

inputs:
  name:
    description: 'Name of the artifact to upload.'
    required: true
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload.'
    required: true
  if-no-files-found:
    description: 'Behavior if no files are found (`warn`, `error`, or `ignore`).'
    required: false
    default: 'warn'
  retention-days:
    description: 'Artifact retention in days.'
    required: false
    default: '30'
  retry-wait-seconds:
    description: 'Seconds to wait between upload attempts for a given store.'
    required: false
    default: '15'
  runner-provider:
    description: 'Runner provider or runner label. Namespace upload is skipped unless this contains `namespace`.'
    required: true
  skip-github:
    description: >
      When true, skip the GitHub store upload. Use for large artifacts that only
      Namespace runners consume in the same workflow run. Ignored on non-Namespace
      runners (GitHub remains the only store).
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Upload to Namespace (attempt 1)
      id: ns-1
      if: ${{ contains(inputs.runner-provider, 'namespace') }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}

    - name: Wait before Namespace retry (attempt 2)
      if: ${{ contains(inputs.runner-provider, 'namespace') && steps.ns-1.outcome == 'failure' }}
      shell: bash
      env:
        ATTEMPT: '2'
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-e2e-artifact.mjs" retry-wait

    - name: Upload to Namespace (attempt 2)
      id: ns-2
      if: ${{ contains(inputs.runner-provider, 'namespace') && steps.ns-1.outcome == 'failure' }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Wait before Namespace retry (attempt 3)
      if: ${{ contains(inputs.runner-provider, 'namespace') && steps.ns-1.outcome == 'failure' && steps.ns-2.outcome == 'failure' }}
      shell: bash
      env:
        ATTEMPT: '3'
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-e2e-artifact.mjs" retry-wait

    - name: Upload to Namespace (attempt 3)
      id: ns-3
      if: ${{ contains(inputs.runner-provider, 'namespace') && steps.ns-1.outcome == 'failure' && steps.ns-2.outcome == 'failure' }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Upload to GitHub
      id: gh-1
      # skip-github only applies on Namespace (GitHub is the only store otherwise).
      if: ${{ inputs.skip-github != 'true' || !contains(inputs.runner-provider, 'namespace') }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Require required stores
      shell: bash
      env:
        NS_1: ${{ steps.ns-1.outcome }}
        NS_2: ${{ steps.ns-2.outcome }}
        NS_3: ${{ steps.ns-3.outcome }}
        GH_1: ${{ steps.gh-1.outcome }}
        RUNNER_PROVIDER: ${{ inputs.runner-provider }}
        SKIP_GITHUB: ${{ inputs.skip-github }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-e2e-artifact.mjs" require-both-stores
