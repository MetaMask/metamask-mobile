name: 'Find reusable build from prior run'
description: >-
  Searches recent workflow runs for a run whose fingerprint matches and whose
  required build artifacts are available. In latest-main mode, it instead
  selects the newest main-branch run with those artifacts. If a match is found,
  outputs the run id so a subsequent actions/download-artifact step can pull
  the artifacts directly instead of triggering a fresh native build.

  The third (cross-PR) tier is required because GitHub's `listWorkflowRuns`
  `branch` parameter filters against `head_branch` — the PR source branch for
  `pull_request` events — so branch-scoped lookups can never discover other
  PRs' runs. The cross-PR tier drops the branch filter and instead uses
  `event: pull_request` to let the fingerprint itself act as the cross-PR
  deduplication key.

  Each tier is swept once per run status (`success`, `in_progress`, `failure`,
  then `completed`) so that one crowded page of recent runs cannot consume the
  candidate window. A donor only needs to have uploaded its artifacts, not to
  have finished: the native build publishes the app roughly 25-35 minutes before
  the run completes, since E2E tests keep the run alive well past that point.

inputs:
  fingerprint:
    description: 'The @expo/fingerprint hash the candidate must match'
    required: false
    default: ''
  latest-main-only:
    description: >-
      When true, select the newest run on main with all required artifacts,
      without requiring a fingerprint or commit status.
    required: false
    default: 'false'
  artifact-names:
    description: 'JSON array of artifact names that must all be present on the candidate run'
    required: true
  metadata-artifact-name:
    description: >-
      Optional build metadata artifact name that must be present on the
      candidate run. The caller should download and validate this artifact
      before reusing native build artifacts.
    required: false
    default: ''
  github-token:
    description: 'GitHub token with `actions: read` and `statuses: read` permissions'
    required: true
  workflow-file:
    description: 'Workflow filename whose runs will be searched'
    required: false
    default: 'ci.yml'
  base-branch:
    description: 'Fallback branch when no same-branch match is found'
    required: false
    default: 'main'
  status-context:
    description: 'Commit status context that carries the fingerprint'
    required: false
    default: 'build-source-hash'
  max-candidates-per-branch:
    description: >-
      How many recent runs to inspect per branch-scoped tier (same-branch,
      base-branch), per conclusion sweep. Because sweeps filter server-side on
      run conclusion, this budget is spent on terminal runs rather than on
      in-flight ones — which matters most for the base-branch tier, where `main`
      CI runs longer than the merge cadence, so a large share of the newest runs
      are always still building.
    required: false
    default: '10'
  max-candidates-cross-pr:
    description: >-
      How many recent `pull_request`-event runs (across all branches) to inspect
      in the cross-PR tier, per conclusion sweep. The fingerprint filter is highly
      discriminating, so the practical cost is one `listCommitStatusesForRef` call
      per candidate until a run-specific status match is found.
    required: false
    default: '50'
  main-branch-only:
    description: >-
      When true, only search the base branch (typically `main`) for reusable
      builds. Used for PRs with test-only changes that should not compile fresh
      native artifacts.
    required: false
    default: 'false'

outputs:
  found:
    description: "'true' when a reusable run was found"
    value: ${{ steps.lookup.outputs.found }}
  run-id:
    description: 'Workflow run id that produced the reusable artifacts'
    value: ${{ steps.lookup.outputs.run-id }}
  source-sha:
    description: 'Commit SHA of the reusable run'
    value: ${{ steps.lookup.outputs.source-sha }}
  source-branch:
    description: 'Branch of the reusable run (same-branch or base-branch)'
    value: ${{ steps.lookup.outputs.source-branch }}

runs:
  using: 'composite'
  steps:
    - name: Search prior runs for matching fingerprint
      id: lookup
      uses: actions/github-script@v7
      continue-on-error: true
      env:
        TARGET_FINGERPRINT: ${{ inputs.fingerprint }}
        ARTIFACT_NAMES_JSON: ${{ inputs.artifact-names }}
        METADATA_ARTIFACT_NAME: ${{ inputs.metadata-artifact-name }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        BASE_BRANCH: ${{ inputs.base-branch }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        MAX_CANDIDATES: ${{ inputs.max-candidates-per-branch }}
        MAX_CANDIDATES_CROSS_PR: ${{ inputs.max-candidates-cross-pr }}
        MAIN_BRANCH_ONLY: ${{ inputs.main-branch-only }}
        LATEST_MAIN_ONLY: ${{ inputs.latest-main-only }}
        HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        CURRENT_RUN_ID: ${{ github.run_id }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const {
            TARGET_FINGERPRINT,
            ARTIFACT_NAMES_JSON,
            METADATA_ARTIFACT_NAME,
            WORKFLOW_FILE,
            BASE_BRANCH,
            STATUS_CONTEXT,
            MAX_CANDIDATES,
            MAX_CANDIDATES_CROSS_PR,
            MAIN_BRANCH_ONLY,
            LATEST_MAIN_ONLY,
            HEAD_BRANCH,
            HEAD_SHA,
            CURRENT_RUN_ID,
          } = process.env;

          const setNotFound = () => {
            core.setOutput('found', 'false');
            core.setOutput('run-id', '');
            core.setOutput('source-sha', '');
            core.setOutput('source-branch', '');
          };

          if (!TARGET_FINGERPRINT) {
            if (LATEST_MAIN_ONLY !== 'true') {
              core.warning('No fingerprint provided; skipping lookup');
              setNotFound();
              return;
            }
            core.info('No fingerprint provided; using latest-main artifact lookup');
          }

          let requiredArtifacts;
          try {
            requiredArtifacts = JSON.parse(ARTIFACT_NAMES_JSON);
          } catch (err) {
            core.warning(`Could not parse artifact-names input: ${err.message}`);
            setNotFound();
            return;
          }
          if (!Array.isArray(requiredArtifacts) || requiredArtifacts.length === 0) {
            core.warning('artifact-names must be a non-empty JSON array');
            setNotFound();
            return;
          }
          const metadataArtifactName = METADATA_ARTIFACT_NAME.trim();
          const allRequiredArtifacts = metadataArtifactName
            ? [...requiredArtifacts, metadataArtifactName]
            : requiredArtifacts;

          const maxCandidates = Number(MAX_CANDIDATES) || 10;
          const maxCandidatesCrossPr = Number(MAX_CANDIDATES_CROSS_PR) || 50;
          const currentRunId = String(CURRENT_RUN_ID);

          // Three-tier discovery:
          //   1. same-branch  — fastest path, catches retries and new commits
          //                     on the current PR.
          //   2. base-branch  — catches post-merge CI runs on `main`. Only
          //                     matches `push`-event runs (pull_request runs
          //                     have head_branch=<source branch>, not main).
          //   3. cross-pr     — searches recent `pull_request` runs across
          //                     ALL source branches so two unrelated PRs with
          //                     the same fingerprint can reuse each other's
          //                     artifacts. This tier deliberately drops the
          //                     `branch` filter; without it, branch-scoped
          //                     lookups can never discover another PR's run
          //                     (GitHub filters `branch` against head_branch,
          //                     which is the PR source branch).
          const tiers = [];
          const mainBranchOnly = MAIN_BRANCH_ONLY === 'true';
          const latestMainOnly = LATEST_MAIN_ONLY === 'true';

          if (!mainBranchOnly && !latestMainOnly) {
            tiers.push({
              label: `same-branch (branch=${HEAD_BRANCH})`,
              params: { branch: HEAD_BRANCH, per_page: maxCandidates },
            });
          }

          if (BASE_BRANCH && (mainBranchOnly || latestMainOnly || BASE_BRANCH !== HEAD_BRANCH)) {
            tiers.push({
              label: `base-branch (branch=${BASE_BRANCH})`,
              params: { branch: BASE_BRANCH, per_page: maxCandidates },
            });
          }

          if (!mainBranchOnly && !latestMainOnly) {
            tiers.push({
              label: `cross-pr (event=pull_request, any branch, last ${maxCandidatesCrossPr} runs)`,
              params: { event: 'pull_request', per_page: maxCandidatesCrossPr },
              // Skip runs already visited by the same-branch tier to avoid
              // wasting API calls on duplicates.
              skipHeadBranch: HEAD_BRANCH,
            });
          }

          async function hasRunFingerprintStatus(sha, runId) {
            try {
              const runPathPattern = new RegExp(`/actions/runs/${runId}(?:$|[/?#])`);
              const statuses = await github.paginate(
                github.rest.repos.listCommitStatusesForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: sha,
                  per_page: 100,
                },
              );
              return statuses.some((status) => {
                const targetUrl = String(status.target_url || '');
                return (
                  status.context === STATUS_CONTEXT &&
                  status.description === TARGET_FINGERPRINT &&
                  runPathPattern.test(targetUrl)
                );
              });
            } catch (err) {
              core.info(`listCommitStatusesForRef failed for ${sha}: ${err.message}`);
              return false;
            }
          }

          async function hasAllArtifacts(runId) {
            try {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: runId,
                  per_page: 100,
                },
              );
              const available = new Set(
                artifacts
                  .filter((a) => !a.expired)
                  .map((a) => a.name),
              );
              const missing = allRequiredArtifacts.filter((n) => !available.has(n));
              if (missing.length > 0) {
                core.info(`Run ${runId} missing artifacts: ${missing.join(', ')}`);
                return false;
              }
              return true;
            } catch (err) {
              core.info(`listWorkflowRunArtifacts failed for ${runId}: ${err.message}`);
              return false;
            }
          }

          const seenRunIds = new Set();
          seenRunIds.add(currentRunId);

          // Rate-limit accounting. The `/rate_limit` endpoint is itself free, so
          // reading it before and after the search costs nothing and tells us how
          // much of the hourly core budget one lookup actually consumes.
          async function readRateLimit() {
            try {
              const { data } = await github.rest.rateLimit.get();
              return data.resources.core;
            } catch (err) {
              core.info(`rateLimit.get failed: ${err.message}`);
              return null;
            }
          }

          const rateLimitBefore = await readRateLimit();

          async function logRateLimit() {
            const after = await readRateLimit();
            if (!after) return;
            const used = rateLimitBefore ? rateLimitBefore.remaining - after.remaining : null;
            const resetAt = new Date(after.reset * 1000).toISOString();
            core.info(
              `Rate limit (core): ${after.remaining}/${after.limit} remaining, ` +
              `${used === null ? 'unknown' : used} request(s) used by this lookup, resets at ${resetAt}`,
            );
            if (after.remaining < after.limit * 0.1) {
              core.warning(
                `GitHub API core rate limit is low: ${after.remaining}/${after.limit} remaining until ${resetAt}`,
              );
            }
          }

          // Each tier is swept once per run status below, applied server-side via
          // the `status` filter so that a single crowded page of recent runs can't
          // consume a tier's candidate window. On a busy repo the newest runs are
          // dominated by in-flight runs and by runs that concurrency cancelled
          // mid-build; sweeping per status keeps each category's budget separate.
          //
          // Order matters, and it is deliberately not "terminal states first":
          //
          //   success     - a fully green run is the most conservative donor.
          //   in_progress - a run only needs to have *uploaded* its artifacts to be
          //                 a valid donor; it does not need to have finished. The
          //                 native build completes roughly 25-35 minutes before the
          //                 run itself does, because E2E tests keep the run alive
          //                 long after the `.app` is published. Skipping these runs
          //                 discarded a complete, verified build for that entire
          //                 window - measured at 8 of 18 cold-fingerprint rebuilds,
          //                 one of them with a donor that had been ready 32 minutes.
          //                 `hasAllArtifacts` below is what makes this safe: a run
          //                 mid-upload simply fails that check and is skipped.
          //   failure     - a run can fail on a job unrelated to the native build
          //                 while still holding complete artifacts.
          //   completed   - last resort; picks up cancelled, timed-out and neutral
          //                 runs, preserving reach.
          //
          // `queued` is intentionally not swept: such runs cannot have artifacts yet,
          // so they would only cost API calls.
          const statusSweeps = ['success', 'in_progress', 'failure', 'completed'];

          async function listCandidates(tier, status) {
            try {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: WORKFLOW_FILE,
                status,
                ...tier.params,
              });
              return data.workflow_runs || [];
            } catch (err) {
              core.warning(
                `listWorkflowRuns failed for tier "${tier.label}" (status=${status}): ${err.message}`,
              );
              return [];
            }
          }

          async function findMatch(tier, runs) {
            for (const run of runs) {
              const runIdStr = String(run.id);
              if (seenRunIds.has(runIdStr)) continue;
              seenRunIds.add(runIdStr);

              if (tier.skipHeadBranch && run.head_branch === tier.skipHeadBranch) continue;

              // Deliberately no `run.status === 'completed'` gate: artifact
              // availability, not run completion, is what makes a donor usable, and
              // `hasAllArtifacts` verifies that below.
              if (
                !latestMainOnly &&
                !(await hasRunFingerprintStatus(run.head_sha, run.id))
              ) {
                core.info(`Run ${run.id} has no run-specific ${STATUS_CONTEXT} status matching fingerprint ${TARGET_FINGERPRINT}`);
                continue;
              }

              if (!(await hasAllArtifacts(run.id))) continue;

              return run;
            }
            return null;
          }

          for (const tier of tiers) {
            core.info(`Searching tier: ${tier.label}`);

            for (const status of statusSweeps) {
              const runs = await listCandidates(tier, status);
              core.info(`  sweep status=${status}: ${runs.length} run(s) returned`);

              const match = await findMatch(tier, runs);
              if (!match) continue;

              core.info(
                `Match: tier="${tier.label}" status=${status} run=${match.id} sha=${match.head_sha} branch=${match.head_branch} url=${match.html_url}`,
              );
              core.setOutput('found', 'true');
              core.setOutput('run-id', String(match.id));
              core.setOutput('source-sha', match.head_sha);
              core.setOutput('source-branch', match.head_branch || '');
              await logRateLimit();
              return;
            }
          }

          core.info('No reusable build found across any tier');
          await logRateLimit();
          setNotFound();
