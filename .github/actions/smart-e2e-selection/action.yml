name: 'Smart E2E Selection'
description: 'Run AI-powered E2E test selection based on code changes'
inputs:
  github-token:
    description: 'GitHub token for PR comments and gh PR file access'
    required: true
  pr-number:
    description: 'Pull request number for commenting'
    required: true
  repository:
    description: 'Repository name (owner/repo) for commenting'
    required: true
  post-comment:
    description: 'Whether to post a comment to the PR via the analyzer comment API'
    required: false
    default: 'false'
  base-ref:
    description: 'PR base branch ref passed to the AI analysis script for diff comparison.'
    required: false
    default: ''
  analyzer-ref:
    description: 'MetaMask/ai-analyzer git ref (branch, tag, or SHA)'
    required: false
    # Pin to ai-analyzer main (mode-driven comments/labels + hard-rule plugins).
    default: 'c592f54e7920f8834938226165d25a5351b8e78b'
  analyzer-token:
    description: 'Token with read access to MetaMask/ai-analyzer'
    required: true
  litellm-api-key:
    description: 'LiteLLM API key for the shared analyzer'
    required: true
  langfuse-public-key:
    description: 'Optional Langfuse public key'
    required: false
    default: ''
  langfuse-secret-key:
    description: 'Optional Langfuse secret key'
    required: false
    default: ''
outputs:
  ai_e2e_test_tags:
    description: 'E2E test tags to run (JSON array format)'
    value: ${{ steps.final-outputs.outputs.ai_e2e_test_tags }}
  ai_confidence:
    description: 'AI confidence score (0-100)'
    value: ${{ steps.final-outputs.outputs.ai_confidence }}
  ai_performance_test_tags:
    description: 'Performance test tags to run. Empty string '''' = run all (conservative fallback). Literal ''[]'' = skip (AI found no relevant changes). ''["@Tag",...]'' = run specific tags.'
    value: ${{ steps.final-outputs.outputs.ai_performance_test_tags }}
  ai_performance_test_reasoning:
    description: 'Reasoning for the performance test selection'
    value: ${{ steps.final-outputs.outputs.ai_performance_test_reasoning }}

runs:
  using: 'composite'
  steps:
    - name: Check skip-smart-e2e-selection label
      id: check-skip-label
      if: inputs.pr-number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        echo "SKIP=false" >> "$GITHUB_OUTPUT"
        if gh pr view ${{ inputs.pr-number }} --repo ${{ inputs.repository }} --json labels --jq '.labels[].name' | grep -qx "skip-smart-e2e-selection"; then
          echo "SKIP=true" >> "$GITHUB_OUTPUT"
          echo "⏭️ SKIP=true due to 'skip-smart-e2e-selection' label on PR"
        fi

    - name: Checkout for PR analysis
      if: steps.check-skip-label.outputs.SKIP != 'true'
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Disable sparse checkout and restore all files
      if: steps.check-skip-label.outputs.SKIP != 'true'
      shell: bash
      run: |
        git sparse-checkout disable
        git checkout HEAD -- .

    - name: Fetch base branch for comparison
      if: steps.check-skip-label.outputs.SKIP != 'true'
      shell: bash
      run: |
        git fetch --unshallow 2>/dev/null || true
        git fetch origin "${{ inputs.base-ref || 'main' }}" 2>/dev/null || true

    - name: Checkout AI Analyzer
      if: steps.check-skip-label.outputs.SKIP != 'true'
      uses: actions/checkout@v6
      with:
        repository: MetaMask/ai-analyzer
        ref: ${{ inputs.analyzer-ref }}
        path: .ai-analyzer-action
        token: ${{ inputs.analyzer-token }}

    - name: Setup Node.js
      if: steps.check-skip-label.outputs.SKIP != 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: npm
        cache-dependency-path: .ai-analyzer-action/package-lock.json

    - name: Install AI Analyzer dependencies
      if: steps.check-skip-label.outputs.SKIP != 'true'
      shell: bash
      working-directory: .ai-analyzer-action
      run: npm ci

    - name: Run Smart E2E analysis
      id: run-analysis
      if: steps.check-skip-label.outputs.SKIP != 'true'
      working-directory: ${{ github.workspace }}
      shell: bash
      env:
        LITELLM_API_KEY: ${{ inputs.litellm-api-key }}
        AI_ANALYZER_LANGFUSE_PUBLIC_KEY: ${{ inputs.langfuse-public-key }}
        AI_ANALYZER_LANGFUSE_SECRET_KEY: ${{ inputs.langfuse-secret-key }}
        GH_TOKEN: ${{ inputs.github-token }}
        CI: 'true'
        ACTION_PATH: ${{ github.workspace }}/.ai-analyzer-action
        INPUT_CONFIG_PATH: .ai-pr-analyzer
        INPUT_MODE: smart-e2e
        AI_ANALYZER_METAMASK_SKILLS: 'true'
        PR_NUMBER: ${{ inputs.pr-number }}
        BASE_REF: ${{ inputs.base-ref }}
      run: |
        if [[ -n "$BASE_REF" ]]; then
          export BASE_BRANCH="origin/${BASE_REF}"
        else
          export BASE_BRANCH="origin/main"
        fi
        echo "✅ Running shared-engine smart-e2e for PR #$PR_NUMBER (analyzer ref: ${{ inputs.analyzer-ref }}, base: $BASE_BRANCH)"
        node "$ACTION_PATH/scripts/run-analysis.mjs"

    - name: Post analysis results
      if: steps.check-skip-label.outputs.SKIP != 'true'
      continue-on-error: true
      working-directory: ${{ github.workspace }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.workspace }}/.ai-analyzer-action
        GH_TOKEN: ${{ inputs.github-token }}
        ADD_COMMENT: ${{ inputs.post-comment }}
        ADD_LABEL: 'false'
        PR_NUMBER: ${{ inputs.pr-number }}
        RESULT_JSON: ${{ steps.run-analysis.outputs.result_json }}
      run: node "$ACTION_PATH/scripts/post-results.mjs"

    - name: Set skip outputs
      id: skip-outputs
      if: steps.check-skip-label.outputs.SKIP == 'true'
      shell: bash
      run: |
        echo "ai_e2e_test_tags=[\"ALL\"]" >> "$GITHUB_OUTPUT"
        echo "ai_confidence=100" >> "$GITHUB_OUTPUT"
        # Skip label → run all E2E (ALL) but do NOT launch the PR performance workflow.
        echo "ai_performance_test_tags=[]" >> "$GITHUB_OUTPUT"

    - name: Map analyzer outputs
      id: mapped-outputs
      if: steps.check-skip-label.outputs.SKIP != 'true'
      shell: bash
      env:
        RESULT_JSON: ${{ steps.run-analysis.outputs.result_json }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: node .github/actions/smart-e2e-selection/e2e-smart-selection.mjs

    - name: Set final outputs with fallback
      id: final-outputs
      if: always()
      shell: bash
      env:
        SKIPPED: ${{ steps.check-skip-label.outputs.SKIP }}
        SKIP_E2E_TAGS: ${{ steps.skip-outputs.outputs.ai_e2e_test_tags }}
        SKIP_CONFIDENCE: ${{ steps.skip-outputs.outputs.ai_confidence }}
        SKIP_PERF_TAGS: ${{ steps.skip-outputs.outputs.ai_performance_test_tags }}
        MAPPED_E2E_TAGS: ${{ steps.mapped-outputs.outputs.ai_e2e_test_tags }}
        MAPPED_CONFIDENCE: ${{ steps.mapped-outputs.outputs.ai_confidence }}
        MAPPED_PERF_TAGS: ${{ steps.mapped-outputs.outputs.ai_performance_test_tags }}
        MAPPED_PERF_REASONING: ${{ steps.mapped-outputs.outputs.ai_performance_test_reasoning }}
      run: |
        if [[ "$SKIPPED" == "true" ]]; then
          printf 'ai_e2e_test_tags=%s\n' "${SKIP_E2E_TAGS:-[\"ALL\"]}" >> "$GITHUB_OUTPUT"
          printf 'ai_confidence=%s\n' "${SKIP_CONFIDENCE:-100}" >> "$GITHUB_OUTPUT"
          printf 'ai_performance_test_tags=%s\n' "${SKIP_PERF_TAGS:-[]}" >> "$GITHUB_OUTPUT"
          {
            echo 'ai_performance_test_reasoning<<GHEOF'
            echo "Smart E2E selection skipped"
            echo 'GHEOF'
          } >> "$GITHUB_OUTPUT"
        else
          if [[ -n "$MAPPED_E2E_TAGS" ]]; then
            printf 'ai_e2e_test_tags=%s\n' "$MAPPED_E2E_TAGS" >> "$GITHUB_OUTPUT"
          else
            echo 'ai_e2e_test_tags=["ALL"]' >> "$GITHUB_OUTPUT"
          fi
          printf 'ai_confidence=%s\n' "${MAPPED_CONFIDENCE:-0}" >> "$GITHUB_OUTPUT"
          printf 'ai_performance_test_tags=%s\n' "$MAPPED_PERF_TAGS" >> "$GITHUB_OUTPUT"
          {
            echo 'ai_performance_test_reasoning<<GHEOF'
            echo "$MAPPED_PERF_REASONING"
            echo 'GHEOF'
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Display AI Analysis Outputs
      if: always()
      shell: bash
      env:
        PERF_REASONING: ${{ steps.final-outputs.outputs.ai_performance_test_reasoning }}
      run: |
        echo "📊 Final GitHub Action Outputs:"
        echo "================================"
        echo "ai_e2e_test_tags: ${{ steps.final-outputs.outputs.ai_e2e_test_tags }}"
        echo "ai_confidence: ${{ steps.final-outputs.outputs.ai_confidence }}"
        echo "ai_performance_test_tags: ${{ steps.final-outputs.outputs.ai_performance_test_tags }}"
        echo "ai_performance_test_reasoning: $PERF_REASONING"
        echo "================================"

    - name: Delete legacy Smart E2E comments
      if: inputs.post-comment == 'true' && inputs.pr-number != '' && inputs.github-token != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        ALL_COMMENT_IDS=$(gh api "repos/${{ inputs.repository }}/issues/${{ inputs.pr-number }}/comments" \
          --jq '.[] | select(.body | contains("<!-- smart-e2e-selection -->")) | .id')

        if [ -z "$ALL_COMMENT_IDS" ]; then
          echo "📝 No legacy Smart E2E selection comments found"
          exit 0
        fi

        echo "$ALL_COMMENT_IDS" | while read -r COMMENT_ID; do
          if [ -n "$COMMENT_ID" ]; then
            echo "🗑️ Deleting legacy comment: $COMMENT_ID"
            gh api "repos/${{ inputs.repository }}/issues/comments/$COMMENT_ID" \
              --method DELETE > /dev/null 2>&1 || echo "   ⚠️ Failed to delete comment $COMMENT_ID"
          fi
        done

    - name: Post skip comment
      if: >-
        inputs.post-comment == 'true' &&
        inputs.pr-number != '' &&
        inputs.github-token != '' &&
        steps.check-skip-label.outputs.SKIP == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        MARKER="<!-- ai-pr-analysis -->"
        BODY="${MARKER}"$'\n'"## Smart E2E Test Selection"$'\n\n'"⏭️ **Smart E2E selection skipped** - skip-smart-e2e-selection label found"$'\n\n'"All E2E tests pre-selected."
        EXISTING_ID=$(gh api "repos/${{ inputs.repository }}/issues/${{ inputs.pr-number }}/comments" \
          --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -n 1)

        if [ -n "$EXISTING_ID" ]; then
          gh api "repos/${{ inputs.repository }}/issues/comments/${EXISTING_ID}" \
            --method PATCH -f body="$BODY" > /dev/null
          echo "✅ Updated skip comment"
        else
          gh pr comment ${{ inputs.pr-number }} --repo ${{ inputs.repository }} --body "$BODY"
          echo "✅ Created skip comment"
        fi
