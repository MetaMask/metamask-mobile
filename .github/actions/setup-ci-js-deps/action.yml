name: 'Setup CI JS dependencies'
description: >
  Sets up node_modules and project build outputs for CI jobs.
  On Namespace runners, restores the shared cache volume and skips
  yarn install and setup when the cached install was produced from the
  same lockfile, patches and Node version; otherwise runs
  yarn install --immutable and the GitHub CI setup.
  On non-Namespace runners, installs from scratch unless node_modules is
  already present from a same-run artifact.

inputs:
  runner_provider:
    description: 'Runner provider (`namespace` or any GitHub-hosted value).'
    required: false
    default: 'current'

runs:
  using: 'composite'
  steps:
    - name: Configure Namespace cache
      if: ${{ inputs.runner_provider == 'namespace' }}
      uses: namespacelabs/nscloud-cache-action@15799a6b54e5765f85b2aac25b3f0df43ed571c0 # v1
      with:
        path: |
          ~/.cache/yarn
          ~/.cache/metamask-ci-install
          .metamask
          node_modules
          .yarn/cache

    # Run before setup-node so yarn cache is only enabled when this job installs deps.
    - name: Determine if install is needed
      id: check-deps
      shell: bash
      env:
        RUNNER_PROVIDER: ${{ inputs.runner_provider }}
        INSTALL_STATE_KEY: ${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', '.nvmrc', '.yarn/patches/**') }}
      run: |
        set -euo pipefail
        install_state_dir="$HOME/.cache/metamask-ci-install"

        if [ "${RUNNER_PROVIDER}" = "namespace" ]; then
          # The Namespace volume is shared across runs, so node_modules is only
          # reusable when the install recorded in this state dir matches the
          # current lockfile. The state dir is written by the same job that
          # produced node_modules, so the two stay in sync.
          if [ -d node_modules ] \
            && [ -f "$install_state_dir/key" ] \
            && [ "$(cat "$install_state_dir/key")" = "$INSTALL_STATE_KEY" ] \
            && [ -f "$install_state_dir/termsOfUseContent.ts" ] \
            && [ -f "$install_state_dir/termsOfUse.html" ]; then
            cp "$install_state_dir/termsOfUseContent.ts" app/util/termsOfUse/termsOfUseContent.ts
            cp "$install_state_dir/termsOfUse.html" docs/assets/termsOfUse.html
            echo "needs-install=false" >> "$GITHUB_OUTPUT"
          else
            # The state dir is a Namespace cache mount point, so clear its contents
            # instead of removing the directory itself.
            mkdir -p "$install_state_dir"
            find "$install_state_dir" -mindepth 1 -delete
            echo "needs-install=true" >> "$GITHUB_OUTPUT"
          fi
        elif [ -d node_modules ] && [ -f app/util/termsOfUse/termsOfUseContent.ts ]; then
          echo "needs-install=false" >> "$GITHUB_OUTPUT"
        else
          echo "needs-install=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@v6
      with:
        node-version-file: '.nvmrc'
        cache: ${{ inputs.runner_provider != 'namespace' && steps.check-deps.outputs.needs-install == 'true' && 'yarn' || '' }}

    # Namespace: install only when the cached volume does not match the lockfile.
    # Non-Namespace: skip install when node_modules was extracted from a same-run
    # artifact; run install when starting from a clean workspace.
    - name: Install Yarn dependencies with retry
      if: ${{ steps.check-deps.outputs.needs-install == 'true' }}
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 #v4
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 30
        command: yarn install --immutable

    - name: Run project setup
      if: ${{ steps.check-deps.outputs.needs-install == 'true' }}
      shell: bash
      run: yarn setup:github-ci --node

    - name: Record install state (Namespace)
      if: ${{ inputs.runner_provider == 'namespace' && steps.check-deps.outputs.needs-install == 'true' }}
      shell: bash
      env:
        INSTALL_STATE_KEY: ${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', '.nvmrc', '.yarn/patches/**') }}
      run: |
        set -euo pipefail
        install_state_dir="$HOME/.cache/metamask-ci-install"
        mkdir -p "$install_state_dir"
        cp app/util/termsOfUse/termsOfUseContent.ts "$install_state_dir/termsOfUseContent.ts"
        cp docs/assets/termsOfUse.html "$install_state_dir/termsOfUse.html"
        printf '%s' "$INSTALL_STATE_KEY" > "$install_state_dir/key"
