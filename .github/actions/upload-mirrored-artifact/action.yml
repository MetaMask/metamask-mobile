# Upload to both Namespace and GitHub artifact stores, retrying each on
# transient CreateArtifact ECONNREFUSED (INFRA-3902). Both stores must succeed:
# GitHub API consumers (qa-stats, freeze-timings, gh run download) cannot see
# Namespace storage. See "Runner provider switch" in .github/CONTRIBUTING.md.
name: 'Upload mirrored artifact'
description: >
  Upload an artifact to the Namespace store and the GitHub store, retrying each
  up to 3 times. The step fails unless both stores succeed.

inputs:
  name:
    description: 'Name of the artifact to upload.'
    required: true
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload.'
    required: true
  if-no-files-found:
    description: 'Behavior if no files are found (`warn`, `error`, or `ignore`).'
    required: false
    default: 'warn'
  retention-days:
    description: 'Artifact retention in days.'
    required: false
    default: '30'
  retry-wait-seconds:
    description: 'Seconds to wait between upload attempts for a given store.'
    required: false
    default: '15'

runs:
  using: 'composite'
  steps:
    - name: Upload to Namespace (attempt 1)
      id: ns-1
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}

    - name: Wait before Namespace retry (attempt 2)
      if: ${{ steps.ns-1.outcome == 'failure' }}
      shell: bash
      env:
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: |
        echo "::warning::Namespace store upload failed; retrying after ${RETRY_WAIT_SECONDS}s (INFRA-3902)"
        sleep "$RETRY_WAIT_SECONDS"

    - name: Upload to Namespace (attempt 2)
      id: ns-2
      if: ${{ steps.ns-1.outcome == 'failure' }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Wait before Namespace retry (attempt 3)
      if: ${{ steps.ns-1.outcome == 'failure' && steps.ns-2.outcome == 'failure' }}
      shell: bash
      env:
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: |
        echo "::warning::Namespace store upload failed again; retrying after ${RETRY_WAIT_SECONDS}s (INFRA-3902)"
        sleep "$RETRY_WAIT_SECONDS"

    - name: Upload to Namespace (attempt 3)
      id: ns-3
      if: ${{ steps.ns-1.outcome == 'failure' && steps.ns-2.outcome == 'failure' }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Upload to GitHub (attempt 1)
      id: gh-1
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Wait before GitHub retry (attempt 2)
      if: ${{ steps.gh-1.outcome == 'failure' }}
      shell: bash
      env:
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: |
        echo "::warning::GitHub store upload failed; retrying after ${RETRY_WAIT_SECONDS}s (INFRA-3902)"
        sleep "$RETRY_WAIT_SECONDS"

    - name: Upload to GitHub (attempt 2)
      id: gh-2
      if: ${{ steps.gh-1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Wait before GitHub retry (attempt 3)
      if: ${{ steps.gh-1.outcome == 'failure' && steps.gh-2.outcome == 'failure' }}
      shell: bash
      env:
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: |
        echo "::warning::GitHub store upload failed again; retrying after ${RETRY_WAIT_SECONDS}s (INFRA-3902)"
        sleep "$RETRY_WAIT_SECONDS"

    - name: Upload to GitHub (attempt 3)
      id: gh-3
      if: ${{ steps.gh-1.outcome == 'failure' && steps.gh-2.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Require both stores
      shell: bash
      env:
        NS_1: ${{ steps.ns-1.outcome }}
        NS_2: ${{ steps.ns-2.outcome }}
        NS_3: ${{ steps.ns-3.outcome }}
        GH_1: ${{ steps.gh-1.outcome }}
        GH_2: ${{ steps.gh-2.outcome }}
        GH_3: ${{ steps.gh-3.outcome }}
      run: |
        ns_ok=false
        gh_ok=false
        if [[ "$NS_1" == success || "$NS_2" == success || "$NS_3" == success ]]; then
          ns_ok=true
        fi
        if [[ "$GH_1" == success || "$GH_2" == success || "$GH_3" == success ]]; then
          gh_ok=true
        fi
        if [[ "$ns_ok" == true && "$gh_ok" == true ]]; then
          echo 'Uploaded to Namespace and GitHub stores'
          exit 0
        fi
        echo "::error::Mirrored artifact upload failed (namespace=${ns_ok} github=${gh_ok}). Both stores must succeed."
        exit 1
