# Upload to both Namespace and GitHub artifact stores, retrying retryable
# Namespace upload action failures to absorb transient CreateArtifact ECONNREFUSED
# failures. Composite actions cannot inspect failure details from a
# nested `uses:` action before deciding whether to retry, so nested action
# failures are classified as retryable unless a non-retryable error is available.
# Both stores must succeed:
# GitHub API consumers (qa-stats, freeze-timings, gh run download) cannot see
# Namespace storage. See "Runner provider switch" in .github/CONTRIBUTING.md.
name: 'Dual upload artifact'
description: >
  Upload an artifact to the Namespace store and the GitHub store. Namespace
  upload failures are classified before retrying and may retry up to 3 times to
  absorb transient artifact service errors. The step fails unless every required
  store succeeds.

inputs:
  name:
    description: 'Name of the artifact to upload.'
    required: true
  path:
    description: 'A file, directory or wildcard pattern that describes what to upload.'
    required: true
  if-no-files-found:
    description: 'Behavior if no files are found (`warn`, `error`, or `ignore`).'
    required: false
    default: 'warn'
  retention-days:
    description: 'Artifact retention in days.'
    required: false
    default: '30'
  retry-wait-seconds:
    description: 'Seconds to wait between upload attempts for a given store.'
    required: false
    default: '15'
  runner-provider:
    description: 'Runner provider or runner label. Namespace upload is skipped unless this contains `namespace`.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Upload to Namespace (attempt 1)
      id: ns-1
      if: ${{ contains(inputs.runner-provider, 'namespace') }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}

    - name: Classify Namespace retry (attempt 2)
      id: ns-retry-2
      if: ${{ contains(inputs.runner-provider, 'namespace') && steps.ns-1.outcome == 'failure' }}
      shell: bash
      env:
        ATTEMPT: '2'
        PREVIOUS_OUTCOMES: failure
        RUNNER_PROVIDER: ${{ inputs.runner-provider }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-artifact.mjs" namespace-retry-decision

    - name: Wait before Namespace retry (attempt 2)
      if: ${{ steps.ns-retry-2.outputs.retryable == 'true' }}
      shell: bash
      env:
        ATTEMPT: '2'
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-artifact.mjs" retry-wait

    - name: Upload to Namespace (attempt 2)
      id: ns-2
      if: ${{ steps.ns-retry-2.outputs.retryable == 'true' }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Classify Namespace retry (attempt 3)
      id: ns-retry-3
      if: ${{ contains(inputs.runner-provider, 'namespace') && steps.ns-1.outcome == 'failure' && steps.ns-2.outcome == 'failure' }}
      shell: bash
      env:
        ATTEMPT: '3'
        PREVIOUS_OUTCOMES: failure,failure
        RUNNER_PROVIDER: ${{ inputs.runner-provider }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-artifact.mjs" namespace-retry-decision

    - name: Wait before Namespace retry (attempt 3)
      if: ${{ steps.ns-retry-3.outputs.retryable == 'true' }}
      shell: bash
      env:
        ATTEMPT: '3'
        RETRY_WAIT_SECONDS: ${{ inputs.retry-wait-seconds }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-artifact.mjs" retry-wait

    - name: Upload to Namespace (attempt 3)
      id: ns-3
      if: ${{ steps.ns-retry-3.outputs.retryable == 'true' }}
      continue-on-error: true
      uses: namespace-actions/upload-artifact@f6ccaacc655aec41b93af180d1d7eef21af862d2 # v1.0.3
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Upload to GitHub
      id: gh-1
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: true

    - name: Require both stores
      shell: bash
      env:
        NS_1: ${{ steps.ns-1.outcome }}
        NS_2: ${{ steps.ns-2.outcome }}
        NS_3: ${{ steps.ns-3.outcome }}
        GH_1: ${{ steps.gh-1.outcome }}
        RUNNER_PROVIDER: ${{ inputs.runner-provider }}
      run: node "$GITHUB_ACTION_PATH/dual-upload-artifact.mjs" require-both-stores
