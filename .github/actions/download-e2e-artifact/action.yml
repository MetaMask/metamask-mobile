# Download from the artifact store that matches the selected runner provider.
# Namespace runners read Namespace storage; current runners read GitHub storage.
name: 'Download E2E artifact'
description: >
  Download an artifact from Namespace storage when runner-provider contains
  namespace, otherwise download it from GitHub artifact storage.

inputs:
  name:
    description: 'Name of the artifact to download.'
    required: true
  path:
    description: 'Destination path for the downloaded artifact.'
    required: true
  runner-provider:
    description: 'Runner provider or runner label. Namespace download is used when this contains `namespace`.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Download from Namespace
      if: ${{ contains(inputs.runner-provider, 'namespace') }}
      uses: namespace-actions/download-artifact@7cbad919e4b0e09f17e9d6311a444ff002992b5b # v2.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - name: Download from GitHub
      if: ${{ !contains(inputs.runner-provider, 'namespace') }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
