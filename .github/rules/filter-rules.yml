# Filter rules for determining `ci` workflow requirements
# Used with dorny/paths-filter action
#
# Each filter creates two outputs:
# - {filter_name}: 'true'/'false' if any changed files match any filter rules
# - {filter_name}_count: number of matching files
#
# E2E STRATEGY: Use separate filters to detect different file types non E2E related.
# Conservative approach - add only files that safely allow skipping E2E tests.

# DOCUMENTATION FILES
documentation_files: &documentation_files
  - '**/*.{md,mdx,txt}'
  - 'docs/**'
  - 'LICENSE'

# ASSET FILES
asset_files: &asset_files
  - '**/*.{svg,png}'

# LOW LEVEL TEST FILES
low_level_test_files: &low_level_test_files
  - '**/*.test.{js,ts,tsx,jsx}'
  - '**/*.stories.*'
  - '**/*.snap'

# CONFIG FILES
config_files: &config_files
  - '.eslint*'
  - '.prettier*'
  - 'tailwind.config.js'
  - 'sonar-project.properties'
  - 'codecov.yml'
  - 'crowdin.yml'
  - 'coverage-thresholds.json'
  - '.editorconfig'
  - '.watchmanconfig'
  - '.gitignore'

# CI/GITHUB FILES — overridden by e2e_related_workflows below
ci_files: &ci_files
  - '.github/**'

# Shared smoke / Appium paths that request both platforms on PRs targeting main.
e2e_smoke_infra: &e2e_smoke_infra
  - 'tests/page-objects/**'
  - 'tests/selectors/**'
  - 'tests/locators/**'
  - 'tests/framework/**'
  - 'tests/helpers/**'
  - 'tests/smoke-appium/**'

# E2E / PERFORMANCE TEST FILES
e2e_test_files: &e2e_test_files
  - 'tests/performance/**'
  - *e2e_smoke_infra
  - 'tests/flows/**'
  - 'tests/api-mocking/**'
  - 'tests/scripts/**'
  - 'tests/reporters/**'
  - 'tests/tools/e2e-ai-analyzer/**'
  - 'tests/playwright*.config.ts'
  - 'tests/playwright.*.config.ts'
  - 'tests/helpers.js'
  - 'tests/tags.js'
  - 'tests/tags.performance.js'
  - 'tests/teams-config.js'

# ALL IGNORABLE FILES - safe to skip E2E
e2e_ignorable: &e2e_ignorable
  - *documentation_files
  - *asset_files
  - *low_level_test_files
  - *config_files
  - *ci_files

# Union of ignorable + E2E test files for test-only change detection.
e2e_test_or_ignorable:
  - *e2e_ignorable
  - *e2e_test_files

# Spec files used for flakiness detection on PRs targeting main (run changed specs twice).
# Kept separate from all_changes so only this short list is passed through
# workflow outputs/env vars — the full list overflows ARG_MAX on large PRs.
e2e_spec_files:
  - '**/*.spec.{ts,js}'

# Component view test files — same pattern as e2e_spec_files: kept separate so
# only this short list flows through workflow outputs. The component view
# flakiness detection job re-runs added/modified files N times on PRs
# targeting main.
cv_test_files:
  - '**/*.view.test.{ts,tsx}'

# App source files, used to scope Jest coverage to the files a PR touches.
# Test and test-support files are dropped in get-requirements.yml.
app_source_files:
  - 'app/**/*.{js,ts,tsx,jsx}'

# Smart E2E contract tests only run when the mode/action changes. The analyzer
# pin lives in the action, so analyzer version bumps are included here too.
smart_e2e_contracts:
  - '.ai-pr-analyzer/modes/smart-e2e/**'
  - '.github/actions/smart-e2e-selection/**'

e2e_relevant_workflows:
  - '.github/workflows/ci.yml'
  - '.github/workflows/get-requirements.yml'
  - '.github/workflows/build-android-e2e.yml'
  - '.github/workflows/build-ios-e2e.yml'
  - '.github/workflows/run-e2e-*.yml'
  - '.github/workflows/run-appium-*.yml'
  - '.github/workflows/prime-appium-e2e-android-emulator.yml'
  - '.github/workflows/run-performance-e2e*.yml'
  - '.github/workflows/update-e2e-fixtures.yml'
  - '.github/workflows/build.yml'
  - '.github/workflows/performance-test-runner.yml'
  - '.github/actions/download-e2e-artifact/**'
  - '.github/actions/dual-upload-e2e-artifact/**'
  - '.github/actions/setup-e2e-env/**'
  - '.github/actions/smart-e2e-selection/**'
  - '.github/scripts/qa-automation/appium-runner-prep/**'
  - '.github/scripts/qa-automation/reporting/**/*.mjs'
  - '.github/scripts/qa-automation/e2e-sharding/**/*.mjs'
  - '.github/scripts/qa-automation/stats/e2e-freeze-timings.mjs'
  - '.github/scripts/qa-automation/e2e-ci-orchestration/**'

android:
  - 'android/**'

ios:
  - 'ios/**'

# Combined filters for platform-only detection — avoids double-counting files that
# match both a platform filter (ios/**, android/**) and an ignorable pattern (e.g. **/*.md).
# dorny/paths-filter counts each file once per filter, so these give the correct union count.
android_or_ignorable:
  - 'android/**'
  - *e2e_ignorable

ios_or_ignorable:
  - 'ios/**'
  - *e2e_ignorable

# JEST RELATED-TESTS TIER
# A change to any of these runs the full suite instead of only the related
# tests: config, manifests and lockfile affect every test, and setup files,
# mocks and shared view or integration helpers are loaded without being
# imported, so the import graph cannot link them to any test.
jest_full_run_triggers:
  - 'jest.config*.js'
  - 'babel.config*.js'
  - 'scripts/babel/**'
  - 'package.json'
  - 'yarn.lock'
  - 'patches/**'
  - 'app/util/test/**'
  - '**/__mocks__/**'
  - 'tests/component-view/**'
  - 'tests/integration/**'

# Jest cannot follow a deleted or renamed path, so the tests that imported it
# would not be selected.
jest_removed_files:
  - deleted|renamed: '**'

# JEST DOCS-ONLY DETECTION
# Used to skip the unit, component-view and integration Jest jobs on pull
# requests whose changes are all under docs/. Deliberately stricter than
# e2e_ignorable: test files, snapshots, configs, .github changes and assets
# elsewhere in the repo can all affect Jest results, so they never count as
# docs here. Markdown outside docs/ does not count either.
# Skip only when jest_skippable_docs matches every changed file.
# Known edge case, accepted: docs/assets/nft-fallback.png is imported by app
# code (CollectibleMedia.tsx). Metro reads it, but Jest maps .png to a mock, so
# a PR that only deletes or renames it still skips Jest.
jest_skippable_docs:
  - 'docs/**'

all_changes:
  - '**'
