# Please see the documentation for all configuration options:
# https://docs.zizmor.sh/configuration/

rules:
  overprovisioned-secrets:
    ignore:
      - build.yml
      - build-rc-repack.yml
      - build-android-upload-to-testmu.yml
      - eas-update-platform.yml

  dependabot-cooldown:
    config:
      # Change the minimum allowed cooldown period for Dependabot to 3 days.
      days: 3

  unpinned-uses:
    config:
      policies:
        # Allow `actions/*` and `MetaMask/*` to be pinned to a version instead
        # of only to a commit hash.
        actions/*: ref-pin
        MetaMask/*: ref-pin
        aws-actions/*: ref-pin
        metamask/*: ref-pin
