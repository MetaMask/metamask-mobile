# Single source of truth for who is paged when `dependency-audit-escalation.yml`
# finds a new production advisory (moderate severity or above) via `yarn audit:ci`.
#
# To rotate the owner or manager, edit this file and open a normal PR — no
# workflow or secret changes are required.
#
# `slack_id` values must be Slack *member IDs* (e.g. "U0XXXXXXXXX"), not
# display names or @handles — only member IDs render as a notifying mention
# in `chat.postMessage`. Find a member ID via their Slack profile > "Copy
# member ID".
#
# `slack_channel` should be a Slack *channel ID* (e.g. "C0XXXXXXXXX"), not a
# channel name, so the bot posts reliably even if the channel is renamed.
# TODO: replace with the "npm-audit" channel's ID (channel details > "Copy
# channel ID") — a name works with chat.postMessage but is fragile if renamed.

slack_channel: 'npm-audit'

owner:
  # GitHub handle: assigned as the PR/issue author's reviewer and assignee.
  github: 'tommasini'
  # TODO: fill in the owner's Slack member ID so the escalation Slack
  # message actually notifies them (see comment above).
  slack_id: 'U03770ZA84A'
# Manager escalation is disabled for now — uncomment and fill in a
# manager.slack_id to re-enable the second @-mention in the Slack message.
# manager:
#   slack_id: 'U0YYYYYYYYY'
