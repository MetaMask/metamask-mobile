pluginManagement {
    includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().toString())
    // Expo SDK 55 replaced the old `expo/scripts/autolinking.gradle` Groovy script
    // with the `expo-autolinking-settings` Gradle plugin, which lives in this
    // included build. Including it here makes `id("expo-autolinking-settings")` resolvable.
    includeBuild(new File(["node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim(), "../android/expo-gradle-plugin").toString())
    repositories {
        gradlePluginPortal()
        mavenLocal()
        google()
    }
}
plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      'node',
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'MetaMask'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile())
includeBuild('../node_modules/@react-native') {}
// Build React Native and Hermes from the patched local sources. Without this
// substitution Gradle resolves prebuilt Maven artifacts, so Hermes' source
// patches (JNI disable binding and Android signal delivery) never reach the APK.
includeBuild('../node_modules/react-native') {
    dependencySubstitution {
        substitute(module("com.facebook.react:react-android")).using(project(":packages:react-native:ReactAndroid"))
        substitute(module("com.facebook.react:react-native")).using(project(":packages:react-native:ReactAndroid"))
        substitute(module("com.facebook.react:hermes-android")).using(project(":packages:react-native:ReactAndroid:hermes-engine"))
        substitute(module("com.facebook.react:hermes-engine")).using(project(":packages:react-native:ReactAndroid:hermes-engine"))
    }
}
include ':react-native-gesture-handler'
project(':react-native-gesture-handler').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-gesture-handler/android')

// React Native and Hermes are intentionally built from the patched local source
// above for this performance branch.

// MMQA-2230: Detox `:detox` include (node_modules/detox/android/detox) removed.
// Appium smoke owns E2E; keeping the include without the npm package breaks
// assemble*AndroidTest variant resolution.

// Expo SDK 55+ autolinking: provided by the `expo-autolinking-settings` plugin
// applied above (replaces the removed `expo/scripts/autolinking.gradle`).
expoAutolinking.useExpoModules()
