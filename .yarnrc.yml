compressionLevel: mixed

enableGlobalCache: false

enableScripts: false

nodeLinker: node-modules

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-preview-builds.cjs
    spec: '@yarnpkg/plugin-preview-builds'
  - path: .yarn/plugins/plugin-tooling-insight.cjs
    spec: .yarn/plugins/plugin-tooling-insight.cjs

yarnPath: .yarn/releases/yarn-4.14.1.cjs

# Allowlist of git dependencies. Empty to block all git deps.
approvedGitRepositories: ['MetaMask/react-native-aes-crypto-forked']

# Configure the NPM minimal age gate to 3 days, meaning packages must be at
# least 3 days old to be installed.
npmMinimalAgeGate: 4320 # 3 days (in minutes)

# Override the minimal age gate, allowing certain packages to be installed
# regardless of their publish age.
npmPreapprovedPackages:
  - '@metamask/*'
  - '@metamask-previews/*'
  - '@lavamoat/*'
  - '@consensys/*'

npmAuditIgnoreAdvisories:
  # decode-uri-component (MCWP-1049)
  - '1147955' # GHSA-vcc3-ghjq-m6fr moderate
  - '1243857' # GHSA-qr28-fpjm-wq7f high
  # @graphql-tools/utils (MCWP-1041)
  - '1241230' # GHSA-7mx3-vvmw-hjmv high
  # uuid (MCWP-1064)
  - '1119441' # GHSA-w5hq-g745-h8pq moderate
  # zod (MCWP-1150)
  - '1243066' # GHSA-mrhx-c7xc-m3w5 high
